<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>なぞとき（体験版）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f3efe6'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23c8553d' stroke-width='2.4'/%3E%3Ctext x='16' y='22' font-size='14' font-family='serif' font-weight='700' fill='%23c8553d' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  /* 和紙のトーン（参加者の画面と同じ値をつかう） */
  :root{
    --paper:#f3efe6; --ink:#2b3244; --gold:#8c6b1e; --vermilion:#c8553d;
    --onInk:#efeadd; --edge:#545c70;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{display:flex;flex-direction:column;background:var(--paper);
    font:13px/1.5 "Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
  .bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--ink);color:var(--onInk);padding:6px 12px;font-size:12px;
    box-shadow:inset 0 -2px 0 var(--vermilion)}
  .bar b{color:#fff;font-weight:700;letter-spacing:.08em;
    font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
  .bar .sp{flex:1}
  .bar a.home{color:#c9cfdd;text-decoration:none}
  .tabs{display:flex;gap:6px}
  .tabs button{font:inherit;font-size:12px;color:var(--onInk);background:transparent;
    border:1px solid var(--edge);border-radius:999px;padding:3px 13px;cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
  .bar .key{color:#e3c98a}
  .bar button.rst{font:inherit;font-size:12px;color:var(--onInk);background:transparent;
    border:1px solid var(--edge);border-radius:999px;padding:3px 12px;cursor:pointer}
  /* 2つの画面をどちらも先に読み込んでおき、見せる方だけ前に出す。
     src を入れ替えるやりかただと、読み込みのあいだ前の画面が残るので、
     押しても変わらないように見えていた（2026-09-18 の直し）。
     大きさは両方そのまま持たせる（display:none にすると、出したときに並びが崩れるため）。 */
  .stage{flex:1 1 auto;position:relative;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .stage iframe[data-off]{opacity:0;pointer-events:none;z-index:0}
  .stage iframe:not([data-off]){opacity:1;z-index:1}
</style>
</head>
<body>
<div class="bar">
  <b>体験版</b><span>データは架空で、閉じると消えます</span>
  <div class="tabs">
    <button id="tP" type="button" aria-pressed="true">参加者の画面（携帯）</button>
    <button id="tA" type="button" aria-pressed="false">運営の画面（PC）</button>
  </div>
  <span class="key" id="hint">なまえを入れて始めます</span>
  <span class="sp"></span>
  <button class="rst" id="rst" type="button">はじめに戻す</button>
  <a class="home" href="../../">tools</a>
</div>
<div class="stage">
  <iframe id="play" src="play/index.html?s=D001" title="参加者の画面"></iframe>
  <iframe id="admin" data-off inert title="運営の画面"></iframe>
</div>
<script>
  try { new Image().src = 'https://script.google.com/macros/s/AKfycbx60H_bXkfaEXrwhLvp4MOIH6wmtw414pembss8iu5VVb5_UAE3AmOnyIRk5Y4ak02Ouw/exec?app=AP003&k=demo'; } catch (e) {}

  var PLAY_SRC = 'play/index.html?s=D001';
  var ADMIN_SRC = 'admin/index.html';
  var play = document.getElementById('play');
  var admin = document.getElementById('admin');
  var tP = document.getElementById('tP');
  var tA = document.getElementById('tA');
  var now = 'play';

  /* 運営の画面は、参加者の画面が出そろってから裏で読み込んでおく。
     こうしておくと、押した瞬間に切り替わる。 */
  function warm() { if (!admin.getAttribute('src')) admin.src = ADMIN_SRC; }
  play.addEventListener('load', function () { setTimeout(warm, 200); });
  setTimeout(warm, 1500);

  function go(which) {
    if (which === now) return;
    now = which;
    if (which === 'admin') warm();
    var on = which === 'admin' ? admin : play;
    var off = which === 'admin' ? play : admin;
    on.removeAttribute('data-off'); on.removeAttribute('inert');
    off.setAttribute('data-off', ''); off.setAttribute('inert', '');
    tP.setAttribute('aria-pressed', which === 'play' ? 'true' : 'false');
    tA.setAttribute('aria-pressed', which === 'admin' ? 'true' : 'false');
    document.getElementById('hint').textContent =
      which === 'admin' ? '合言葉は demo' : 'なまえを入れて始めます';
    try { on.contentWindow.focus(); } catch (e) {}
  }
  tP.onclick = function () { go('play'); };
  tA.onclick = function () { go('admin'); };

  document.getElementById('rst').onclick = function () {
    try {
      var ls = play.contentWindow.localStorage;
      for (var i = ls.length - 1; i >= 0; i--) {
        var k = ls.key(i);
        if (k && (k.indexOf('demo_nazo') === 0 || k.indexOf('nazotoki_') === 0)) ls.removeItem(k);
      }
    } catch (e) {}
    play.src = PLAY_SRC;
    if (admin.getAttribute('src')) admin.src = ADMIN_SRC;
    go('play');
  };
</script>
</body>
</html>

<!DOCTYPE html>
<meta charset="utf-8">
<script src="../fake.js"></script>
<!-- interactive-widget=resizes-content … キーボードが出たら、その分だけ見える領域を縮める
     （Android Chrome が読む。iOS は読み飛ばす）。答えの欄を押したときの寄せ直しが同じように効く。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- フォントは描画を止めない（media=print で読み、届いたら all にする）。
     届くまでは fallback で出る（css2 の display=swap も付けてある）。 -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"></noscript>
<!-- CSS と JS は build.mjs が流し込む（style と script のタグごと差し替える）。
     この骨には、ページの設定（シナリオID・ノードID・つなぎ先）だけを置く。 -->
<style>
/* ===== play/css/base.css ===== */
  *{box-sizing:border-box}
  /* 地は html と body の両方に同じものを付ける（2026-09-17 中地さんの写し。
     下までスクロールすると、和紙の模様が途中で終わって、その下が白っぽく見えていた）。
     前は html,body を height:100% にしていたので、地の「貼り付け先」が画面1つ分の高さで決まり、
     cover で伸ばしている紙の陰が、そこから下に無かった。いまは高さを決めず、
     body に min-height を置く（対応していれば 100dvh、だめなら 100vh）。
     画面を入れ替えたあとの scrollTo(0,0) が、ブラウザのスクロールの固定に
     押し戻されないように overflow-anchor も切る（2026-09-17。app.js の scrollTop() と対）。 */
  html{ overflow-anchor:none; background-color:var(--bg) }
  body{ margin:0; background-color:var(--bg); color:var(--ink);
        min-height:100vh; min-height:100dvh;
        font-family:var(--gothic);
        font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%; }
  .wrap{max-width:560px; margin:0 auto; padding:8px 14px 48px}

  /* 上の帯（イベント名と、いまの人の名前） */
  .bar{ display:flex; justify-content:space-between; align-items:center; gap:10px;
        font-size:11px; color:var(--sub); min-height:20px; margin-bottom:7px }
  .bar .ev{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .bar .who{ flex:none; max-width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
             padding:2px 8px; border-radius:8px; border:1px solid var(--line);
             -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .bar .who:empty{ border-color:transparent; padding:0 }
  /* 試験環境の札（2026-09-18）。base が /stg のときだけ call.js の nzStgTag が hidden を外す。
     本番と間違えないための印なので、テーマの変数を使わず決め打ちの赤にする（4テーマとも読める） */
  .bar .stgtag{ flex:none; background:#d7263d; color:#fff; font-family:var(--mono); font-size:9.5px;
        font-weight:700; letter-spacing:.14em; padding:1px 7px; border-radius:4px; margin-right:auto }
  .bar .stgtag[hidden]{ display:none }
  /* 管理者モード（app.js が .bar に data-admin="1" を付ける）。
     2026-09-17 帯全体を金色に塗るのをやめた。残すのは帯の下辺の1px の金の線だけで、
     「管理者で入っている」ことがどの画面でも静かに分かるようにする。
     金はテーマごとの --gold（theme-*.css）。黒テーマでも読める明るさにしてある */
  .bar[data-admin="1"]{ box-shadow:inset 0 -1px 0 var(--gold) }
  /* なまえの札を、小さな金の札（pill）にする。左に6pxの丸い点を1つ */
  .bar[data-admin="1"] .who{ display:inline-flex; align-items:center; gap:6px;
        padding:2px 8px; border-radius:999px; border:1px solid var(--gold); background:transparent;
        font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.14em; color:var(--gold) }
  .bar[data-admin="1"] .who:before{ content:""; flex:none; width:6px; height:6px;
        border-radius:50%; background:var(--gold) }

  h1.ttl{ font-size:20px; line-height:1.45; margin:0 0 10px; font-weight:700; letter-spacing:.02em }
  h2.ttl{ font-size:17px; line-height:1.5; margin:0 0 6px; font-weight:700; letter-spacing:.02em }
  .lead{ font-size:13px; color:var(--sub); margin:0 0 12px; white-space:pre-wrap }
  .body{ font-size:16px; white-space:pre-wrap; word-break:break-word; margin:0 0 6px }
  img.pic{ display:block; width:100%; max-height:36vh; object-fit:contain; border-radius:10px; margin:10px 0 }
  img.logo{ display:block; max-width:70%; max-height:96px; object-fit:contain; margin:0 auto 12px }
  audio.pic{ display:block; width:100%; margin:10px 0 }

  /* 題名の行。左に題名、右に「もう一度…」の小さな文字リンク（2026-09-17） */
  .ttlrow{ display:flex; align-items:baseline; gap:12px; margin:0 }
  .ttlrow > h1.ttl, .ttlrow > h2.ttl{ margin:0; min-width:0; flex:1 1 auto }
  .mdAgains{ flex:none; display:flex; align-items:baseline; gap:12px; margin-left:auto }

  /* ===== 開始時の演出（media）。2026-09-17 に作り替えた =====
     動画は操作ボタンを出さず、上を触っても止まらない（pointer-events:none）。
     枠は動画の縦横比どおり。幅は枠いっぱい、高さは画面の 50% まで（幅の上限は media.js が入れる）。 */
  .mdWrap{ position:relative; margin:12px 0 }
  .mdWrap + .body.qtext{ margin-top:12px }
  video.pic{ display:block; width:100%; height:auto; max-height:50vh; object-fit:contain;
             background:#000; border-radius:10px; margin:10px 0 }
  .mdWrap video.pic{ margin:0 }
  video.pic.media{ pointer-events:none }
  /* 全画面。メイン画面の上にかぶせる。下は触れない。消えるときは 0.6秒かけて薄くする */
  .mdLayer{ position:fixed; inset:0; z-index:9000; background:#000;
            display:flex; align-items:center; justify-content:center;
            opacity:1; transition:opacity .6s linear }
  .mdLayer.out{ opacity:0 }
  .mdLayer video.pic{ width:100%; height:100%; max-height:none; max-width:none;
                      margin:0; border-radius:0; object-fit:contain }
  /* 「とばす」。動画の右下に置く小さな札（2026-09-17）。
     地はすりガラス、縁は白の 1px。見た目は小さく、押せる高さは 32px を保つ。
     出るときは 0.3秒でふわっと（display:none から出るので transition ではなく animation） */
  .mdSkip{ position:absolute; right:10px; bottom:10px; z-index:2;
           display:inline-flex; align-items:center; justify-content:center; min-height:32px;
           font-family:var(--mono); font-size:11px; letter-spacing:.14em; line-height:1;
           padding:5px 12px; border-radius:999px; cursor:pointer; white-space:nowrap;
           color:rgba(255,255,255,.9); background:rgba(0,0,0,.45);
           border:1px solid rgba(255,255,255,.35);
           -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px) }
  /* display を入れたので、hidden を効かせ直す（ブラウザの [hidden]{display:none} より強いため） */
  .mdSkip[hidden]{ display:none }
  .mdSkip:not([hidden]){ animation:mdSkipIn .3s linear both }
  @keyframes mdSkipIn{ from{ opacity:0 } to{ opacity:1 } }
  /* 全画面のときは画面の右下（下は端末の安全な余白のぶん上げる） */
  .mdLayer .mdSkip{ right:20px; bottom:calc(20px + env(safe-area-inset-bottom, 0px)) }
  /* 「タップして再生」。自動再生を断られたときだけ、動画の上に1つだけ出す */
  .mdTap{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:3;
          font:inherit; font-size:17px; font-weight:700; padding:16px 26px; border-radius:999px; cursor:pointer;
          color:#111; background:#fff; border:none; box-shadow:0 6px 20px rgba(0,0,0,.35) }
  /* 音声だけのノードには動画の枠が無いので、「タップして再生」はふつうの行として置く（2026-09-18） */
  .mdTapRow{ display:flex; justify-content:center; margin:12px 0 }
  .mdTapRow:empty, .mdTapRow:has(> .mdTap[hidden]){ margin:0 }
  .mdTap.mdTapA{ position:static; left:auto; top:auto; transform:none; width:auto; min-height:0 }
  .mdTap[hidden]{ display:none }
  /* 「もう一度動画を見る」「もう一度音声を聞く」。題名の行の右に置く小さな文字リンク（2026-09-17）。
     ボタンだが枠も地も持たない。頭に「↻」を1つ。.go の width:100% などを上書きする */
  button.mdAgain{ display:inline-block; width:auto; min-height:0; margin:0; padding:0;
                  border:0; background:none; text-decoration:none; cursor:pointer;
                  font-family:var(--mono); font-size:10.5px; font-weight:400; letter-spacing:.1em;
                  line-height:1.4; color:var(--muted); white-space:nowrap }
  button.mdAgain:before{ content:"\21bb"; margin-right:4px }
  button.mdAgain:hover{ color:var(--ink) }
  /* display を上書きしたので、hidden を効かせ直す（ブラウザの [hidden]{display:none} より強いため） */
  button.mdAgain[hidden]{ display:none }
  @media (prefers-reduced-motion: reduce){ .mdLayer{ transition:none } .mdSkip:not([hidden]){ animation:none } }

  .ans{ margin-top:16px }
  .btn{ display:block; width:100%; min-height:50px; margin:0 0 10px; padding:11px 14px;
        font:inherit; font-size:16px; line-height:1.5; text-align:left; color:var(--ink);
        background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius); cursor:pointer }
  .btn:active{ background:var(--tap) }
  .btn:disabled{ opacity:.6 }
  .go{ display:block; width:100%; min-height:46px; padding:10px 16px; margin-top:4px;
       font:inherit; font-size:16px; font-weight:700; color:var(--accentInk); background:var(--accent);
       border:none; border-radius:var(--radius); cursor:pointer }
  .go:active{ opacity:.85 }
  .go:disabled{ opacity:.5 }
  .thin{ background:var(--card); color:var(--sub); border:1px solid var(--line); font-weight:400; font-size:13.5px; min-height:38px }
  .ghost{ background:transparent; color:var(--accent); border:1.5px solid var(--accent); font-weight:700 }
  .ghost:disabled{ color:var(--muted); border-color:var(--line) }

  label.lab{ display:block; font-size:13px; color:var(--sub); margin:0 0 5px }
  input[type=text]{ display:block; width:100%; min-height:42px; padding:9px 12px; margin-bottom:12px;
        font:inherit; font-size:16px; color:var(--ink); background:var(--card);
        border:1.5px solid var(--line); border-radius:var(--radius) }

  .wrongtx{ color:var(--wrong); font-size:15px; white-space:pre-wrap; margin:13px 0 0 }
  .hint{ background:var(--hintBg); color:var(--hint); border-radius:10px; padding:11px 13px; margin:12px 0 0;
         font-size:15px; white-space:pre-wrap }
  .fb{ border:1.5px solid var(--accent); border-radius:var(--radius); padding:14px; margin:0 0 15px;
       font-size:16px; white-space:pre-wrap; background:var(--card) }
  .code{ text-align:center; font-size:26px; font-weight:700; letter-spacing:.12em; padding:12px 10px;
         border:2px dashed var(--accent); border-radius:var(--radius); margin:15px 0 6px; word-break:break-all }
  .codeLab{ text-align:center; font-size:12px; color:var(--sub); margin:0 }
  .qr{ border:1.5px dashed var(--line); border-radius:var(--radius); padding:15px 14px }
  .qr .big{ font-size:17px; font-weight:700; margin-bottom:7px; text-align:center }

  .net{ margin-top:20px; font-size:11.5px; color:var(--sub); white-space:pre-wrap }
  .say{ position:fixed; left:12px; right:12px; bottom:12px; max-width:534px; margin:0 auto;
        background:var(--card); color:var(--ink); border:1px solid var(--line);
        border-radius:10px; padding:12px 14px; font-size:14px;
        box-shadow:0 4px 14px rgba(0,0,0,.18); display:none; }
  .say.on{ display:block }

  /* ===== ここから B案（段階1）で足した部品 ===== */
  .card{ background-color:var(--card); border:1px solid var(--line); border-radius:var(--radius);
         padding:15px 14px; box-shadow:0 1px 0 rgba(0,0,0,.03), 0 6px 18px -14px rgba(0,0,0,.35) }
  .card + .card{ margin-top:11px }

  .meta{ display:flex; justify-content:space-between; align-items:baseline; gap:8px;
         font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--muted) }
  .mono{ font-family:var(--mono); letter-spacing:.06em }

  /* 順路バー。押すと進捗ホームへ */
  .route{ display:flex; gap:4px; margin:10px 0 0; padding:0; border:0; background:none; width:100%; cursor:pointer }
  .route span{ flex:1; height:4px; border-radius:2px; background:var(--line); transition:background .3s }
  .route span.done{ background:var(--accent) }
  .route span.now{ background:var(--accent); box-shadow:0 0 0 2px rgba(140,107,30,.18) }
  .route-legend{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:9.5px;
                 color:var(--muted); margin-top:4px; letter-spacing:.04em }

  /* 移動案内の「つぎの会場」の行。右はしに「もう一度…」が入ることがあるので flex（2026-09-17） */
  .seeline{ display:flex; flex-wrap:wrap; align-items:baseline;
            margin:12px 0 0; padding-bottom:8px; border-bottom:1px solid var(--line); font-size:13px; color:var(--ink) }
  .seeline b{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted); font-weight:500 }
  .seeline .sep{ color:var(--line); margin:0 7px }
  .seeline .what{ font-weight:700 }
  /* 補助解説（問題文の下。ノードの see 列）。
     2026-09-17 囲みと左の縁をやめ、ふつうの段落にした（問題文より目立っていたため）。
     同日ふたたび、頭に細い「—」を1つ付けて、補足だと分かるようにした */
  .subnote{ margin:7px 2px 9px; padding:0; font-size:12px; line-height:1.65;
            color:var(--muted); white-space:pre-wrap }
  .subnote:before{ content:"\2014\00a0" }

  .figure{ margin:11px 0 0; padding:11px 10px; text-align:center; background-color:var(--inset);
           border:1px solid var(--line); border-radius:8px; font-family:var(--mono); font-size:14.5px;
           letter-spacing:.12em; color:var(--ink); overflow-x:auto; white-space:nowrap }

  .field{ width:100%; min-height:42px; padding:9px 12px; margin-top:9px; font-family:var(--gothic);
          font-size:15.5px; color:var(--ink); background:var(--card); border:1px solid var(--line);
          border-radius:8px; -webkit-appearance:none; appearance:none }
  .field:focus{ outline:none; border-color:var(--accent) }
  .note{ font-size:11.5px; color:var(--muted); margin:6px 0 0 }
  .fixed{ display:flex; align-items:center; gap:8px; min-height:42px; margin-top:9px; padding:9px 12px;
          border-radius:8px; background:var(--mossBg); border:1px solid var(--mossEdge); color:var(--moss); font-size:14.5px }
  .fixed .lb{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; opacity:.85 }
  .fixed .ck{ margin-left:auto; font-size:14px }
  .fixed.off{ background:var(--inset); border-color:var(--line); color:var(--muted) }

  .verdict{ margin-top:10px; padding:10px 12px; border-radius:8px; font-size:13.5px; border:1px solid; white-space:pre-wrap }
  .verdict.near{ background:var(--nearBg); border-color:var(--nearEdge); color:var(--nearInk) }
  .verdict.bad{ background:var(--wrongBg); border-color:var(--wrong); color:var(--wrong) }

  .hints{ margin-top:15px; padding-top:12px; border-top:1px solid var(--line) }
  .hint-locked{ min-height:40px; display:flex; align-items:center; margin-top:8px; padding:9px 12px;
                border:1px dashed var(--line); border-radius:8px; font-family:var(--mono); font-size:11px;
                color:var(--muted); letter-spacing:.04em }
  .hint-open{ margin-top:8px; padding:10px 12px 10px 11px; background:var(--hintBg); border:1px solid var(--hintEdge);
              border-left:3px solid var(--accent); border-radius:0 8px 8px 0; font-size:13px; color:var(--hint);
              white-space:pre-wrap }
  .hint-open b{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--accent); display:block; font-weight:500 }

  .staff{ text-align:right; margin-top:13px }
  .staff .open{ background:none; border:0; padding:6px; font-family:var(--mono); font-size:10px;
                color:var(--muted); letter-spacing:.08em; cursor:pointer }
  .staffbox{ margin-top:8px; padding:12px; border:1px solid var(--line); border-radius:8px;
             background:var(--inset); text-align:left }
  .staffbox .field{ margin-top:0 }

  /* スタンプ */
  .stampwrap{ position:relative; display:flex; justify-content:center; align-items:center; height:150px; margin-top:6px }
  .bleed{ position:absolute; width:136px; height:136px; border-radius:50%;
          background:radial-gradient(circle, rgba(200,85,61,.17) 0%, rgba(200,85,61,.07) 45%, rgba(200,85,61,0) 72%); opacity:0 }
  .stamp{ width:112px; height:112px; opacity:0 }
  .stamp img{ width:100%; height:100%; object-fit:contain }
  .animate .stamp{ animation:press .52s cubic-bezier(.2,.9,.25,1) .12s both }
  .animate .bleed{ animation:bleed 1.1s ease-out .28s both }
  .animate .shake{ animation:shake .34s ease-out .3s both }
  @keyframes press{ 0%{opacity:0;transform:scale(1.6) rotate(-9deg)} 55%{opacity:1;transform:scale(.97) rotate(-2.5deg)} 100%{opacity:1;transform:scale(1) rotate(-3.5deg)} }
  @keyframes bleed{ 0%{opacity:0;transform:scale(.55)} 30%{opacity:1} 100%{opacity:.55;transform:scale(1.12)} }
  @keyframes shake{ 0%{transform:translate(0,0)} 22%{transform:translate(-2px,1.5px)} 48%{transform:translate(2px,-1px)} 74%{transform:translate(-1px,.5px)} 100%{transform:translate(0,0)} }
  .fadeup{ opacity:0 }
  .animate .fadeup{ animation:fadeup .7s ease-out .82s both }
  @keyframes fadeup{ from{opacity:0;transform:translateY(9px)} to{opacity:1;transform:none} }

  /* スタンプ帳 */
  .slots{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:12px }
  .slots.n6{ grid-template-columns:repeat(6,1fr) }
  .slot{ aspect-ratio:1; border:1px dashed var(--line); border-radius:50%; display:flex; align-items:center;
         justify-content:center; background:var(--inset); overflow:hidden }
  .slot.got{ border-style:solid; border-color:var(--vermilion); background:var(--card) }
  .slot svg, .slot img{ width:100%; height:100%; object-fit:contain }
  .slot .n{ font-family:var(--mono); font-size:11px; color:var(--muted) }

  /* 年表（認定証） */
  .tl{ margin:16px 0 0; padding:0; list-style:none; position:relative }
  .tl:before{ content:""; position:absolute; left:21px; top:8px; bottom:8px; width:1px; background:var(--line) }
  .tl li{ position:relative; display:flex; gap:12px; align-items:center; padding:9px 0 }
  .tl .dot{ width:44px; height:44px; flex:none; border-radius:50%; background:var(--card);
            border:1px solid var(--line); display:flex; align-items:center; justify-content:center; z-index:1; overflow:hidden }
  .tl .dot.got{ border-color:var(--vermilion) }
  .tl .dot svg, .tl .dot img{ width:100%; height:100%; object-fit:contain }
  .tl .txt{ min-width:0 }
  .tl .st{ font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:.1em }
  .tl .an{ font-size:15.5px; font-weight:500; line-height:1.5; word-break:break-word }

  .cert{ text-align:center; padding-block:4px 2px }
  .cert .en{ font-family:var(--mincho); font-size:10px; letter-spacing:.32em; color:var(--vermilion); padding-left:.32em }
  .cert h1{ font-size:23px; font-weight:700; margin:7px 0 2px; letter-spacing:.14em; padding-left:.14em }
  .cert .sub{ font-size:12px; color:var(--sub); margin:0 }
  .divider{ display:flex; align-items:center; gap:9px; margin:14px 0 2px; color:var(--line) }
  .divider:before,.divider:after{ content:""; flex:1; height:1px; background:var(--line) }
  .divider span{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--muted) }
  .band{ height:9px; background:linear-gradient(180deg,#e0806a,var(--vermilion)); margin:18px -16px -18px; border-radius:0 0 9px 9px }

  /* 移動案内 */
  .mapbox{ margin-top:12px; height:118px; border:1px solid var(--line); border-radius:8px; background-color:var(--inset);
           display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px }
  .mapbox .to{ font-size:18px; font-weight:700; letter-spacing:.05em }

/** CSV の文を、2次元配列（行 × 欄）にほどく。設計図シートの読み込みで使う。
 *  ・`"…"` で囲んだ欄。その中の改行とカンマはそのまま中身になる
 *  ・囲みの中の `""` は、引用符そのもの1つ
 *  ・先頭の BOM（﻿）は落とす
 *  ・改行は CRLF・LF・CR のどれでもよい
 *  ・いちばん終わりの空行（最後の改行のぶん）は落とす。途中の空行は1欄の行として残す
 *    （設計図シートの読み込み側が、題名も本文も種類も空の行をとばす） */
function nzCsvRows(text) {
  var s = String(text === undefined || text === null ? '' : text);
  if (s.charAt(0) === '﻿') s = s.slice(1);
  var rows = [], row = [], cell = '', q = false, i = 0, c;
  while (i < s.length) {
    c = s.charAt(i);
    if (q) {
      if (c === '"') {
        if (s.charAt(i + 1) === '"') { cell += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      cell += c; i++; continue;
    }
    if (c === '"') { q = true; i++; continue; }
    if (c === ',') { row.push(cell); cell = ''; i++; continue; }
    if (c === '\r' || c === '\n') {
      if (c === '\r' && s.charAt(i + 1) === '\n') i++;
      row.push(cell); cell = ''; rows.push(row); row = []; i++; continue;
    }
    cell += c; i++;
  }
  row.push(cell); rows.push(row);
  while (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();

}

  t = t.replace(/[ァ-ヶ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0x60); });
  t = t.replace(/[\s　]/g, '');
  t = t.replace(/[、。，．・「」『』（）()!！?？"'’”]/g, '');

/* もっと緩く寄せる（試作の index.html から移した）。
   長音符を落とし、小書きを大書きにし、お段・う段のあとの「う」を吸う。
   nzNorm は README のとおり長音符を落とさないので、これは
   blocksJson の looseKana が true のノードだけで使う（「キンタロー」を通すため）。 */

  t = t.replace(/([おこそとのほもよろごぞどぼぽ])う/g, '$1');

function edit1(a, b) {
  if (a === b) return false;
  var la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  if (la === lb) { var d = 0; for (var i = 0; i < la; i++) if (a.charAt(i) !== b.charAt(i)) { d++; if (d > 1) return false; } return d === 1; }
  var s = la < lb ? a : b, l = la < lb ? b : a, i2 = 0, j = 0, skip = 0;

    for (var j = 0; j < ws.length; j++) { var w = nzKey(ws[j], loose); if (w && w === t) return cs[i]; }
  }

  if (!url) return;
  try {
    SND = new Audio(url);
    SND.play();
  } catch (e) {}
}

/** ボタンの文。つぎに出す画面の種類で変える */
function okNextLabel() {
  var n = nzNode(PLAYER.nodeId);
  if (!n) return T('common.next');
  var k = String(n.kind || '');
  if (k === 'question') return T('ok.toQuestion');
  if (k === 'info' && String(n.template || '') === 'move') return T('ok.toMove');
  if (k === 'ending' || blk(n).ending) return T('ok.toClear');
  return T('common.next');
}

/* ===== play/js/blocks/answer.js ===== */
/* ---------- クエスチョン ---------- */
/** answerType=set の「まとまり」。group が同じ選択肢はひとつの答え */
function setGroups(n) {
  var cs = nzChoices(n.id), map = {}, order = [];
  cs.forEach(function (c, i) {
    var g = (c.group === '' || c.group === undefined || c.group === null) ? ('c' + i) : String(num(c.group));
    if (!map[g]) { map[g] = { g: g, cs: [], label: '' }; order.push(g); }
    map[g].cs.push(c);
    if (!map[g].label) map[g].label = String(c.label || '');
  });
  return order.map(function (g) { return map[g]; });
}
function groupHit(grp, text, loose) {
  var t = nzKey(text, loose);
  if (!t) return false;
  for (var i = 0; i < grp.cs.length; i++) {
    var ws = String(grp.cs[i].keywords || '').split(',');
    for (var j = 0; j < ws.length; j++) { var w = nzKey(ws[j], loose); if (w && w === t) return true; }
  }
  return false;
}

function verdictHtml() {
  var h = '';
  if (NEARTX) h += '<div class="verdict near">' + esc(NEARTX) + '</div>';
  if (WRONGTX) h += '<div class="verdict bad">' + esc(WRONGTX) + '</div>';
  if (HINTTX) h += '<div class="hint">' + esc(HINTTX) + '</div>';
  return h;
}
/** 古いテーマ向け（B案のブロックが無いノード）は今までの見た目のまま */
function wrongHtml() {
  return (NEARTX ? '<p class="wrongtx" style="color:var(--nearInk)">' + esc(NEARTX) + '</p>' : '')
    + (WRONGTX ? '<p class="wrongtx">' + esc(WRONGTX) + '</p>' : '')
    + (HINTTX ? '<div class="hint">' + esc(HINTTX) + '</div>' : '');
}
/** 継続問題（continueOnSame）が何段目か。1段目は continueOnSame でないノード。
 *  ①②③… の丸数字は、この番号から作る（steps.first の {prev} {next}） */
function carryStepNo(n) {
  var i = 1, cur = n, guard = 0;
  while (cur && yes(cur.continueOnSame) && guard++ < 20) {
    var p = carryPrevNode(cur);
    if (!p) break;
    i++; cur = p;
  }
  return i;
}
/** そのノードへ来る手前のノード（正解の出口・つぎ・選択肢のつなぎ先をたどる） */
function carryPrevNode(n) {
  var all = (DATA && DATA.nodes) || [];
  for (var i = 0; i < all.length; i++) {
    var p = all[i];
    if (p.id === n.id) continue;
    if (String(p.correctNodeId || '') === n.id || String(p.nextNodeId || '') === n.id) return p;
    var cs = nzChoices(p.id);
    for (var j = 0; j < cs.length; j++) if (String(cs[j].nextNodeId || '') === n.id) return p;
  }
  return null;
}
/** ⑤の2段階など。前のクエスチョンの答えを、上に確定表示して続ける。
 *  肩の小さな文字は blocksJson の carryLabel、無ければ前のノードの題名 */
function carryHtml(n) {
  if (!yes(n.continueOnSame)) return '';
  var la = PLAYER.lastAns;
  if (!la || !la.text) return '';
  var lb = String(blk(n).carryLabel || la.title || '');
  var st = carryStepNo(n);
  return '<div class="fixed"><span class="lb">' + esc(lb) + '</span>'
    + '<span>' + esc(la.text) + '</span><span class="ck">✓</span></div>'
    + '<p class="note">' + esc(TF('steps.first', { prev: maru(st - 1), next: maru(st) })) + '</p>';
}
/** 入れる欄の薄い字。blocksJson の placeholder（文字、または set のときは配列）。無ければ既定値 */
function phOf(n, i) {
  var p = blk(n).placeholder;
  if (Array.isArray(p)) return String(p[i] === undefined ? (T('q.ph') + ' ' + (i + 1)) : p[i]);
  if (p) return String(p);
  return Array.isArray(blk(n).placeholder) || String(n.answerType) === 'set' ? (T('q.ph') + ' ' + (i + 1)) : T('q.ph');
}

/* 答え方ごとの描き分け。**答え方を足すときはここに1つ関数を足して ANSWERS に載せるだけ**
   （DESIGN_B「広がりを見越した約束」。将来 photo / gps / qr など）。
   どの関数も (n, box, vh) を受け取り、box の中身を作って、押されたら answered() か submit系 を呼ぶ。 */
var ANSWERS = {
  choice: ansChoice,
  text: ansText,
  set: ansSet,
  none: ansNone,
};

function viewQuestion(n) {
  var at = String(n.answerType || 'none');
  var tl = blk(n).timeLimit;
  var right = tl ? '' : undefined;
  $('app').innerHTML = '<div class="card">' + headHtml(n, right) + mediaHtml(n)
    + '<div class="ans" id="ansBox"></div>' + hintsHtml(n) + '</div>' + mediaLayerHtml(n) + staffHtml(n);
  var box = $('ansBox');
  var isB = !!(blk(n).hints || blk(n).near);
  var vh = isB ? verdictHtml() : wrongHtml();
  (ANSWERS[at] || ansNone)(n, box, vh);
  bindAnsFocus(box);  // 答えの欄を押したとき、題名が上に隠れないように寄せ直す（2026-09-17）
  bindHints(n); bindStaff(n); startTimer(n);
  bindMedia(n);       // 開始時の演出（押された処理の中から同期的に play するので、ここで呼ぶ）
}

/* ---------- 答えの欄を押したときの寄せ直し（2026-09-17 中地さん・iPhone の写し） ----------
   スマホで答えの欄を押すとキーボードが出る。ブラウザは欄を見える所に運ぼうとして
   ページを上へ送るので、謎の題名が画面の外へ出てしまう（見えるのは問題文の途中から）。
   iOS Safari の標準の動きなので止められない。**あちらが寄せたあとに、こちらが寄せ直す。**
   寄せ先は題名の行。ただし 題名＋問題文＋入力欄 が見える領域に収まらない長い問題文のときは、
   題名をあきらめて問題文の枠の上に合わせる（入力欄が見えないほうが困るため）。
   それでも収まらないほど長い問題文のときは、入力欄が見えるぎりぎりまでしか下げない。
   blur（キーボードを閉じたとき）は何もしない。閉じれば自然に戻る。 */

/** いまのスクロール量 */
function ansScrollY() { return window.scrollY !== undefined ? window.scrollY : (window.pageYOffset || 0); }
/** 見える領域の高さ（キーボードが出ているあいだは visualViewport のほうが小さい） */
function ansViewH() {
  var vv = window.visualViewport;
  return (vv && vv.height) ? vv.height : (window.innerHeight || 0);
}
/** 寄せ先の2つ（題名の行と、問題文の枠）。答えの欄と同じカードの中から探す */
function ansAnchors(box) {
  var card = box;
  while (card && card !== document && String((card.className || '')).indexOf('card') < 0) card = card.parentNode;
  var root = (card && card.querySelector) ? card : document;
  return {
    head: root.querySelector('.ttlrow') || root.querySelector('h1.ttl'),
    qtext: root.querySelector('.body.qtext'),
  };
}
/** 寄せるための空き。ページが短いと、題名を上まで持ち上げられない
 *  （スマホはキーボードで見える所が半分になるので、たいてい足りない）。
 *  足りないぶんだけ、ページのいちばん下に空きを足す。欄から手が離れたら 0 に戻す。 */
function ansRoom(want) {
  var sp = document.getElementById('kbdRoom');
  var max = document.documentElement.scrollHeight - (window.innerHeight || 0) - (sp ? sp.offsetHeight : 0);
  var need = Math.max(0, Math.ceil(want - max) + 8);
  if (!need) { if (sp) sp.style.height = '0px'; return; }
  if (!sp) {
    sp = document.createElement('div');
    sp.id = 'kbdRoom';
    sp.setAttribute('aria-hidden', 'true');
    document.body.appendChild(sp);
  }
  sp.style.height = need + 'px';
}
/** 足した空きを片づける（画面が変わったとき。app.js の scrollTop から呼ぶ） */
function ansRoomClear() {
  var sp = document.getElementById('kbdRoom');
  if (sp) sp.style.height = '0px';
}
/** 欄から手が離れたとき。**いまの位置が動かない分だけ**空きを削る
 *  （いきなり 0 にすると、ブラウザがスクロールを押し戻してページが上へ跳ぶ） */
function ansRoomTrim() {
  var sp = document.getElementById('kbdRoom');
  if (!sp) return;
  var h = sp.offsetHeight;
  if (!h) return;
  var keep = ansScrollY() + (window.innerHeight || 0) - (document.documentElement.scrollHeight - h);
  sp.style.height = Math.max(0, Math.min(h, Math.ceil(keep))) + 'px';
}
/** 題名の行に合わせる。それだと入力欄が見える領域から出てしまうなら問題文の枠に、
 *  それでも出てしまうなら、入力欄が見えるぎりぎりまでしか下げない
 *  （20行のような長い問題文だと、題名も問題文の頭も入り切らない。入力欄が見えないほうが困る）。 */
function ansScrollFix(box, el) {
  var a = ansAnchors(box);
  if (!a.head && !a.qtext) return;
  var vv = window.visualViewport;
  var off = (vv && vv.offsetTop) || 0;      // iOS は見える領域そのものをずらすことがある
  var vh = ansViewH();
  var sy = ansScrollY();
  /* その節の上を、見える領域のいちばん上（8px 下）に置くためのスクロール量 */
  var yOf = function (e2) { return Math.max(0, e2.getBoundingClientRect().top + sy - off - 8); };
  /* 入力欄が見える領域に収まるために、最低これだけは下げないといけない量 */
  var need = el ? Math.max(0, el.getBoundingClientRect().bottom + sy - off - vh + 8) : 0;
  var y;
  if (a.head && yOf(a.head) >= need) y = yOf(a.head);
  else if (a.qtext && yOf(a.qtext) >= need) y = yOf(a.qtext);
  else y = need;
  ansRoom(y);
  try { window.scrollTo(0, y); } catch (e) {}
}
/** 答えの欄（input / textarea。複数の set の欄も）に focus したら寄せ直す */
function bindAnsFocus(box) {
  if (!box || !box.querySelectorAll) return;
  var els = box.querySelectorAll('input, textarea');
  for (var i = 0; i < els.length; i++) ansFocusOne(box, els[i]);
}
function ansFocusOne(box, el) {
  el.addEventListener('focus', function () {
    var run = function () { if (document.activeElement === el) ansScrollFix(box, el); };
    /* iOS は自分で欄を寄せたあとなので、こちらは遅れて2回上書きする */
    setTimeout(run, 300);
    setTimeout(run, 600);
    /* キーボードが出切って見える領域が縮んだとき（Android Chrome と、iOS 16 以降）に、もう一度だけ */
    var vv = window.visualViewport;
    if (!vv) return;
    var once = function () { vv.removeEventListener('resize', once); run(); };
    vv.addEventListener('resize', once);
    setTimeout(function () { vv.removeEventListener('resize', once); }, 1500);
  });
  /* 手が離れたとき（キーボードが閉じたとき）は**スクロールを動かさない**。自然に戻る。
     足しておいた空きだけ、位置が動かない分まで削る（ほかの欄へ移ったときは、そのまま残す） */
  el.addEventListener('blur', function () {
    setTimeout(function () {
      var a = document.activeElement;
      if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
      ansRoomTrim();
    }, 400);
  });
}

/** 選ぶ */
function ansChoice(n, box, vh) {
  var cs = nzChoices(n.id);
  if (!cs.length) { box.innerHTML = '<p class="wrongtx">' + esc(T('q.noChoice')) + '</p>'; return; }
  var html = carryHtml(n);
  for (var i = 0; i < cs.length; i++) html += '<button class="btn" data-i="' + i + '">' + esc(cs[i].label || '') + '</button>';
  box.innerHTML = html + vh;
  var bs = box.getElementsByClassName('btn');
  for (var j = 0; j < bs.length; j++) {
    bs[j].onclick = function () {
      var c = cs[num(this.getAttribute('data-i'))];
      var all = box.getElementsByClassName('btn');
      for (var k = 0; k < all.length; k++) all[k].disabled = true;
      answered(n, c, '');
    };
  }
}

/** 打つ */
function ansText(n, box, vh) {
  box.innerHTML = carryHtml(n)
    + '<input class="field" type="text" id="tx" placeholder="' + esc(phOf(n, 0)) + '" aria-label="' + esc(phOf(n, 0))
    + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="60">'
    + vh
    + '<button class="go" id="txGo">' + esc(T('q.answer')) + '</button>';
  $('tx').value = lastIn(n.id, 0);           // はずれても打った字は残す（試作と同じ）
  holdGo('txGo');
  var go = function () {
    if (Date.now() < LOCKUNTIL) return;
    var v = $('tx').value.trim();
    if (!v) { say(T('q.empty')); return; }
    keepIn(n.id, [v]);
    lockGo('txGo');
    submitText(n, v);
  };
  $('txGo').onclick = go;
  $('tx').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } };
}

/** 複数・順不同（choices.group のまとまりごと） */
function ansSet(n, box, vh) { viewSet(n, box, vh); }

/** 読むだけ */
function ansNone(n, box) {
  box.innerHTML = '<button class="go" id="nx">' + esc(T('common.next')) + '</button>';
  $('nx').onclick = function () {
    var next = String(n.nextNodeId || '');
    if (!next) { say(T('err.noNext')); return; }
    $('nx').disabled = true;
    nzLog({ nodeId: n.id, choiceId: '', inputText: '', result: 'next', nextNodeId: next });
    goTo(next);
  };
}

/** 送ってから2秒はボタンを押せない（二度押し・連打よけ） */
var LOCKUNTIL = 0;
function lockGo(id) {
  LOCKUNTIL = Date.now() + 2000;
  holdGo(id);
}
/** 画面を描き直したあとも、残り時間ぶんはボタンを押せないままにする */
function holdGo(id) {
  var left = LOCKUNTIL - Date.now();
  if (left <= 0) return;
  var b = $(id);
  if (!b) return;
  b.disabled = true;
  setTimeout(function () { var x = $(id); if (x) x.disabled = false; }, left);
}

/** 打った字の覚え（はずれて描き直したときに戻す）。ノードごとに持つ */
var LASTIN = {};
function keepIn(id, vals) { LASTIN[id] = vals; }
function lastIn(id, i) { var v = LASTIN[id]; return v && v[i] !== undefined ? v[i] : ''; }

function submitText(n, v) {
  var c = nzMatch(n, v);
  if (c) { NEARTX = ''; answered(n, c, v); return; }
  var nm = nearHit(n, v);
  if (nm) {
    var nb = blk(n).near || {};
    if (nb.countAsWrong) { PLAYER.wrong[n.id] = num(PLAYER.wrong[n.id]) + 1; savePlayer(); }
    /* 「惜しい」は 'near' として記録する（運営の集計で、ただの誤答と分けて数えるため） */
    nzLog({ nodeId: n.id, choiceId: '', inputText: v, result: 'near', nextNodeId: '' });
    nzFlush();
    NEARTX = nm; WRONGTX = ''; HINTTX = '';
    draw();
    return;
  }
  NEARTX = '';
  answered(n, null, v);
}

/** 複数・順不同（answerType=set）。当たったまとまりは確定表示にして残りを続けさせる */
function viewSet(n, box, vh) {
  var gs = setGroups(n);
  var done = PLAYER.setOk[n.id] || [];
  var h = carryHtml(n), rest = [];
  for (var i = 0; i < gs.length; i++) {
    if (done.indexOf(gs[i].g) >= 0) {
      h += '<div class="fixed"><span class="lb">' + esc(T('q.ph')) + ' ' + (i + 1) + '</span>'
        + '<span>' + esc(gs[i].label) + '</span><span class="ck">✓</span></div>';
    } else {
      rest.push(gs[i]);
      h += '<input class="field" type="text" id="sx' + rest.length + '" placeholder="' + esc(phOf(n, i))
        + '" aria-label="' + esc(phOf(n, i)) + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="60">';
    }
  }
  h += '<p class="note">' + esc(TF('set.lead', { n: gs.length })) + '</p>' + vh
    + '<button class="go" id="sxGo">' + esc(T('q.answer')) + '</button>';
  box.innerHTML = h;
  for (var q = 1; q <= rest.length; q++) $('sx' + q).value = lastIn(n.id, q - 1);
  holdGo('sxGo');
  var go = function () {
    if (Date.now() < LOCKUNTIL) return;
    var vals = [];
    for (var k = 1; k <= rest.length; k++) vals.push($('sx' + k).value.trim());
    var any = false;
    for (var k2 = 0; k2 < vals.length; k2++) if (vals[k2]) any = true;
    if (!any) { say(T('q.empty')); return; }
    keepIn(n.id, vals);
    lockGo('sxGo');
    submitSet(n, gs, rest, vals);
  };
  $('sxGo').onclick = go;
  for (var k3 = 1; k3 <= rest.length; k3++) {
    $('sx' + k3).onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } };
  }
}
function submitSet(n, gs, rest, vals) {
  var loose = !!blk(n).looseKana;
  var done = (PLAYER.setOk[n.id] || []).slice();
  var hitNow = [], used = {};
  for (var i = 0; i < vals.length; i++) {
    if (!vals[i]) continue;
    for (var j = 0; j < rest.length; j++) {
      if (used[rest[j].g]) continue;
      if (groupHit(rest[j], vals[i], loose)) { used[rest[j].g] = 1; hitNow.push(rest[j]); break; }
    }
  }
  if (hitNow.length === rest.length) {          // 残り全部そろった＝正解
    var c = null, cs = nzChoices(n.id);
    for (var m = 0; m < cs.length; m++) if (yes(cs[m].isCorrect)) { c = cs[m]; break; }
    PLAYER.setOk[n.id] = gs.map(function (g) { return g.g; });
    PLAYER.ansText[n.id] = gs.map(function (g) { return g.label; }).join(' ／ ');
    savePlayer();
    NEARTX = ''; WRONGTX = '';
    var joined = gs.map(function (g) { return g.label; }).join(' ／ ');
    answered(n, c || { id: '', isCorrect: true, label: joined, score: 0, feedback: '' }, joined);
    return;
  }
  if (hitNow.length) {                          // 片方だけ当たった
    hitNow.forEach(function (g) { if (done.indexOf(g.g) < 0) done.push(g.g); });
    PLAYER.setOk[n.id] = done;
    savePlayer();
    nzLog({ nodeId: n.id, choiceId: '', inputText: vals.join(' / '), result: 'wrong', nextNodeId: '' });
    nzFlush();
    NEARTX = TF('set.partial', { done: done.length, left: Math.max(0, gs.length - done.length) });
    WRONGTX = '';
    draw();
    return;
  }
  // ひとつも当たらない。すでに確定しているものを打ち直しただけなら、その旨だけ伝える
  for (var v2 = 0; v2 < vals.length; v2++) {
    if (!vals[v2]) continue;
    for (var g2 = 0; g2 < gs.length; g2++) {
      if (done.indexOf(gs[g2].g) >= 0 && groupHit(gs[g2], vals[v2], loose)) {
        NEARTX = T('set.already'); WRONGTX = ''; draw(); return;
      }
    }
  }
  NEARTX = '';
  answered(n, null, vals.join(' / '));
}

/* ===== play/js/blocks/cert_image.js ===== */
/* ---------- 認定証の記念画像（2026-09-17） ----------
   「記念画像を保存」を押すと、ここが Canvas に認定証を描いて PNG（1080×1350・SNS 向けの 4:5）にする。
   出すところは3段（スマホの制約に合わせる）:
     1. navigator.canShare({files}) が通れば navigator.share（iPhone は共有シートから「画像を保存」）
     2. だめなら <a download> を click（Android / PC）
     3. それもだめなら .certLayer に <img> で出して「長押しして保存してください」（古い iOS Safari）
   記録は残さない（apiLog を呼ばない）。管理者モードでも使える。
   色と書体は、いま出ている画面のテーマから読む（getComputedStyle(document.body) の --bg / --ink など）。
   影・グラデーションは使わない。細い罫と余白だけ。 */

var CERT_W = 1080, CERT_H = 1350;

/** いまのテーマの色と書体。画面と同じものを使う（和紙なら 生成り／紺／朱・明朝） */
function certVars() {
  var cs = getComputedStyle(document.body);
  function v(k, d) { var s = String(cs.getPropertyValue(k) || '').trim(); return s || d; }
  return {
    bg: v('--bg', '#ffffff'), ink: v('--ink', '#16202a'), sub: v('--sub', '#6b7c86'),
    line: v('--line', '#e2e8ec'), muted: v('--muted', '#98a6ae'), vermilion: v('--vermilion', '#c8553d'),
    mincho: v('--mincho', 'serif'), gothic: v('--gothic', 'sans-serif'), mono: v('--mono', 'monospace')
  };
}
/** 書体が届くのを待つ（届かなければ serif などの控えで描く。待ちすぎない） */
function certFonts() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  var want = ['700 64px "Zen Old Mincho"', '400 26px "Zen Old Mincho"',
    '500 30px "Zen Kaku Gothic New"', '400 20px "IBM Plex Mono"'];
  var all = Promise.all(want.map(function (f) {
    try { return document.fonts.load(f, '認定証 CERTIFICATE 0123'); } catch (e) { return null; }
  })).then(function () { return document.fonts.ready; });
  return Promise.race([all, new Promise(function (r) { setTimeout(r, 2500); })]).catch(function () {});
}

/* ---------- 字を置く（字間は1文字ずつ置いて作る。ブラウザの letterSpacing に頼らない） ---------- */
function certWidth(ctx, s, tr) {
  var w = 0;
  for (var i = 0; i < s.length; i++) w += ctx.measureText(s.charAt(i)).width;
  return w + tr * Math.max(0, s.length - 1);
}
/** o: { font, color, track, align('left'|'center'|'right'), max } 。max を超えたら字を縮める */
function certText(ctx, s, x, y, o) {
  s = String(s === undefined || s === null ? '' : s);
  if (!s) return 0;
  ctx.font = o.font;
  ctx.fillStyle = o.color;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  var tr = o.track || 0, w = certWidth(ctx, s, tr);
  if (o.max && w > o.max) {
    var m = o.font.match(/(\d+(?:\.\d+)?)px/);
    if (m) {
      var k = o.max / w;
      ctx.font = o.font.replace(/(\d+(?:\.\d+)?)px/, (parseFloat(m[1]) * k).toFixed(1) + 'px');
      tr = tr * k;
      w = certWidth(ctx, s, tr);
    }
  }
  var sx = o.align === 'center' ? x - w / 2 : (o.align === 'right' ? x - w : x);
  for (var i = 0; i < s.length; i++) {
    var c = s.charAt(i);
    ctx.fillText(c, sx, y);
    sx += ctx.measureText(c).width + tr;
  }
  return w;
}
function certRule(ctx, x1, y, x2, color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w || 1;
  ctx.beginPath(); ctx.moveTo(x1, y + 0.5); ctx.lineTo(x2, y + 0.5); ctx.stroke();
}

/* ---------- スタンプの絵 ---------- */
/** 朱の丸（stampHtml の SVG）を、画像にできる形にする */
function certStampSvg(st) {
  var s = stampHtml({ key: st.key, name: st.name, chars: st.chars, imageUrl: '' });
  return s.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" ');
}
function certImgFrom(src, cors) {
  return new Promise(function (res, rej) {
    var im = new Image();
    if (cors) im.crossOrigin = 'anonymous';
    im.onload = function () { res(im); };
    im.onerror = function () { rej(new Error('img')); };
    im.src = src;
  });
}
/** 画像URLのスタンプは crossOrigin で読む。読めなければ朱の丸に文字で代用する */
function certStampImg(st) {
  var fall = function () {
    return certImgFrom('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(certStampSvg(st)), false)
      .catch(function () { return null; });
  };
  if (!st) return Promise.resolve(null);
  if (st.imageUrl) return certImgFrom(st.imageUrl, true).catch(fall);
  return fall();
}
/** 円の中に収めて描く（縦横比は保つ） */
function certFit(ctx, im, cx, cy, d) {
  if (!im) return;
  var w = im.naturalWidth || im.width || 1, h = im.naturalHeight || im.height || 1;
  var k = Math.min(d / w, d / h);
  ctx.drawImage(im, cx - (w * k) / 2, cy - (h * k) / 2, w * k, h * k);
}

/* ---------- 日付（JST） ---------- */
function certJst() {
  var now = new Date();
  return new Date(now.getTime() + now.getTimezoneOffset() * 60000 + 9 * 3600000);
}
function certDateText() {
  var d = certJst();
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function certFileName() {
  var d = certJst();
  return 'nazotoki_認定証_' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + '.png';
}
/** 画像に出す人の名まえ。管理者モードは ADMIN、シリアル方式はシリアル */
function certWho() {
  if (ADMIN) return T('bar.admin') || 'ADMIN';
  return String(PLAYER.name || PLAYER.serial || '—');
}

/* ---------- 本体。canvas を1枚作って返す ---------- */
function certCanvas(n) {
  var c = certVars();
  var rows = certSteps();
  var stamps = STAMPS.slice(0);
  return certFonts()
    .then(function () { return Promise.all(stamps.map(certStampImg)); })
    .then(function (imgs) {
      var tl = rows.map(function (r) {
        var i = r.stamp ? stamps.indexOf(r.stamp) : -1;
        return i >= 0 ? imgs[i] : null;
      });
      return certPaint(n, c, rows, stamps, imgs, tl);
    });
}
function certPaint(n, c, rows, stamps, imgs, tlImgs) {
  var cv = document.createElement('canvas');
  cv.width = CERT_W; cv.height = CERT_H;
  var ctx = cv.getContext('2d');
  var W = CERT_W, H = CERT_H, cx = W / 2, m = 96, inner = W - m * 2;
  var sc = (DATA && DATA.scenario) || {};

  /* 地と、細い二重の罫 */
  ctx.fillStyle = c.bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = c.line;
  ctx.lineWidth = 2; ctx.strokeRect(41, 41, W - 82, H - 82);
  ctx.lineWidth = 1; ctx.strokeRect(54.5, 54.5, W - 109, H - 109);

  /* 見出し */
  certText(ctx, T('clear.en'), cx, 152, { font: '400 22px ' + c.mincho, color: c.vermilion, track: 7.5, align: 'center', max: inner });
  certText(ctx, T('clear.title'), cx, 236, { font: '700 64px ' + c.mincho, color: c.ink, track: 9, align: 'center', max: inner });
  certRule(ctx, cx - 48, 268, cx + 48, c.vermilion, 2);

  /* シナリオの題名とイベント名 */
  certText(ctx, sc.title || '', cx, 322, { font: '500 30px ' + c.gothic, color: c.ink, track: 1.5, align: 'center', max: inner - 40 });
  certText(ctx, sc.eventName || '', cx, 360, { font: '400 19px ' + c.mono, color: c.muted, track: 3.8, align: 'center', max: inner - 40 });

  /* なまえ */
  certText(ctx, T('home.name'), cx, 418, { font: '400 18px ' + c.mono, color: c.muted, track: 2.5, align: 'center', max: inner });
  certText(ctx, certWho(), cx, 468, { font: '700 44px ' + c.mincho, color: c.ink, track: 3, align: 'center', max: inner - 80 });
  certRule(ctx, cx - 230, 486, cx + 230, c.line, 1);

  /* 認定の一文 */
  certText(ctx, T('clear.sub'), cx, 534, { font: '400 24px ' + c.gothic, color: c.sub, track: 1, align: 'center', max: inner - 20 });

  /* スタンプの並び（持っているものは色、持っていないものは薄く） */
  var top = 572, d = 112, gap = 30;
  if (stamps.length) {
    var tot = stamps.length * d + (stamps.length - 1) * gap;
    if (tot > inner) { var k = inner / tot; d = Math.floor(d * k); gap = Math.floor(gap * k); tot = stamps.length * d + (stamps.length - 1) * gap; }
    var sx = cx - tot / 2;
    for (var i = 0; i < stamps.length; i++) {
      var ccx = sx + d / 2, ccy = top + d / 2;
      ctx.strokeStyle = c.line; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(ccx, ccy, d / 2, 0, Math.PI * 2); ctx.stroke();
      var got = PLAYER.stamps.indexOf(stamps[i].key) >= 0;
      ctx.globalAlpha = got ? 1 : 0.18;
      certFit(ctx, imgs[i], ccx, ccy, d - 10);
      ctx.globalAlpha = 1;
      sx += d + gap;
    }
    top += d;
  }

  /* 年表（RECORD）。certHtml と同じ並び */
  var dy = Math.max(top + 52, 700);
  certText(ctx, T('clear.record'), cx, dy, { font: '400 18px ' + c.mono, color: c.muted, track: 2.5, align: 'center' });
  var lw = certWidth(ctx, T('clear.record'), 2.5);
  certRule(ctx, m, dy - 6, cx - lw / 2 - 18, c.line, 1);
  certRule(ctx, cx + lw / 2 + 18, dy - 6, W - m, c.line, 1);

  var y0 = dy + 34, bottom = 1124;
  if (rows.length) {
    var rh = Math.min(94, (bottom - y0) / rows.length);
    var dd = Math.min(62, rh - 14);
    for (var j = 0; j < rows.length; j++) {
      var cy = y0 + rh * j + rh / 2, dx = m + dd / 2 + 4;
      if (j < rows.length - 1) {
        ctx.strokeStyle = c.line; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(dx + 0.5, cy + dd / 2); ctx.lineTo(dx + 0.5, cy + rh - dd / 2); ctx.stroke();
      }
      ctx.strokeStyle = rows[j].got ? c.vermilion : c.line; ctx.lineWidth = rows[j].got ? 2 : 1;
      ctx.beginPath(); ctx.arc(dx, cy, dd / 2, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = rows[j].got ? 1 : 0.18;
      certFit(ctx, tlImgs[j], dx, cy, dd - 8);
      ctx.globalAlpha = 1;
      var tx = m + dd + 30, tmax = W - m - tx;
      certText(ctx, rows[j].label + (rows[j].rescued ? T('clear.rescued') : ''), tx, cy - 8,
        { font: '400 18px ' + c.mono, color: c.muted, track: 1.8, max: tmax });
      certText(ctx, rows[j].answer, tx, cy + 26, { font: '500 30px ' + c.mincho, color: c.ink, track: 1, max: tmax });
    }
  }

  /* かかった時間と日付 */
  certRule(ctx, m, 1152, W - m, c.line, 1);
  certText(ctx, T('clear.time'), m, 1196, { font: '400 18px ' + c.mono, color: c.muted, track: 2.5 });
  certText(ctx, elapsed(), W - m, 1200, { font: '400 36px ' + c.mono, color: c.ink, track: 1.5, align: 'right' });
  certText(ctx, certDateText(), m, 1242, { font: '400 20px ' + c.gothic, color: c.muted, track: 1 });

  /* いちばん下 */
  certText(ctx, 'nazotoki', cx, 1278, { font: '400 17px ' + c.mono, color: c.muted, track: 3.5, align: 'center' });
  return cv;
}

/* ---------- 保存の入口（3段） ---------- */
function certBlob(cv) {
  return new Promise(function (res, rej) {
    if (!cv.toBlob) { rej(new Error('toBlob')); return; }
    cv.toBlob(function (b) { b ? res(b) : rej(new Error('blob')); }, 'image/png');
  });
}
/** (2) <a download> を click。download が効かない端末なら (3) の重ね物へ落とす */
function certDownload(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  if (!('download' in a)) { certLayer(url); return 'layer'; }
  a.href = url; a.download = name; a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  if (a.parentNode) a.parentNode.removeChild(a);
  setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 60000);
  return 'download';
}
/** (3) 画面いっぱいの黒い重ね物に画像を出して、長押しで保存してもらう */
function certLayer(url) {
  var old = document.querySelector('.certLayer');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var d = document.createElement('div');
  d.className = 'certLayer';
  d.innerHTML = '<button class="certX" type="button" aria-label="閉じる">×</button>'
    + '<img alt="' + esc(T('clear.title')) + '">'
    + '<p class="certHold">' + esc(T('clear.saveHold')) + '</p>';
  d.querySelector('img').src = url;
  d.querySelector('.certX').onclick = function () {
    if (d.parentNode) d.parentNode.removeChild(d);
    try { URL.revokeObjectURL(url); } catch (e) {}
  };
  document.body.appendChild(d);
  return d;
}
/** 「記念画像を保存」を押したとき。記録は残さない */
function certSave(n) {
  var btn = $('saveImg');
  if (!btn || btn.disabled) return Promise.resolve('busy');
  var was = btn.textContent;
  btn.disabled = true;
  btn.textContent = T('clear.saving');
  function done(r) { btn.disabled = false; btn.textContent = was; return r; }
  return certCanvas(n).then(certBlob).then(function (blob) {
    var name = certFileName(), file = null;
    try { file = new File([blob], name, { type: 'image/png' }); } catch (e) { file = null; }
    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: T('clear.title') })
        .then(function () { return 'share'; }, function (err) {
          if (err && err.name === 'AbortError') return 'cancel';   // 人がやめた。落としに行かない
          return certDownload(blob, name);
        });
    }
    return certDownload(blob, name);
  }).then(done, function (e) {
    done();
    say(T('clear.saveNg'));
    return 'ng';
  });
}

  if (eb.prizeConfirm) h += prizeHtml(n);
  /* 試作と同じ並び: さきに「つぎへ」（認定証なら「景品の引換へ」）、そのあと控えめな「記念画像を保存」 */

/** 景品の「やること」の行（題名の上） */

/** 認定証の年表のもと。**画面（certHtml）と記念画像（cert_image.js）が同じ並びを見る** */
function certSteps() {
  var qs = qSteps(), out = [];
  for (var i = 0; i < qs.length; i++) {
    var no = qs[i].no, texts = [], st = null, place = qs[i].place;

    });

      got: !!(st && PLAYER.stamps.indexOf(st.key) >= 0),
      label: place ? TF('q.stepPlace', { n: no, place: place }) : TF('q.step', { n: no }),
      rescued: isRescued(no),

/** 景品のボタンはスタッフが1.5秒長押し。GAS の iframe では window.confirm が塞がれることがあるので自前の確認にする */
function bindPrize() {
  var btn = $('hold');
  if (!btn) return;
  var fill = $('holdFill'), t0 = 0, raf = null, fired = false;
  function frame() {
    var r = Math.min(1, (Date.now() - t0) / 1500);
    fill.style.width = (r * 100) + '%';
    if (r >= 1 && !fired) { fired = true; stop(); ask(); return; }
    raf = requestAnimationFrame(frame);
  }
  function start(e) { if (e.cancelable) e.preventDefault(); if (fired) return; t0 = Date.now(); raf = requestAnimationFrame(frame); }
  function stop() { if (raf) cancelAnimationFrame(raf); raf = null; if (!fired) fill.style.width = '0%'; }
  function ask() {
    buzz(40);
    btn.style.display = 'none';
    $('pzBox').innerHTML = '<div class="staffbox"><p class="body tight">'

/** 不正解ノードで、いま出すもの・つぎに行く先を決める */

/* ===== play/js/blocks/hints.js ===== */
/** ヒントの段。when は配列＝「または」。{start} / {wrong,n} / {sinceOpen,sec} / {sincePrevHint,sec} */
function hintPlan(n) {
  var hs = blk(n).hints;
  if (!hs || !hs.length) return null;
  var opened = num(PLAYER.hintsOpen[n.id]);
  if (opened > hs.length) opened = hs.length;
  var out = { list: hs.slice(0, opened), total: hs.length, opened: opened, next: -1, ok: false, cond: '', left: 0 };
  if (opened >= hs.length) return out;
  out.next = opened;
  var when = hs[opened].when;
  if (!when || !when.length) when = [{ type: 'start' }];
  var openedAt = num(PLAYER.openedAt[n.id]) || Date.now();
  var ats = PLAYER.hintAt[n.id] || [];
  var prevAt = num(ats[opened - 1]) || openedAt;
  var w = num(PLAYER.wrong[n.id]);
  var names = [], left = null;
  for (var i = 0; i < when.length; i++) {
    var c = when[i] || {}, ty = String(c.type || 'start');
    if (ty === 'start') { out.ok = true; continue; }
    if (ty === 'wrong') {
      names.push(TF('hint.wrongN', { n: num(c.n) }));
      if (w >= num(c.n)) out.ok = true;
      continue;
    }
    var base = ty === 'sincePrevHint' ? prevAt : openedAt;
    var l = num(c.sec) - Math.floor((Date.now() - base) / 1000);
    names.push(TF(ty === 'sincePrevHint' ? 'hint.prevN' : 'hint.secN', { sec: num(c.sec) }));
    if (l <= 0) out.ok = true; else left = (left === null) ? l : Math.min(left, l);
  }
  out.cond = names.join(T('hint.or'));
  out.left = left === null ? 0 : left;
  return out;
}
function hintsHtml(n) {
  var p = hintPlan(n);
  if (!p) return '';
  var h = '<div class="hints" id="hintBox"><div class="meta"><span>' + esc(T('hint.head')) + '</span><span>' + p.opened + ' / ' + p.total + '</span></div>';
  for (var i = 0; i < p.list.length; i++) {
    h += '<div class="hint-open"><b>' + esc(TF('hint.label', { i: i + 1 })) + '</b>' + esc(String(p.list[i].text || '')) + '</div>';
  }
  if (p.next >= 0) {
    if (p.ok) h += '<button class="go ghost hintbtn" id="hintGo">' + esc(T('q.hint'))
      + '（' + (p.next + 1) + '/' + p.total + '）</button>';
    else h += '<div class="hint-locked js-wait">' + esc(TF('hint.wait', { cond: p.cond })
      + (p.left > 0 ? TF('hint.left', { sec: p.left }) : '')) + '</div>';
  }
  return h + '</div>';
}
function bindHints(n) {
  var b = $('hintGo');
  if (!b) return;
  b.onclick = function () {
    var i = num(PLAYER.hintsOpen[n.id]);
    PLAYER.hintsOpen[n.id] = i + 1;
    if (!PLAYER.hintAt[n.id]) PLAYER.hintAt[n.id] = [];
    PLAYER.hintAt[n.id][i] = Date.now();
    savePlayer();
    nzLog({ nodeId: n.id, choiceId: '', inputText: '', result: 'hint', nextNodeId: '' });
    nzFlush();
    redrawHints(n);
  };
}
function redrawHints(n) {
  var box = $('hintBox');
  if (!box) { draw(); return; }
  var tmp = document.createElement('div');
  tmp.innerHTML = hintsHtml(n);
  box.parentNode.replaceChild(tmp.firstChild, box);

/** ヒントが開くまでの待ち文。段ごとに hint.wait2 / hint.wait3 … があればそちらを使う
 *  （無ければ hint.wait）。{i} 段の番号 ／ {cond} 開く条件 ／ {sec} あと何秒 */
function waitText(p) {

/** 遊び方（info の template=howto）。
 *  **新しい形**（2026-09-17）… blocksJson.howto.pages = [ { head, text, imageUrl }, … ]。
 *    1ページ＝1つの入力枠。絵もページごとに持つ（jpg / png を Drive に上げた URL）。
 *  **古い形**（読めるだけ。運営画面で開くと新しい形に直る）…
 *    body を `---` だけの行で区切って複数ページ。各ページの1行目が見出し、残りが本文。
 *    絵は blocksJson.figure.pages[ページ番号]、無ければ1枚目だけ nodes.imageUrl。 */

function howtoPages(n) {

function viewHowto(n) {

/* ===== play/js/blocks/media.js ===== */
/** media ブロック（開始時の演出）と、ノードのイラスト。figure は figure.js が受け持つ。
 *
 *  blocksJson の media
 *    videoUrl / audioUrl … 出すもの（どちらか、または両方）。お名前.com に置いた素のファイル
 *    mode                … 'overlay' 全画面で再生してからメイン画面 ／ 'inline' メイン画面の中で再生（既定）
 *    skipAfterSec        … 何秒たったら「とばす」を出すか（0 か空ならすぐ）
 *
 *  2026-09-17 に作り替えた（中地さんの指示）。
 *  - ノードを開いた瞬間に自動で再生する。再生ボタンも操作ボタン（controls）も出さない。
 *    出すのは「とばす」だけで、動画の上を触っても止まらない（pointer-events:none）
 *  - 終わったら、メイン画面に「もう一度動画を見る」「もう一度音声を聞く」の小さなボタン
 *  - 音声はメイン画面といっしょに流れる（全画面のときは、レイヤーが消えてから）
 *  - スマホは音の出る自動再生を「利用者が触った直後」しか許さない。参加者は「つぎへ」などを
 *    押してこのノードに来るので、**その押した処理の中で（同期的に）** play() を呼ぶ
 *    （goTo → draw → bindMedia は同期）。断られたときは「タップして再生」の1ボタンだけを出す
 *  - 見終わったかは state.js の PLAYER.mediaDone に残す。はずれて描き直しても流れ直さない
 *
 *  2026-09-18 音声だけのノード。プレビュー（シナリオ画面の中央の「開始時の演出」）で、
 *  待ちなしで「問題画面」に戻っていたのを直した。流れはじめた時点で PLAYER.mediaDone は立てる（本番の
 *  動きは今までどおり。描き直しても流れ直さない）が、親に知らせる mediaTellDone は音声の ended まで待つ。
 *  自動再生を断られたら「タップして再生」（mdTapA）を出し、押されて鳴り終わってから知らせる。
 *  音声が無い・URL が壊れている（error / NotSupportedError）ときだけ、その場で知らせる。
 */

/** このノードに出すもの。無ければ null */
function mediaOf(n) {
  var m = blk(n).media;
  if (!m) return null;
  if (!m.videoUrl && !m.audioUrl) return null;
  return m;
}
/** 'overlay'（全画面）か 'inline'（メイン画面の中。既定） */
function mediaMode(m) { return String(m.mode || '') === 'overlay' ? 'overlay' : 'inline'; }

/** 動画の枠ひとつ分。inline はメイン画面の中、overlay は上に重ねる黒いレイヤー */
function mediaStageHtml(m, mode) {
  var cls = mode === 'overlay' ? 'mdLayer' : 'mdWrap';
  return '<div class="' + cls + '" id="' + cls + '">'
    + '<video class="pic media" id="mdV" src="' + esc(m.videoUrl) + '" playsinline preload="auto"></video>'
    + '<button class="mdSkip" type="button" id="mdSkip" hidden>' + esc(T('media.skip')) + '</button>'
    + '<button class="mdTap" type="button" id="mdTap" hidden>' + esc(T('media.tap')) + '</button>'
    + '</div>';
}
/** 「もう一度動画を見る」「もう一度音声を聞く」。**題名の行の右はし**に置く小さな文字リンク（2026-09-17） */
function mediaAgainHtml(n) {
  var m = mediaOf(n);
  if (!m) return '';
  var h = '';
  if (m.videoUrl) h += '<button class="mdAgain" type="button" id="mdAgainV" hidden>' + esc(T('media.again')) + '</button>';
  if (m.audioUrl) h += '<button class="mdAgain" type="button" id="mdAgainA" hidden>' + esc(T('media.againAudio')) + '</button>';
  return h ? '<span class="mdAgains">' + h + '</span>' : '';
}
/** 画面の中の動画（inline）の枠と、音声の本体。題名の行と問題文のあいだ */
function mediaStageHeadHtml(n) {
  var m = mediaOf(n);
  if (!m) return '';
  var h = '';
  if (m.videoUrl && mediaMode(m) === 'inline') h += mediaStageHtml(m, 'inline');
  if (m.audioUrl) {
    h += '<audio id="mdA" src="' + esc(m.audioUrl) + '" preload="auto"></audio>';
    /* 音声だけのノードには動画の枠が無いので、「タップして再生」を置く場所をここに作る（2026-09-18） */
    if (!m.videoUrl) h += '<div class="mdTapRow"><button class="mdTap mdTapA" type="button" id="mdTapA" hidden>'
      + esc(T('media.tap')) + '</button></div>';
  }
  return h;
}
/** メイン画面の上に重ねるレイヤー（全画面のとき）。まだ見ていないときだけ出す */
function mediaLayerHtml(n) {
  var m = mediaOf(n);
  if (!m || !m.videoUrl || mediaMode(m) !== 'overlay') return '';
  if (PLAYER.mediaDone[n.id]) return '';
  return mediaStageHtml(m, 'overlay');
}
/** ノードのイラストと「画像・文字列」。動画・音声は上の mediaStageHeadHtml が受け持つ */
function mediaHtml(n) {
  var h = n.imageUrl ? '<img class="pic" src="' + esc(n.imageUrl) + '" alt="">' : '';
  return h + figureHtml(n);
}

/* ---------- 再生 ---------- */

var MDSKIP = null;       // 「とばす」を出すまでの待ち

/** 小さなボタンの出し入れ */
function mediaBtn(id, on) { var e = $(id); if (e) e.hidden = !on; }
/** 動画の枠を、その動画の縦横比どおりの大きさにする（上限は画面の 60%）。
 *  width:100% と max-height だけだと、縦長の動画で横だけ伸びて比が崩れる。
 *  高さの上限から幅の上限を出して、比を保ったまま小さくする（2026-09-17） */
function mediaFit(v) {
  if (!v || !v.videoWidth || !v.videoHeight) return;
  if (v.parentNode && v.parentNode.className.indexOf('mdLayer') >= 0) return;   // 全画面はレイヤーいっぱい
  var maxH = Math.round((window.innerHeight || 640) * 0.5);
  v.style.aspectRatio = v.videoWidth + ' / ' + v.videoHeight;
  v.style.width = '100%';
  v.style.height = 'auto';
  v.style.maxWidth = Math.round(maxH * v.videoWidth / v.videoHeight) + 'px';
  v.style.maxHeight = maxH + 'px';
}
/** 動画の大きさが分かるたびに枠を合わせ直す。
 *  loadedmetadata は、こちらが見はじめる前に済んでいると飛んでこないので、
 *  resize（縦横が分かったとき）と、画面の向きが変わったときも見る（2026-09-17） */
function mediaWatchSize(v) {
  if (!v || v.getAttribute('data-fit')) return;
  v.setAttribute('data-fit', '1');
  ['loadedmetadata', 'loadeddata', 'resize'].forEach(function (e) {
    v.addEventListener(e, function () { mediaFit(v); });
  });
  window.addEventListener('resize', function () { if (v.parentNode) mediaFit(v); });
  /* 出来事は取りこぼすことがある（こちらが見はじめる前に読み終わっているなど）ので、
     縦横が分かるまで少しのあいだ見に行く。分かったらそこでやめる */
  var n = 0;
  var t = setInterval(function () {
    if (!v.parentNode || n++ > 40) { clearInterval(t); return; }
    if (!v.videoWidth) return;
    clearInterval(t);
    mediaFit(v);
  }, 50);
}
/** 全画面のレイヤーを作って、メイン画面の上にかぶせる（「もう一度」で作り直すときにも使う） */
function mediaOpenLayer(m) {
  if ($('mdLayer')) return;
  var box = document.createElement('div');
  box.innerHTML = mediaStageHtml(m, 'overlay');
  document.body.appendChild(box.firstChild);
}
/** 「とばす」を、決めた秒数がきたら出す（0 か空ならすぐ） */
function mediaArmSkip(n, m) {
  if (MDSKIP) { clearTimeout(MDSKIP); MDSKIP = null; }
  var sk = $('mdSkip');
  if (!sk) return;
  sk.onclick = function () { mediaEnd(n, m); };
  var sec = num(m.skipAfterSec);
  if (sec <= 0) { sk.hidden = false; return; }
  sk.hidden = true;
  MDSKIP = setTimeout(function () { MDSKIP = null; var e = $('mdSkip'); if (e) e.hidden = false; }, sec * 1000);
}
/** 「タップして再生」の出し入れ（ブラウザに自動再生を断られたとき） */
function mediaTap(n, m, on) {
  var t = $('mdTap');
  if (!t) return;
  t.hidden = !on;
  if (on) t.onclick = function () { t.hidden = true; mediaVideoStart(n, m); };
}
/** 動画を最初から流す。**押された処理の中から同期的に呼ぶこと**（スマホの自動再生の決まり） */
function mediaVideoStart(n, m) {
  if (mediaMode(m) === 'overlay') mediaOpenLayer(m);
  var v = $('mdV');
  if (!v) return;
  mediaBtn('mdAgainV', false);
  v.controls = false;
  mediaWatchSize(v);
  v.onended = function () { mediaEnd(n, m); };
  v.onerror = function () { mediaEnd(n, m); };          // 出せない URL のときも、画面で止まらない
  mediaFit(v);
  try { v.currentTime = 0; } catch (e) {}
  mediaTap(n, m, false);
  var p = null;
  try { p = v.play(); } catch (e) { mediaTap(n, m, true); }
  if (p && p.catch) p.catch(function () { mediaTap(n, m, true); });
  mediaArmSkip(n, m);
}
/** 「タップして再生」（音声だけのノード）の出し入れ */
function mediaTapAudio(n, m, on, whenEnd) {
  var t = $('mdTapA');
  if (!t) return;
  t.hidden = !on;
  if (on) t.onclick = function () { t.hidden = true; mediaAudioStart(n, m, whenEnd); };
}
/** 音声を最初から流す。断られたら鳴らさず、「もう一度音声を聞く」だけ残す。
 *  whenEnd を渡すと、鳴り終わった（ended）ときに1回だけ呼ぶ。
 *  音声が無い・URL が壊れている（error）ときは、待たせずにその場で呼ぶ。
 *  自動再生を断られたときは「タップして再生」を出し、押されて鳴り終わってから呼ぶ（2026-09-18） */
function mediaAudioStart(n, m, whenEnd) {
  var fired = false;
  var fin = function () { if (fired) return; fired = true; if (whenEnd) whenEnd(); };
  var a = $('mdA');
  if (!a) { fin(); return; }
  a.onended = function () { a.onended = null; a.onerror = null; fin(); };
  a.onerror = function () { a.onended = null; a.onerror = null; fin(); };   // 出せない URL のときは待たせない
  try { a.currentTime = 0; } catch (e) {}
  mediaTapAudio(n, m, false, whenEnd);
  var p = null;
  try { p = a.play(); } catch (e) { mediaTapAudio(n, m, true, whenEnd); }
  if (p && p.catch) p.catch(function (err) {
    /* 出せない音（404 など）は play() も断られる。自動再生を断られたのと区別して、
       壊れているときは「タップして再生」を出さずに、その場で終わった扱いにする */

/** 動画が終わった（または「とばす」）。全画面なら 0.6秒かけて消してメイン画面へ */
function mediaEnd(n, m) {

  var lay = $('mdLayer');

  var gone = function () { if (lay.parentNode) lay.parentNode.removeChild(lay); mediaAfter(n, m); };
  if (reduced()) { gone(); return; }      // 動きを減らす設定のときは、すぐ消す

/** レイヤーが消えたあと（または画面の中で終わったあと）のメイン画面 */
function mediaAfter(n, m) {

function mediaTellDone(n) {

/** ノードを描いたあとに呼ぶ。まだ見ていなければ、その場で再生を始める */
function bindMedia(n) {
  var m = mediaOf(n);
  if (!m) return;
  var bv = $('mdAgainV'), ba = $('mdAgainA');
  if (bv) bv.onclick = function () { mediaVideoStart(n, m); };
  if (ba) ba.onclick = function () { mediaAudioStart(n, m); };
  var done = !!PLAYER.mediaDone[n.id];
  var onlyAudio = !!m.audioUrl && !m.videoUrl;
  /* 音声は、メイン画面が出たところで流す（全画面の動画があるときは mediaAfter で流す）。

  if (m.audioUrl) {
    mediaBtn('mdAgainA', true);
    if (!done && !(m.videoUrl && mediaMode(m) === 'overlay')) {
      /* 音声だけのノードは、鳴り終わってから親（プレビュー）に知らせる（2026-09-18）。
         鳴り終わる前に描き直しても流れ直さないよう、PLAYER.mediaDone は下で先に立てる */
      mediaAudioStart(n, m, onlyAudio ? function () { mediaTellDone(n); } : null);
    }
  }
  if (m.videoUrl) {
    if (done) {
      mediaBtn('mdAgainV', true);
      var v0 = $('mdV');
      if (v0) { mediaWatchSize(v0); mediaFit(v0); }
      return;
    }
    mediaVideoStart(n, m);
    return;
  }
  /* 音声だけのノード。流しはじめた時点で「見終わった」にするが（本番の動きは今までどおり）、
     親に知らせるのは鳴り終わったとき（上の whenEnd） */
  if (!done) mediaDone(n, true);
}

/** 「惜しい」か。near.mode は words（並べた言葉）／ part（正解の一部）／ edit1（1文字ちがい） */
function nearHit(node, text) {
  var nb = blk(node).near;
  if (!nb) return '';
  var loose = !!blk(node).looseKana;
  var t = nzKey(text, loose);
  if (!t) return '';
  var mode = String(nb.mode || 'words');
  if (mode === 'words') {
    var ws = nb.words || [];
    for (var i = 0; i < ws.length; i++) if (nzKey(ws[i], loose) === t) return String(nb.msg || '');
    return '';
  }
  var ok = [];
  nzChoices(node.id).forEach(function (c) {
    if (!yes(c.isCorrect)) return;
    String(c.keywords || '').split(',').forEach(function (w) { var v = nzKey(w, loose); if (v) ok.push(v); });
  });
  for (var k = 0; k < ok.length; k++) {
    var w2 = ok[k];
    if (w2 === t) continue;
    if (mode === 'part' && (w2.indexOf(t) >= 0 || t.indexOf(w2) >= 0)) return String(nb.msg || '');
    if (mode === 'edit1' && edit1(w2, t)) return String(nb.msg || '');
  }
  return '';
}

/* ===== play/js/app.js ===== */
/* =========================================================================
   回答画面（参加者用）
     画面は3つ。表紙 → ノード（はじまり・問題・説明・結末・不正解）。あいだに「一言」と「会場のQR待ち」。
     シナリオは開いたときに1回だけ受け取り、以後はスマホの中だけで進む。
     記録（名前・答え）は裏で apiLog にまとめ送りする。画面は待たない。
     進み具合（いまのノード・はずれ回数・履歴）は答えるたびに localStorage に残す。

   ノードの種類（nodes.kind）
     start    はじまり。title も body も空なら出さずに nextNodeId へ素通りする
     question 問題。進む先は「選択肢の nextNodeId → 正解なら correctNodeId →
              wrongNodeId（それ以外）」の順に、あるものを使う。どれも無ければ今までどおり
              （wrongText / hintAfter / hintText / wrongNextNodeId）
     info     読むだけ。template が howto なら body を --- で区切って複数ページ、move なら移動案内
     ending   結末
     wrong    不正解

   B案（2026-09-15 段階1）で足したもの — DESIGN_B.md
     テーマ washi ／ 順路バー・スタンプ帳・進捗ホーム（scenario.showRoute）
     nodes の template / place / see / routeNo / continueOnSame / blocksJson
     blocksJson: media / figure / near / hints / after / timeLimit / staffPin / move / ending
     answerType set（choices.group のまとまりごと。順不同）
     文言辞書（既定値は下の TXD。scenario.textsJson で上書き）
   ========================================================================= */

/* ---------- 起動（混んでいたら 3秒・6秒・12秒・以後12秒おきにやり直す） ---------- */
var WAITS = [3000, 6000, 12000], tryN = 0, STARTED = false, PASS = '';

var NOK = false;      // ?n= が使えるかどうか

/* ---------- 管理者モード（admin。2026-09-16） ----------
   入場の欄に「admin」と打つ（大文字小文字・前後の空白は問わない）か、URL に ?admin=1 を付けると、
   台帳（apiTicketState / apiActivate）も暗証番号も通さずに始まる。なまえ方式・シリアル方式・
   聞かない方式のどれでも同じ。使えるかどうかはシナリオの adminOn が決める。
     adminOn が偽 … 何も特別なことをしない（ふつうのなまえ／シリアルとして扱う。断り文も出さない）
   管理者モードの間は、進み具合を端末に残さず、記録（apiLog）も台帳への送りも出さない（state.js の ADMIN）。
   開き直せば ADMIN は落ちるので、いつも最初から。 */
var ADMINQ = false;   // URL に ?admin=1 が付いている
try { ADMINQ = (new URLSearchParams(location.search)).get('admin') === '1'; } catch (e) {}
/** このシナリオで管理者モードを使ってよいか。写しや古い控えには adminOn が無いので、無ければ偽 */
function adminAllowed() { return !!(DATA && DATA.scenario && DATA.scenario.adminOn); }
/** 打った字が「admin」か */
function adminWord(v) { return String(v || '').trim().toLowerCase() === 'admin'; }
/** 入場の欄（なまえ／シリアル／スタッフ暗証）に admin と打ってあるか */
function adminTyped() {
  var ids = ['nm', 'sn', 'ap'];
  for (var i = 0; i < ids.length; i++) {
    var el = $(ids[i]);
    if (el && adminWord(el.value)) return true;
  }
  return false;
}
/** 管理者モードで始める。台帳の api を呼ばず、暗証番号も聞かない */
function adminBegin() {
  ADMIN = true;
  PLAYER = blankPlayer();
  PLAYER.name = 'ADMIN';
  if (ENTRY === 'serial') PLAYER.serial = 'ADMIN';
  beginPlay();
}

/* 合言葉つきのシナリオは、この端末で合言葉が通るまで始めない（2026-09-16）。
     となりの写し … publish.mjs が { ver:'locked', needPass:true } を置く
     端末の控え   … 合言葉つきで取ったものには passed:true の印が付く
   どちらも、端末に合言葉の控え（loadPass）があるときだけそのまま始める。 */
function boot(pass) {
  if (EMBED) { bootEmbed(); return; }
  PASS = pass || loadPass();
  var c = loadScen();
  if (c && c.packed && (!c.passed || PASS)) {   // まずスマホの中のシナリオで出す（待たせない）
    try { nzIndex(nzUnpack(c.packed)); enter(); } catch (e) {}
  }
  if (c && c.packed && c.passed && !PASS) {     // 合言葉つきの控えだが、合言葉の控えが無い
    NEEDPASS = true;
    askPass();
  }
  if (!STARTED && !NEEDPASS) fetchNear();    // 静的版は、画面と同じところに置いた写しを先に読む
  fetchScen();
}

/* 静的版（お名前.com など）で、画面のとなりに置いた scen/シナリオID.json を読む。
   GAS のコールドスタートは数秒かかるので、それを待たずに遊びはじめられるようにする。
   写しが古いことはありうるが、GAS の返事が届いた時点で黙って最新に置き換わる。 */
var FROMNEAR = false;
function fetchNear() {
  if (nzInGas()) return;                     // GAS の中なら、となりに写しは無い
  if (PREVIEW) return;                       // 試し遊びは下書き。となりの写し（公開ぶん）は出さない
  if (typeof fetch !== 'function') return;
  try {
    fetch('scen/' + encodeURIComponent(S) + '.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (o) {
        if (!o) return;
        /* 合言葉つきのシナリオは写しを作れない。表紙だけ出して合言葉を聞き、通るまで始めない */
        if (o.needPass) {
          NEEDPASS = true;
          if (!PASS) { STARTED = false; askPass(ASKING); }
          return;
        }
        if (!o.packed || STARTED || NEEDPASS) return;
        var d;
        try { d = nzUnpack(o.packed); } catch (e) { return; }
        nzIndex(d);
        FROMNEAR = true;
        enter();
      })
      .catch(function () {});
  } catch (e) {}
}
/* シナリオ画面のプレビュー。親（admin）から postMessage でシナリオをもらって描くだけ。
     { nz:'scen', packed, nodeId, name, state }  … 中身を入れ替えて、そのノードを出す
   こちらからは { nz:'ready' } と { nz:'at', nodeId } を返す（左のフローの選択に合わせるため）。
   state は見せかた。'normal' ふつう ／ 'ok' 正解演出 ／ 'hints' ヒント全開（シナリオ画面の中央の切り替え）。 */
function bootEmbed() {
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || m.nz !== 'scen') return;
    var d;
    try { d = nzUnpack(m.packed); } catch (err) { return; }
    nzIndex(d);
    STARTED = true;
    PLAYER = blankPlayer();
    PLAYER.name = m.name || 'preview';
    /* プレビューは入場を済ませた扱いにする。入場のしかた（entryMode）がシリアル方式のシナリオは
       PLAYER.serial が空だと entryDone() が偽になり、どのノードを選んでも表紙のままだった（2026-09-17）。
       方式が増えても表紙に落ちないよう、entryDone() が見る欄はここで全部埋める。 */
    PLAYER.serial = 'preview';
    PLAYER.startMs = Date.now();
    var id = m.nodeId && nzNode(m.nodeId) ? m.nodeId : String(d.scenario.startNodeId || '');
    var n = nzNode(id);
    if (n) {
      PLAYER.nodeId = n.id;
      PLAYER.openedAt[n.id] = Date.now();
      if (n.routeNo !== '' && n.routeNo !== undefined && n.routeNo !== null) PLAYER.routeNo = num(n.routeNo);
    }
    FB = ''; WRONGTX = ''; NEARTX = ''; HINTTX = ''; WFB = ''; OKON = null; VIEW = ''; HOWTOI = 0;
    embedState(n, String(m.state || 'normal'));
    draw();
    tell();
  });
  try { parent.postMessage({ nz: 'ready' }, '*'); } catch (e) {}
}
/** プレビューの見せかた。シナリオ画面の中央の「開始時の演出」「正解演出」「ヒント全開」を、その場で作って出す（2026-09-17）。
 *  media … 開始時の演出（動画・音声）から始める。見終わると親に mediaDone を送る
 *  ok    … その謎を解いた直後の画面（after ブロックのスタンプ・一言）
 *  hints … そのノードのヒントを全部開いた画面
 *  media 以外は「開始時の演出は見終わった」扱いにして、いきなり流れ出さないようにする */
function embedState(n, st) {
  if (!n) return;
  if (st === 'media') { delete PLAYER.mediaDone[n.id]; delete MDTOLD[n.id]; return; }
  PLAYER.mediaDone[n.id] = 1;
  if (st === 'normal') return;
  if (st === 'ok') { OKON = { fromId: n.id }; return; }
  if (st === 'hints') {
    var hs = blk(n).hints;
    if (hs && hs.length) {
      PLAYER.hintsOpen[n.id] = hs.length;
      PLAYER.hintAt[n.id] = [];
      for (var i = 0; i < hs.length; i++) PLAYER.hintAt[n.id][i] = Date.now();
    }
  }
}
/** いま出しているノードを親に伝える */
function tell() {
  if (!EMBED) return;
  try { parent.postMessage({ nz: 'at', nodeId: PLAYER.nodeId }, '*'); } catch (e) {}
}

function fetchScen() {
  /* 試し遊び（?preview=合い札）は、公開していないシナリオを合い札で取る。返る形は apiGetScenario と同じ */
  (PREVIEW ? call('apiPreviewScenario', [S, PVTOK]) : call('apiGetScenario', [S, PASS]))
    .then(function (r) {
      tryN = 0; setNet('');
      NEEDPASS = false;
      if (PASS) savePass(PASS);                 // 通った合言葉は端末に控える（次からは黙って付ける）
      var old = loadScen();
      saveScen({ ver: r.ver, packed: r.packed, passed: !!PASS });
      if (old && old.packed === r.packed && STARTED) return;   // 変わっていない
      var d;
      try { d = nzUnpack(r.packed); } catch (e) { return; }
      nzIndex(d);
      if (!STARTED) { enter(); return; }
      /* となりの写しで出していただけなら、GAS の返事は「新しくなった」ではないので黙って置き換える */
      var quiet = FROMNEAR;
      FROMNEAR = false;
      if (PLAYER.pending && !nzNode(PLAYER.pending)) PLAYER.pending = '';
      if (PLAYER.nodeId && !nzNode(PLAYER.nodeId)) {
        PLAYER.nodeId = ''; PLAYER.pending = ''; savePlayer();
        FB = ''; WRONGTX = ''; NEARTX = ''; HINTTX = ''; WFB = ''; OKON = null; VIEW = '';
        say(T('scen.reset'));
      } else if (!quiet) say(T('scen.updated'));
      draw();
    })
    .catch(function (e) {
      var m = (e && e.message) ? String(e.message) : String(e);
      /* 合言葉が要る。写しや控えで始まっていても、いったん止めて合言葉を聞く（通ったら続きから） */
      if (m.indexOf('PASSCODE') >= 0) { NEEDPASS = true; STARTED = false; askPass(ASKING); return; }
      if (STARTED) {
        if (tryN < WAITS.length) setTimeout(fetchScen, WAITS[tryN++]);
        else setNet(T('net.stale'));
        return;
      }
      var w = WAITS[Math.min(tryN, WAITS.length - 1)]; tryN++;
      $('app').innerHTML = '<h1 class="ttl">' + esc(T('busy.title')) + '</h1>'
        + '<p class="body">' + esc(TF('busy.body', { sec: w / 1000 })) + '</p>'
        + '<p class="lead">' + esc(m) + '</p>';
      setTimeout(fetchScen, w);
    });
}

/* ---------- 表紙だけ先に取る（合言葉つきのシナリオのため） ---------- */
var COVER = null, COVERASKED = false;
function fetchCover() {
  if (COVERASKED) return;
  COVERASKED = true;
  if (PREVIEW) return;                       // 試し遊びは表紙を聞かない（合い札で中身がもう取れている）
  if (nzInGas() && !google.script.run.apiCover) return;
  call('apiCover', [S])
    .then(function (c) {
      /* 合言葉が要ると分かっているときは、写しや控えで中身を持っていても表紙を出す */
      if (!c || STARTED || (DATA && !NEEDPASS)) return;
      COVER = c;
      document.documentElement.setAttribute('data-theme', c.theme || 'white');
      document.body.setAttribute('data-theme', c.theme || 'white');
      askPass(true);
    })
    .catch(function () {});     // 取れなくても、合言葉の画面はそのまま出る
}

/** 参加者用の合言葉。表紙を出したうえで、合言葉となまえをいっしょに聞く */
var PWTRIED = false;
function askPass(keep) {
  ASKING = true;
  fetchCover();
  var pw = '', nm = PLAYER.name || '';
  if (keep) { try { pw = $('pw').value; nm = $('nm').value; } catch (e) {} }

    + '<h1 class="ttl' + (c ? ' cover' : '') + '">' + esc(c && c.title ? c.title : T('entry.pass')) + '</h1>'
    + (c && c.description ? '<p class="body lead2">' + esc(c.description) + '</p>' : '')
    + (PWTRIED ? '<p class="wrongtx tight">' + esc(T('entry.passNg')) + '</p>' : '')
    + '<p class="lead">' + esc(T('entry.passLead')) + '</p>'
    + '<label class="lab" for="pw">' + esc(T('entry.pass')) + '</label><input type="text" id="pw" autocomplete="off">'
    + '<label class="lab" for="nm">' + esc(T('entry.name')) + '</label><input type="text" id="nm" autocomplete="off" maxlength="30">'
    + '<button class="go" id="pwGo">' + esc(T('common.begin')) + '</button>';
  $('pw').value = pw;
  $('nm').value = nm;
  $('pwGo').onclick = function () {
    var nm2 = $('nm').value.trim();
    if (!nm2) { say(T('entry.nameEmpty')); return; }
    PLAYER.name = nm2.slice(0, 30); savePlayer();
    tryN = 0; PWTRIED = true; PASS = $('pw').value.trim();
    $('app').innerHTML = '<p class="body">' + esc(T('entry.checking')) + '</p>';
    fetchScen();
  };
  $('pw').onkeydown = function (e) { if (e.key === 'Enter') $('nm').focus(); };
  $('nm').onkeydown = function (e) { if (e.key === 'Enter') $('pwGo').click(); };
}

/* ---------- ?n=（現地QR）は1回だけ使う ---------- */
function qrConsume(id) {
  var used = nzQrUsed(id);                 // 覚えておくのは state.js の役
  if (PLAYER.pending === id) return true;  // 待っていたノードなら、読み直しでも通す
  return !used;
}
function done() {
  var n = nzNode(PLAYER.nodeId);
  return !!PLAYER.endingNodeId && !!n && n.kind === 'ending';
}
function enter() {
  STARTED = true;
  ASKING = false;
  /* ?admin=1 で来た人は、入場の欄を出さずにそのまま管理者モードで始める（聞かない方式のため） */
  if (!ADMIN && ADMINQ && adminAllowed()) { adminBegin(); return; }
  if (N && nzNode(N) && !done()) { NOK = qrConsume(N); if (NOK) QROK[N] = true; }
  if (entryDone() && PLAYER.nodeId && NOK) { goTo(N); return; }
  draw();
}
/** 入場が済んでいるか（entryMode ごと）。none は聞くことが無いので、いつも済み */
function entryDone() {
  if (ENTRY === 'none') return true;
  if (ENTRY === 'serial') return !!PLAYER.serial;
  return !!PLAYER.name;
}
/* ---------- ノードを進む ---------- */
var FB = '';        // 「一言」を出している最中
var WRONGTX = '';   // はずれの文（その場に留まる）
var NEARTX = '';    // 「惜しい」の文
var HINTTX = '';    // 古い形のヒント
var WFB = '';       // 不正解ノードの上に出す一言
var OKON = null;    // 正解演出（スタンプ）を出している最中。{ fromId }
var VIEW = '';      // '' ふつう ／ 'home' 進捗ホーム

function skipStart(n) {
  var guard = 0;
  while (n && String(n.kind || '') === 'start' && guard < 50
         && !String(n.title || '').trim() && !String(n.body || '').trim()
         && String(n.nextNodeId || '')) {
    guard++;
    var nx = nzNode(String(n.nextNodeId));
    if (!nx || nx.id === n.id) break;
    PLAYER.score = num(PLAYER.score) + num(n.score);
    n = nx;
  }
  return n;
}
function goTo(id) {
  var n = nzNode(id);
  if (!n) { say(T('err.noGo')); return; }
  n = skipStart(n); id = n.id;
  WRONGTX = ''; NEARTX = ''; HINTTX = ''; VIEW = '';
  if (String(n.kind || '') !== 'wrong') WFB = '';
  if (yes(n.qrOnly) && !QROK[id]) {
    PLAYER.pending = id; savePlayer(); nzTouch(); nzFlush(); draw(); return;
  }
  PLAYER.pending = '';
  PLAYER.nodeId = id;
  PLAYER.hist.push(id);
  if (PLAYER.hist.length > 200) PLAYER.hist = PLAYER.hist.slice(-200);
  PLAYER.score = num(PLAYER.score) + num(n.score);
  if (n.routeNo !== '' && n.routeNo !== undefined && n.routeNo !== null) PLAYER.routeNo = num(n.routeNo);
  if (!PLAYER.openedAt[id]) PLAYER.openedAt[id] = Date.now();
  HOWTOI = 0;
  if (n.kind === 'ending') { PLAYER.finishedAt = nzNow(); PLAYER.endingNodeId = id; }
  savePlayer(); nzTouch(); nzFlush(); draw(); tell();
  try { window.scrollTo(0, 0); } catch (e) {}
}

/**
 * 答えたあとの後始末。choice は選んだ／当てた選択肢（打つで合わなければ null）。
 * 進む先は「選択肢の nextNodeId → 正解なら correctNodeId → wrongNodeId（それ以外）」の順。
 * B案のノード（blocksJson に hints か near がある）は、進む先が無いとき
 * その場に留まって「ちがうようです（n回目）」を出す（古い形と同じ仕組み）。
 */
function answered(node, choice, inputText, rescued) {
  var ok = !!(choice && yes(choice.isCorrect)) || !!rescued;
  var cid = choice ? (choice.id || '') : '';
  var own = choice ? String(choice.nextNodeId || '') : '';
  var next = own;
  if (!next && ok) next = String(node.correctNodeId || '');
  if (!next && ok) next = String(node.nextNodeId || '');
  if (!next) {
    var wn = String(node.wrongNodeId || '');
    if (wn && nzNode(wn)) next = wn;
  }
  var dest = next ? nzNode(next) : null;
  var toWrongNode = !!dest && String(dest.kind || '') === 'wrong';

  if (ok || own) {
    if (!next) { say(T('err.noNext')); draw(); return; }
    if (rescued) PLAYER.rescued[node.id] = 1;
    nzLog({ nodeId: node.id, choiceId: cid, inputText: inputText || '',
      result: ok ? 'correct' : 'next', nextNodeId: next });
    if (choice) PLAYER.score = num(PLAYER.score) + num(choice.score);
    if (ok) rememberAnswer(node, choice, inputText);
    FB = choice ? String(choice.feedback || '') : '';
    if (toWrongNode) PLAYER.wrongFrom = '';
    // 正解演出（スタンプ・一言・効果音）。after ブロックがあるときだけ
    var af = blk(node).after;
    if (ok && af) {
      FB = '';
      if (af.stampKey && PLAYER.stamps.indexOf(af.stampKey) < 0) PLAYER.stamps.push(af.stampKey);
      OKON = { fromId: node.id };
      playSound(af.soundUrl);
    }
    savePlayer(); nzFlush();
    goTo(next);
    return;
  }

  var w = num(PLAYER.wrong[node.id]) + 1;
  PLAYER.wrong[node.id] = w;

  if (next) {
    nzLog({ nodeId: node.id, choiceId: cid, inputText: inputText || '', result: 'wrong', nextNodeId: next });
    if (toWrongNode) {
      PLAYER.wrongFrom = node.id;
      WFB = String((choice && choice.feedback) || '');
    } else {
      FB = String((choice && choice.feedback) || '');
    }
    savePlayer(); nzFlush();
    goTo(next);
    return;
  }

  var isB = !!(blk(node).hints || blk(node).near);
  if (!isB && !String(node.wrongText || '') && !String(node.hintText || '') && !String(node.wrongNextNodeId || '')) {
    nzLog({ nodeId: node.id, choiceId: cid, inputText: inputText || '', result: 'wrong', nextNodeId: '' });
    savePlayer(); nzFlush();
    say(T('err.noNext'));
    draw();
    return;
  }

  var limit = num(node.hintAfter) > 0 ? num(node.hintAfter) : 3;
  var hintTx = String(node.hintText || '');
  var showHint = num(node.hintAfter) > 0 && w >= limit && !!hintTx;
  var away = String(node.wrongNextNodeId || '');
  var goAway = !!away && w >= limit + (hintTx ? 1 : 0);
  nzLog({ nodeId: node.id, choiceId: cid, inputText: inputText || '',
    result: 'wrong', nextNodeId: goAway ? away : '' });
  if (showHint && !PLAYER.hinted[node.id]) {
    PLAYER.hinted[node.id] = 1;
    nzLog({ nodeId: node.id, choiceId: '', inputText: '', result: 'hint', nextNodeId: '' });
  }
  savePlayer(); nzFlush();
  if (goAway) {
    FB = String((choice && choice.feedback) || node.wrongText || '');
    goTo(away);
    return;
  }
  WRONGTX = String((choice && choice.feedback) || node.wrongText || T('q.wrong'))
    + (isB ? TF('q.wrongCount', { n: w }) : '');
  HINTTX = showHint ? hintTx : '';
  draw();
}
/** 認定証（年表）に出す答えを覚えておく */
function rememberAnswer(node, choice, inputText) {
  // set は「まとまり」の名前を全部つないだものを答えとして残す（選択肢1つ分では足りない）
  var t = String(node.answerType) === 'set'
    ? setGroups(node).map(function (g) { return g.label; }).join(' ／ ') : '';
  if (!t) t = choice ? String(choice.label || '') : '';
  if (!t) t = String(inputText || '');
  if (!t) return;
  PLAYER.ansText[node.id] = t;
  PLAYER.lastAns = { nodeId: node.id, title: String(node.title || ''), see: String(node.see || ''), text: t };
}
/* ---------- 画面 ---------- */
/** いま出している画面の合い札。画面が変わったかどうかを、これ1つで見分ける（2026-09-17） */
var SCRKEY = '';
/** いちばん上へ戻す。**2回戻す。**
 *  iOS Safari は、中身を入れ替えた直後の1回だけだと、そのあとの高さの変わり方や
 *  スクロールの固定（scroll anchoring）で押し戻されることがある（2026-09-17 中地さんの写し。
 *  正解演出のカードの上がアドレスバーの下に隠れていた）。次の描画のときにもう一度戻す。
 *  対になる決まりとして base.css に `html{ overflow-anchor:none }` を置いてある。 */
function scrollTop() {
  /* 答えの欄を押したときに足した空き（answer.js の ansRoom）は、画面が変わったら片づける */
  try { if (typeof ansRoomClear === 'function') ansRoomClear(); } catch (e) {}
  try { window.scrollTo(0, 0); } catch (e) {}
  try {
    if (window.requestAnimationFrame) {
      window.requestAnimationFrame(function () { try { window.scrollTo(0, 0); } catch (e) {} });
    }
  } catch (e) {}
}
function draw() {
  if (!DATA) return;
  var sc = DATA.scenario;
  $('ev').textContent = sc.eventName || sc.title || '';
  /* 上の帯。管理者モードのときは、どの画面でも右の札が ADMIN になり、帯が薄い金色になる（base.css） */
  $('who').textContent = ADMIN ? T('bar.admin') : (PLAYER.name ? TF('bar.who', { name: PLAYER.name }) : '');
  var bar = document.querySelector('.bar');
  if (bar) { if (ADMIN) bar.setAttribute('data-admin', '1'); else bar.removeAttribute('data-admin'); }
  /* 描き直しのあいだ、ページが一瞬縮んでブラウザにスクロールを押し戻されないよう、
     いまの高さを下支えしておく（絵を入れ替えると、読み直しのあいだ高さが 0 になる）。
     2026-09-17。答えの欄を押したときの寄せ直しで、下まで送った状態で
     「こたえあわせ」を押すと、いちばん上に跳ねていた。 */
  var y0 = window.scrollY !== undefined ? window.scrollY : (window.pageYOffset || 0);
  if (y0) drawFloor(Math.ceil(document.documentElement.scrollHeight));
  var key = drawView();
  /* 画面が変わったら、いちばん上へ戻す（2026-09-17 中地さんの指示）。
     長い謎を下まで読んでから次へ進むと、前の位置のまま次の画面が出ていた。
     戻すのは「別の画面になったとき」だけ。はずれの文（WRONGTX / NEARTX）のような
     **同じ画面の描き直し**では動かさない（合い札が変わらない）。 */
  if (key && key !== SCRKEY) { SCRKEY = key; drawFloor(0); scrollTop(); return; }
  if (!y0) return;
  /* 同じ画面の描き直し。押し戻されていたら、元の位置に戻す */
  var back = function () {
    var now = window.scrollY !== undefined ? window.scrollY : (window.pageYOffset || 0);
    if (Math.abs(now - y0) > 1) { try { window.scrollTo(0, y0); } catch (e) {} }
  };
  back();
  try { if (window.requestAnimationFrame) window.requestAnimationFrame(back); } catch (e) {}
  setTimeout(function () { back(); drawFloor(0); }, 300);
}
/** 描き直しのあいだだけ、ページの高さの下支えを置く（0 で外す） */
function drawFloor(px) {
  try { document.body.style.minHeight = px ? px + 'px' : ''; } catch (e) {}
}
/** 中身を描いて、その画面の合い札を返す。**draw() だけが呼ぶ。**
 *  空文字を返した画面は「同じ画面の描き直し」の扱いで、スクロールを動かさない。 */
function drawView() {
  if (VIEW === 'home') { viewHome(); return 'home'; }
  if (OKON) { viewOk(); return 'ok'; }
  if (FB) { viewFb(); return 'fb'; }
  if (!entryDone() || !PLAYER.nodeId) { viewCover(); return 'cover'; }
  if (PLAYER.pending) { viewQr(); return ''; }
  var n = nzNode(PLAYER.nodeId);
  if (!n) { PLAYER.nodeId = ''; savePlayer(); viewCover(); return 'cover'; }
  viewNode(n);
  return 'node:' + n.id;
}
/* 入場のしかた（entryMode）ごとの描き分け。**方式を足すときはここに1つ関数を足して ENTRIES に載せるだけ**
   （DESIGN_B「広がりを見越した約束」。serial は段階3、将来 決済リンクなど）。
   どの関数も「表紙の下に出す入力欄のHTML」を返し、begin() が押されたときの前さばきをする。 */
var ENTRIES = {
  none: { html: function () { return ''; }, ok: function () { return true; } },
  name: {
    html: function () {
      return '<label class="lab" for="nm">' + esc(T('entry.name')) + '</label>'
        + '<input type="text" id="nm" autocomplete="off" maxlength="30">';
    },
    after: function () {
      $('nm').value = PLAYER.name || '';
      $('nm').onkeydown = function (e) { if (e.key === 'Enter') $('goStart').click(); };
    },
    ok: function () {
      var nm = $('nm').value.trim();
      if (!nm) { say(T('entry.nameEmpty')); return false; }
      PLAYER.name = nm.slice(0, 30);
      return true;
    },
  },
  /* シリアル＋暗証番号（台帳 tickets）。段階3。
     はじめての人 … シリアルを入れて、暗証番号を自分で決める → 控えを見せてから始める
     別の端末の人 … 同じシリアルと暗証番号を入れると、この端末のものになる
     サーバの返事を待つので、ok() ではなく go() を使う（viewCover を見ること）。 */
  serial: {
    html: function () { return serHtml(); },
    after: function () { serAfter(); },
    go: function (done) { serGo(done); },
  },
};

/* ---------- シリアル入場（段階3・3b） ----------
   渡し方（シナリオの assignMode）で、はじめの画面が変わる。
     manual   … シリアルと暗証番号を打つ（紙を見ながら）
     qr       … ?t=シリアル で来る。使えるなら、そのままコードの画面へ
     staff    … スタッフ用の暗証番号を打つと、未使用のコードが1枚出る
     rotating … 受付の画面の ?k=鍵 で来る。鍵が生きていれば1枚出る
   コードが手に入ったら「あなたのコード」の画面。そこで4桁を決めて始める。
   どの方式でも「コードを持っている方はこちら」で手入力に落ちられる。 */
var SER = { step: '', serial: '', pin: '', busy: false };

/** いまの渡し方（シナリオが決める。空なら manual） */
function serMode() {
  var m = String((DATA.scenario && DATA.scenario.assignMode) || 'manual');
  return (m === 'qr' || m === 'staff' || m === 'rotating') ? m : 'manual';
}
/** 見せるときだけ 4文字ずつ区切る（K7M2-XH9Q）。送るときは区切りを外す */
function serPretty(x) {
  var v = String(x || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  return v.length > 4 ? v.slice(0, 4) + '-' + v.slice(4) : v;
}
/** 入口のはじめの段を決める */
function serStart() {
  if (SER.step) return;
  var m = serMode();
  if (m === 'manual') { SER.step = 'in'; return; }
  if (m === 'qr') { SER.step = TSER ? 'qr' : 'in'; return; }
  if (m === 'staff') { SER.step = 'staff'; return; }
  SER.step = AKEY ? 'k' : 'in';        /* rotating。鍵が無ければ手入力に落とす */
}
function serHtml() {
  serStart();
  if (SER.step === 'code') {
    return '<div class="codebox">'
      + '<div class="lab2">' + esc(T('code.title')) + '</div>'
      + '<div class="code" id="serCode">' + esc(serPretty(SER.serial)) + '</div>'
      + '<div class="coderow">'
      + '<button type="button" class="btn thin" id="serCopy">' + esc(T('code.copy')) + '</button>'
      + '<button type="button" class="btn thin" id="serMail">' + esc(T('code.mail')) + '</button></div>'
      + '<p class="note codenote">' + esc(T('code.save')) + '</p></div>'
      + '<label class="lab" for="pn">' + esc(T('pin.label')) + '</label>'
      + '<input type="tel" id="pn" autocomplete="off" maxlength="4" inputmode="numeric" class="mono">'
      + '<p class="note serialhelp">' + esc(T('code.setPin')) + '</p>';
  }
  if (SER.step === 'staff') {
    return '<p class="note serialhelp">' + esc(T('staff.assignLead')) + '</p>'
      + '<label class="lab" for="ap">' + esc(T('staff.assign')) + '</label>'
      + '<input type="tel" id="ap" autocomplete="off" maxlength="8" inputmode="numeric" class="mono">'
      + '<p class="note serialhelp"><a href="#" id="serManual">' + esc(T('code.have')) + '</a></p>';
  }
  if (SER.step === 'qr' || SER.step === 'k') {
    return '<p class="note serialhelp">' + esc(T('entry.checking')) + '</p>';
  }
  return '<label class="lab" for="sn">' + esc(T('entry.serial')) + '</label>'
    + '<input type="text" id="sn" autocomplete="off" maxlength="16" class="mono">'
    + '<label class="lab" for="pn">' + esc(T('pin.label')) + '</label>'
    + '<input type="tel" id="pn" autocomplete="off" maxlength="4" inputmode="numeric" class="mono">'
    + (serMode() === 'manual' ? ''
      : '<p class="note serialhelp"><a href="#" id="serBack">' + esc(T('code.back')) + '</a></p>');
}
function serAfter() {
  if (SER.step === 'code') {
    $('serCopy').onclick = function () { serCopy(); };
    $('serMail').onclick = function () { serMail(); };
    $('pn').onkeydown = function (e) { if (e.key === 'Enter') $('goStart').click(); };
    return;
  }
  if (SER.step === 'staff') {
    if ($('serManual')) $('serManual').onclick = function (e) { e.preventDefault(); SER.step = 'in'; viewCover(); };
    $('ap').onkeydown = function (e) { if (e.key === 'Enter') $('goStart').click(); };
    $('goStart').textContent = T('staff.assignGo');
    return;
  }
  if (SER.step === 'qr' || SER.step === 'k') {
    $('goStart').disabled = true;
    if (!SER.busy) { SER.busy = true; setTimeout(serAuto, 60); }
    return;
  }
  if ($('sn')) $('sn').value = SER.serial || '';
  if ($('serBack')) $('serBack').onclick = function (e) { e.preventDefault(); SER.step = ''; serStart(); viewCover(); };
  if ($('pn')) $('pn').onkeydown = function (e) { if (e.key === 'Enter') $('goStart').click(); };
}
/** ?t= と ?k= は、画面を出したらすぐサーバに聞きにいく */
function serAuto() {
  if (SER.step === 'qr') {
    call('apiTicketState', [S, TSER, nzDeviceId()])
      .then(function (r) {
        SER.busy = false;
        if (r.state === 'ready' || r.state === 'mine') { SER.serial = r.serial; SER.step = 'code'; viewCover(); return; }
        say(T('assign.used'));
        SER.step = 'in'; viewCover();
      })
      .catch(function (e) { SER.busy = false; say(serMsg(e)); SER.step = 'in'; viewCover(); });
    return;
  }
  call('apiAllocate', [S, '', nzDeviceId(), AKEY])
    .then(function (r) { SER.busy = false; SER.serial = r.serial; SER.step = 'code'; viewCover(); })
    .catch(function (e) { SER.busy = false; say(serMsg(e)); SER.step = 'in'; viewCover(); });
}
/** サーバの断り文。頭の印（PIN / LOCKED / EXPIRED / EMPTY）は外して出す */
function serMsg(e) {
  var m = String((e && e.message) || e);
  if (m.indexOf('EXPIRED') === 0) return T('assign.expired');
  if (m.indexOf('EMPTY') === 0) return T('assign.empty');
  return m.replace(/^(PIN|LOCKED)\s*/, '');
}
function serCopy() {
  var v = serPretty(SER.serial);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(v); say(T('code.copied')); return; }
  } catch (e) {}
  var ta = document.createElement('textarea');
  ta.value = v; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); say(T('code.copied')); } catch (e2) {}
  document.body.removeChild(ta);
}
function serMail() {
  var sub = encodeURIComponent(T('code.mailSub'));
  var body = encodeURIComponent(T('code.title') + ' ' + serPretty(SER.serial) + '\n' + location.href.split('#')[0]);
  try { location.href = 'mailto:?subject=' + sub + '&body=' + body; } catch (e) {}
}
/** 「はじめる」を押したとき */
function serGo(done) {
  /* コードの画面で、もう有効化が済んでいるとき（手で打った人の控え）は、そのまま始める */
  if (SER.step === 'code' && PLAYER.serial && PLAYER.serial === SER.serial) { done(); return; }
  if (SER.step === 'staff') {
    var ap = $('ap').value.trim();
    if (!ap) { say(T('staff.assign')); return; }
    $('goStart').disabled = true;
    say(T('entry.checking'));
    call('apiAllocate', [S, ap, nzDeviceId(), ''])
      .then(function (r) { SER.serial = r.serial; SER.step = 'code'; viewCover(); })
      .catch(function (e) { $('goStart').disabled = false; say(serMsg(e)); });
    return;
  }
  var sn = (SER.step === 'code') ? SER.serial : $('sn').value.trim().toUpperCase().replace(/[\s\-]/g, '');
  var pn = $('pn').value.trim();
  if (!sn) { say(T('entry.serialEmpty')); return; }
  if (!/^[0-9]{4}$/.test(pn)) { say(T('pin.bad')); return; }
  $('goStart').disabled = true;
  say(T('entry.checking'));
  call('apiActivate', [sn, pn, nzDeviceId()])
    .then(function (r) {
      PLAYER.serial = r.serial || sn;
      PLAYER.name = PLAYER.name || r.serial || sn;   /* 見守りの一覧に出す名はシリアル */
      savePlayer();
      setNet('');
      if (r.mode === 'new' && SER.step !== 'code') {  /* 手で打った人にも控えを見せてから始める */
        SER.step = 'code'; SER.serial = r.serial || sn; SER.pin = pn;
        viewCover();      /* つぎに「はじめる」を押すと、上の1行目で done() に入る */
        return;
      }
      done();
    })
    .catch(function (e) { $('goStart').disabled = false; say(serMsg(e)); });
}

/** 表紙。入場のしかたは entryMode で決まる */
function viewCover() {
  var sc = DATA.scenario;
  var mode = ENTRIES[ENTRY] ? ENTRY : 'name';
  var e = ENTRIES[mode];
  var lead = sc.description ? String(sc.description) : T('entry.lead');
  /* 表紙は1枚のカード。裾の帯（.band）はテーマ側で色が付く（和紙は朱） */
  $('app').innerHTML =
    '<div class="card cover-card">'
    + (sc.logoUrl ? '<img class="logo" src="' + esc(sc.logoUrl) + '" alt="">' : '')
    + '<h1 class="ttl cover">' + esc(T('entry.title') || sc.title || T('entry.fallback')) + '</h1>'
    + '<p class="body lead2">' + esc(lead) + '</p>'
    + '<div class="ans">' + e.html()
    + '<button class="go" id="goStart">' + esc(T('common.begin')) + '</button></div>'
    + '<div class="band"></div></div>';
  if (e.after) e.after();
  $('goStart').onclick = function () {
    /* 入場の欄に admin と打ってあれば、台帳も暗証番号も通さずに始める（シナリオの adminOn が真のときだけ） */
    if (adminAllowed() && adminTyped()) { $('goStart').disabled = true; adminBegin(); return; }
    /* go() があるものは、サーバの返事を待ってから始める（シリアル入場） */
    if (e.go) { e.go(function () { $('goStart').disabled = true; beginPlay(); }); return; }
    if (!e.ok()) return;
    $('goStart').disabled = true;
    beginPlay();
  };
}
/** はじめる。進み具合をまっさらにして、はじめのノードへ */
function beginPlay() {
  if (!PLAYER.startedAt) PLAYER.startedAt = nzNow();
  PLAYER.startMs = Date.now();
  PLAYER.wrong = {}; PLAYER.hinted = {}; PLAYER.hist = []; PLAYER.score = 0;
  PLAYER.finishedAt = ''; PLAYER.endingNodeId = '';
  PLAYER.openedAt = {}; PLAYER.hintsOpen = {}; PLAYER.hintAt = {}; PLAYER.setOk = {};
  PLAYER.rescued = {}; PLAYER.ansText = {}; PLAYER.stamps = []; PLAYER.timeUp = {}; PLAYER.mediaDone = {};
  PLAYER.routeNo = ''; PLAYER.prizeAt = 0; PLAYER.lastAns = null;
  savePlayer(); nzTouch(); nzFlush();
  goTo(NOK && nzNode(N) ? N : DATA.scenario.startNodeId);
}

/** 一言（feedback）。読んでから「つぎへ」 */
function viewFb() {
  $('app').innerHTML = '<div class="fb">' + esc(FB) + '</div><button class="go" id="fbGo">' + esc(T('common.next')) + '</button>';
  $('fbGo').onclick = function () { FB = ''; draw(); try { window.scrollTo(0, 0); } catch (e) {} };
}

/** 会場のQR待ち */
function viewQr() {
  $('app').innerHTML = '<div class="qr">'
    + '<div class="big">' + esc(T('qr.title')) + '</div>'
    + '<div class="body qrbody">' + esc(T('qr.body')) + '</div>'
    + '</div>'
    + '<p class="lead qrnote">' + esc(T('qr.note')) + '</p>';
}

/* ---------- ノードの振り分け ---------- */
function viewNode(n) {
  var kind = String(n.kind || 'question');
  if (kind === 'wrong') { viewWrong(n); return; }
  // ending ブロック（認定証・景品確認）は、エンドでないノードにも置ける。
  // エンドには出口が無いので、認定証は info に置いて「景品」のエンドへつなぐ形にする
  if (kind === 'ending' || blk(n).ending) { viewEnding(n); return; }
  if (kind === 'info' && String(n.template || '') === 'howto') { viewHowto(n); return; }
  if (kind === 'info' && String(n.template || '') === 'move') { viewMove(n); return; }
  if (kind === 'question') { viewQuestion(n); return; }
  viewPlain(n);
}

/** 題名の行（2026-09-17）。左に見出し、右に「もう一度動画を見る」などの小さな文字リンク。
 *  ttl … 見出しの HTML（空でもよい）／ag … mediaAgainHtml の返り。どちらも空なら何も出さない。
 *  どの種類のノード（謎・読むだけ・遊び方・移動案内・結末）でも、ここに同じ形で並べる。 */
function ttlRowHtml(ttl, ag) {
  if (!ttl && !ag) return '';
  return '<div class="ttlrow">' + (ttl || '<span></span>') + (ag || '') + '</div>';
}

/** ノードの頭（等幅ラベル・順路バー・題名・本文・補助解説） */
function headHtml(n, right) {
  var qi = qIndexOf(n), qs = qSteps();
  var hasNo = n.routeNo !== '' && n.routeNo !== undefined && n.routeNo !== null;
  var left = hasNo
    ? (n.place ? TF('q.stepPlace', { n: num(n.routeNo), place: n.place }) : TF('q.step', { n: num(n.routeNo) }))
    : String(n.place || '');
  var r = right !== undefined ? right : (qi >= 0 ? TF('q.n', { i: qi + 1, t: qs.length }) : '');
  var h = '';
  if (left || r) h += '<div class="meta"><span>' + esc(left) + '</span><span id="metaR">' + esc(r) + '</span></div>';
  h += routeBar();
  /* 題名の行。右はしに「もう一度動画を見る」などの小さな文字リンクを並べる（2026-09-17） */
  h += ttlRowHtml(n.title ? '<h1 class="ttl">' + esc(n.title) + '</h1>' : '', mediaAgainHtml(n));
  h += mediaStageHeadHtml(n);             // 画面の中の動画（inline）と音声は、題名の行と問題文のあいだ
  if (n.body) h += '<p class="body qtext">' + esc(n.body) + '</p>';
  if (n.see) h += '<p class="subnote">' + esc(n.see) + '</p>';   // 補助解説（列は see のまま）
  return h;
}
/** 読むだけのノード（はじまり・ふつうの説明） */
function viewPlain(n) {
  $('app').innerHTML = '<div class="card">' + headHtml(n, '') + mediaHtml(n)
    + '<div class="ans"><button class="go" id="nx">' + esc(T('common.next')) + '</button></div></div>'
    + mediaLayerHtml(n);
  bindMedia(n);
  $('nx').onclick = function () {
    var next = String(n.nextNodeId || '');
    if (!next) { say(T('err.noNext')); return; }
    $('nx').disabled = true;
    nzLog({ nodeId: n.id, choiceId: '', inputText: '', result: 'next', nextNodeId: next });
    goTo(next);
  };
}

/* ---------- 1秒ごと（経過時間・時計・ヒントの残り・制限時間） ---------- */
function tickSec() {
  var e = document.querySelector('.js-elapsed');
  if (e) e.textContent = elapsed();
  var c = document.querySelector('.js-clock');
  if (c) { var d = new Date(); c.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
  if (!DATA || VIEW === 'home' || OKON || FB) return;
  var n = nzNode(PLAYER.nodeId);
  if (!n || String(n.kind) !== 'question') return;
  var w = document.querySelector('.js-wait');
  var p = hintPlan(n);
  if (p && p.next >= 0) {
    if (p.ok && document.querySelector('.hint-locked')) redrawHints(n);
    else if (!p.ok) { var lk = document.querySelector('.hint-locked'); if (lk) lk.textContent = waitText(p); }
  }
  timeCheck(n);
}
setInterval(tickSec, 1000);
/* ---------- 隠しの「やり直す」（名前を5秒長押し。運営がスマホを渡し直すとき用） ---------- */
(function () {
  var t = null, who = $('who');
  function clear() { if (t) { clearTimeout(t); t = null; } }
  function down() { clear(); t = setTimeout(reveal, 5000); }
  function reveal() {
    clear();
    var b = document.createElement('button');
    b.className = 'go thin'; b.textContent = T('reset.button');
    b.onclick = function () {
      if (!window.confirm(T('reset.confirm'))) { netDraw(); return; }
      nzFlush();
      setTimeout(function () {
        nzWipeDevice();                  // 消し込みは state.js の役
        FB = ''; WRONGTX = ''; NEARTX = ''; HINTTX = ''; WFB = ''; OKON = null; VIEW = '';
        QROK = {}; NOK = false;
        setNet(''); draw();
      }, 800);
    };
    $('net').textContent = ''; $('net').appendChild(b);
  }
  who.addEventListener('pointerdown', down);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (nm) { who.addEventListener(nm, clear); });
  who.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();

/* 下書きの試し遊び（?preview=合い札）。いつも最初から始めて、跡を残さない。
   帯を出すのはここだけ（2026-09-16 まで GAS の PREVIEW_JS が入れていた）。 */
if (PREVIEW) {
  try { localStorage.removeItem(PKEY); localStorage.removeItem(OKEY); localStorage.removeItem(SKEY); } catch (e) {}
  (function () {
    var b = document.createElement('div');
    b.setAttribute('style', 'background:#fff3bf;color:#7a5b00;font:12px sans-serif;padding:5px 10px;text-align:center');
    b.textContent = '試し遊び（下書き）。ここでの記録は残りません。';
    var put = function () { if (document.body) document.body.insertBefore(b, document.body.firstChild); };
    if (document.body) put(); else window.addEventListener('DOMContentLoaded', put);
  })();
}

nzStgTag();   /* 試験環境なら上の帯に「試験」の札（2026-09-18） */
loadPlayer(); loadOut(); netDraw();
boot('');
</script>

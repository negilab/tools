
<!DOCTYPE html>
<meta charset="utf-8">
<script src="fake.js"></script>
<style>
  :root{ --navy:#345466; --green:#2a8761; --ink:#1c2b33; --sub:#6b7c86; --line:#e2e8ec; --bg:#f5f7f8; --red:#c0392b; --yel:#fff3bf; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif; font-size:13px; line-height:1.6; -webkit-text-size-adjust:100%; }
  .wrap{min-height:100%; display:flex; flex-direction:column}
  .top{ order:0; background:var(--navy); color:#fff; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  .top .brand{font-size:15px; font-weight:700}
  .top .me{font-size:11px; color:#c6d7e0; margin-left:auto}
  .top .stat{font-size:12px; color:#c6d7e0; display:none; white-space:nowrap}
  .top .stat.on{display:inline-block}
  .top .stat.busy::before{ content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:#8fd8b0; margin-right:6px; vertical-align:middle; animation:blink 1s infinite; }
  .top .stat.ok{color:#a9e8c4} .top .stat.ng{color:#ffb4a8; font-weight:700}
  @keyframes blink{0%,100%{opacity:.25} 50%{opacity:1}}
  .nav{ display:none; }
  .back{background:transparent; color:#fff; border:1px solid #9fb8c6; border-radius:6px; padding:3px 9px; font-size:12px; margin-right:4px; white-space:nowrap}
  .back:hover{background:rgba(255,255,255,.12)}
  .nav button{ flex:1 1 0; border:none; background:none; font:inherit; color:var(--sub); padding:7px 0 8px; cursor:pointer; border-radius:0; line-height:1.35; }
  .nav button .ic{display:block; font-size:15px} .nav button .tx{display:block; font-size:11px}
  .nav button.on{color:var(--green); font-weight:700; box-shadow:inset 0 2px 0 var(--green)}
  .body{order:1; flex:1 1 auto; padding:12px 13px 28px}
  .view{display:none} .view.on{display:block}
  @media (min-width:860px){
    .nav{display:flex; position:static; order:1; border-top:none; border-bottom:1px solid var(--line); padding:0 14px}
    .nav button{flex:0 0 auto; padding:8px 20px 9px}
    .nav button .ic{display:inline; font-size:13px; margin-right:5px} .nav button .tx{display:inline; font-size:13px}
    .body{order:2; padding:16px 20px 28px}
  }
  h2{font-size:12px; color:var(--sub); letter-spacing:.08em; margin:0 0 8px; font-weight:700}
  .card{background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px}
  .f{display:flex; flex-direction:column; gap:3px; margin-bottom:9px} .f:last-child{margin-bottom:0}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:9px 12px}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px 12px}
  label{font-size:11px; color:var(--sub)}
  input,select,textarea{ font:inherit; color:inherit; padding:6px 8px; border:1px solid #cfd8dd; border-radius:5px; background:#fff; width:100%; min-width:0; }
  @media (max-width:600px){ input,select,textarea{font-size:16px} }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 2px rgba(42,135,97,.15); }
  input[type=checkbox]{width:auto}
  textarea{min-height:70px; resize:vertical}
  button{font:inherit; cursor:pointer; border-radius:6px}
  .btn{background:#fff; color:var(--navy); border:1px solid #b9c9d2; padding:7px 13px; font-weight:700}
  .btn:hover{background:#eef3f6}
  .btn.mini{padding:3px 9px; font-size:12px; font-weight:400}
  .btn.red{color:var(--red); border-color:#e2b4ae}
  .go{background:var(--green); color:#fff; border:none; padding:9px 20px; font-weight:700}
  .go:hover{background:#22704f} .go:disabled{background:#a9c6b7; cursor:default}
  .bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:11px}
  .none{color:var(--sub); padding:18px 4px; text-align:center}
  .note{font-size:11px; color:var(--sub); margin:6px 3px 0; line-height:1.5}
  .band{ background:var(--navy); color:#fff; border-radius:7px; padding:7px 13px; margin-bottom:10px; display:flex; gap:16px; flex-wrap:wrap; font-size:12px; font-weight:700; align-items:center; }
  .band .sp{margin-left:auto}
  .fcard{background:#fff; border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:9px}
  .fcard .nm{font-size:15px; font-weight:700}
  .fcard .st{font-size:11px; color:#fff; background:var(--green); border-radius:4px; padding:1px 7px; margin-left:8px; vertical-align:middle}
  .fcard .st.off{background:#8a97a0}
  .fcard .meta{font-size:11px; color:var(--sub); margin:2px 0 8px}
  .fcard .acts{display:flex; gap:6px; flex-wrap:wrap}
  .url{font-size:11px; color:var(--sub); word-break:break-all; margin-top:6px}
  .urlrow{display:flex; gap:10px; align-items:flex-start; margin-top:8px}
  .urlrow canvas{width:84px; height:84px; border:1px solid var(--line); border-radius:4px; cursor:pointer; flex:0 0 auto; background:#fff}
  .urlrow .qn{font-size:10px; color:var(--sub); text-align:center; width:84px}
  .urlrow input{font-size:11px; color:var(--sub); padding:4px 6px}
  /* 回答の表 */
  .tblwrap{overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:8px}
  table{border-collapse:collapse; font-size:12px; min-width:100%}
  th,td{border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis}
  th{background:#f0f4f6; color:var(--sub); font-weight:700; position:sticky; top:0; font-size:11px}
  tr.r{cursor:pointer} tr.r:hover td{background:#fbfdfe}
  td.st{font-weight:700; white-space:normal; min-width:120px}
  td.ph img{width:44px; height:44px; object-fit:cover; border-radius:5px; border:1px solid var(--line); margin-right:3px; vertical-align:middle; background:#eee}
  td.ph .nop{color:#b0bcc3}
  td.no{color:var(--sub)}
  td.ed{cursor:text}
  td.ed:hover{background:#fbfdfe; box-shadow:inset 0 0 0 1px #cfd8dd}
  td.ed:focus{outline:2px solid var(--green); outline-offset:-2px; background:#f7fbf9; white-space:pre-wrap; max-width:none}
  /* 詳細・拡大 */
  .pop{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:none; align-items:flex-end; justify-content:center}
  .pop.on{display:flex}
  .pop .box{background:#fff; width:100%; max-width:720px; max-height:92vh; overflow:auto; border-radius:12px 12px 0 0; padding:14px 16px 24px}
  @media (min-width:860px){ .pop{align-items:center} .pop .box{border-radius:12px; max-height:85vh} }
  .pop h3{margin:0 0 8px; font-size:16px}
  .dl{display:grid; grid-template-columns:130px 1fr; gap:4px 10px; font-size:13px}
  .dl dt{color:var(--sub); font-size:11px; padding-top:2px} .dl dd{margin:0; white-space:pre-wrap; word-break:break-word}
  .pics{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
  .pics img{width:110px; height:110px; object-fit:cover; border-radius:7px; border:1px solid var(--line); cursor:zoom-in; background:#eee}
  .big{position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:30; display:none; align-items:center; justify-content:center; flex-direction:column}
  .big.on{display:flex}
  .big img{max-width:96vw; max-height:84vh; object-fit:contain}
  .big .cap{color:#fff; font-size:12px; margin-top:8px}
  .big .cap a{color:#9fd8ff}
  .big .x{position:absolute; top:10px; right:12px; background:none; border:none; color:#fff; font-size:28px}
  /* 編集 */
  .qbox{background:#fff; border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:9px}
  .qbox .hd{display:flex; gap:6px; align-items:center; margin-bottom:6px}
  .qbox .hd .n{font-size:11px; color:var(--sub); width:22px}
  .qbox .hd input{flex:1 1 auto; font-weight:700}
  .qbox .hd button{padding:4px 8px; font-size:12px}
  .qbox .opts{display:none} .qbox.has-opts .opts{display:block}
  .qbox .pmax{display:none} .qbox.is-photo .pmax{display:block}
  .hdimg{max-width:320px; max-height:120px; display:block; border-radius:6px; border:1px solid var(--line); margin-top:4px}
  .chk{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink)}
  .chk input{width:16px; height:16px}
  /* メール */
  .tos{max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:#fff; display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:2px 14px; align-content:start}
  .tos label{display:flex; gap:6px; align-items:baseline; font-size:12px; color:var(--ink); padding:3px 0; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tos label span{overflow:hidden; text-overflow:ellipsis}
  .tos .none{grid-column:1 / -1}
  .tos label input{width:16px; height:16px}
  .tos .mail{color:var(--sub); font-size:11px}
  .tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:4px}
  .tags button{font-size:11px; padding:2px 8px; background:#e6f4ee; border:1px solid #9fd0b8; color:#1f6b4c; border-radius:12px}
  .tags button.blank{background:#fff3bf; border-color:#e2c46a; color:#7a5b00}
  .warn{background:var(--yel); border-radius:6px; padding:6px 10px; font-size:12px; margin-top:6px; display:none}
  .warn.on{display:block}
  .abs{border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:#fff}
  .abs label{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--ink); padding:3px 0}
  .abs .from{background:var(--yel); padding:0 4px; border-radius:3px}
  .abs .to{font-weight:700; color:var(--green)}
  .log{font-size:12px} .log div{padding:4px 0; border-bottom:1px solid var(--line)}
  /* 関門・幕・お知らせ・確認 */
  .gate{position:fixed; inset:0; background:var(--bg); z-index:40; display:flex; align-items:center; justify-content:center; padding:20px}
  .gate.off{display:none}
  .gate .box{background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px 20px; width:100%; max-width:360px}
  .gate h1{font-size:16px; margin:0 0 12px}
  .gate .ng{color:var(--red); font-size:12px; min-height:18px; margin-top:6px}
  .veil{position:fixed; inset:0; background:rgba(255,255,255,.6); z-index:35; display:none; align-items:center; justify-content:center}
  .veil.on{display:flex}
  .veil i{width:34px; height:34px; border:4px solid #cfd8dd; border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .say{ position:fixed; left:12px; right:12px; bottom:64px; background:#fff; border:1px solid #b9c9d2; border-radius:9px; padding:10px 14px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.12); display:none; z-index:38; white-space:pre-wrap }
  .say.on{display:block} .say.ng{color:var(--red); border-color:#e2b4ae}
  .ask{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:39; display:none; align-items:center; justify-content:center; padding:20px}
  .ask.on{display:flex}
  .ask .box{background:#fff; border-radius:10px; padding:18px 18px 14px; max-width:380px; width:100%}
  .ask .t{font-size:14px; margin-bottom:14px; white-space:pre-wrap}
  .ask .b{display:flex; gap:8px; justify-content:flex-end}
  .out{margin-top:10px; font-size:13px}
  /* 消防PDFの下書き（紙の見た目） */
  .fire{margin-top:12px; display:none; max-width:980px; background:#e6ebef; border:1px solid #d3dbe1; border-radius:10px; padding:12px 12px 2px}
  .btn.on{background:var(--navy); color:#fff; border-color:var(--navy)}
  .fire.on{display:block}
  .fire .ctl{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; font-size:12px}
  .fire .ctl .seg{display:inline-flex; border:1px solid #cfd8dd; border-radius:6px; overflow:hidden}
  .fire .ctl .seg button{border:none; background:#fff; padding:3px 10px; font-size:12px; border-radius:0}
  .fire .ctl .seg button.on{background:var(--navy); color:#fff}
  .sheet{position:relative; width:100%; aspect-ratio:297/210; background:#fff; border:1px solid #cdd5da; box-shadow:0 2px 10px rgba(0,0,0,.08); margin:0 0 14px; padding:2.6% 3.4% 2.4%; overflow:hidden}
  .sheet .shd{display:flex; align-items:baseline; gap:1.2em; border-bottom:1.5px solid #2a4a5e; color:#2a4a5e; font-size:.95em; padding-bottom:.25em; margin-bottom:.9em; letter-spacing:.06em; white-space:nowrap; overflow:hidden}
  .sheet .shd b{font-size:1.25em; letter-spacing:.08em}
  .sheet .shd .r{margin-left:auto; font-size:.85em; color:#667}
  .sheet .grid{display:grid; gap:2.2% 2.2%; height:83%}
  .sheet .cell{position:relative; display:flex; flex-direction:column; min-height:0}
  .sheet .cell .nm{border:1px solid #c9d2d8; border-left:3px solid #2a4a5e; border-radius:2px; font-weight:700; padding:.15em .6em; margin-bottom:.35em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.04em; background:#f6f8f9; font-size:1em}
  .sheet .cell .im{flex:1 1 auto; min-height:0; border:1px solid #e3e8ec; border-radius:2px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#fff}
  .sheet .cell .im img{max-width:96%; max-height:96%; object-fit:contain}
  .sheet .cell .im img.r90, .sheet .cell .im img.r270{max-width:none; max-height:none; width:auto; height:auto}
  .sheet .cell .ov{position:absolute; left:0; right:0; bottom:0; display:none; gap:4px; justify-content:center; padding:6px; background:linear-gradient(transparent, rgba(0,0,0,.55))}
  .sheet .cell:hover .ov, .sheet .cell.sel .ov{display:flex}
  .sheet .cell .ov button{font-size:12px; padding:3px 8px; background:#fff; border:1px solid #b9c9d2; border-radius:5px; color:var(--navy)}
  .sheet .cell .ov button.red{color:var(--red)}
  .sheet .cell .no{color:var(--sub); font-size:.9em}
  .sheet .pn{position:absolute; left:0; right:0; bottom:.6%; text-align:center; font-size:.8em; color:#889; letter-spacing:.1em}
  .fire .offs{font-size:12px; color:var(--sub); margin-bottom:10px}
  .hk{margin-top:12px; display:none; background:#e6ebef; border:1px solid #d3dbe1; border-radius:10px; padding:12px 12px 12px}
  .hk.on{display:block}
  .hk .ctl{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; font-size:12px}
  .hk .wrap2{overflow-x:auto; background:#fff; border:1px solid #cdd5da}
  .hk table{border-collapse:collapse; font-size:12px; min-width:100%}
  .hk th{background:#f0f4f6; color:var(--sub); font-weight:700; font-size:11px; padding:5px 6px; border:1px solid #dfe5ea; text-align:left; white-space:pre-line}
  .hk td{border:1px solid #dfe5ea; padding:4px 6px; vertical-align:top; min-width:60px}
  .hk td[contenteditable]{cursor:text; white-space:pre-wrap; min-height:1.4em}
  .hk td[contenteditable]:focus{outline:2px solid var(--green); outline-offset:-2px; background:#f7fbf9}
  .hk td.c{text-align:center; width:36px}
  .hk tr.off td{opacity:.4}
  .hk td.no{color:var(--sub); text-align:center; width:34px}
  /* 詳細の編集 */
  .ed .f{margin-bottom:8px}
  .ed .opt{display:flex; gap:8px; align-items:flex-start; padding:4px 2px; font-size:13px}
  .ed .opt input{width:18px; height:18px; margin-top:2px}
  .ed .pics img{cursor:default}
  .ed .pc{display:inline-block; position:relative; margin:0 8px 8px 0; text-align:center}
  .ed .pc .pb{display:flex; gap:4px; justify-content:center; margin-top:3px}
  .ed .pc .pb button{font-size:11px; padding:2px 7px}
  .ed .pc.gone img{opacity:.3}
  .ed .pc .nw{position:absolute; top:4px; left:4px; background:var(--green); color:#fff; font-size:10px; border-radius:4px; padding:0 5px}
  .fire .offs button{font-size:11px; padding:1px 8px; margin:0 3px}
  .pal{border:1px solid #cfd8dd; border-radius:6px; background:#fff; padding:4px 6px; display:flex; flex-wrap:wrap; gap:0 6px}
  .pal .pr{display:inline-flex; align-items:center; gap:5px; padding:3px 7px; border-radius:6px; cursor:pointer; user-select:none}
  .pal .pr:hover{background:#eef3f6}
  .pal .pk{font-size:12px; color:var(--sub); white-space:nowrap}
  .pal .chip{cursor:pointer; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle}
  .chipbox.one{white-space:nowrap; overflow-x:auto; min-height:34px; padding:6px 10px}
  .chipbox{border:1px solid #cfd8dd; border-radius:6px; padding:8px 10px; min-height:40px; white-space:pre-wrap; background:#fff; font-size:13px; line-height:1.7; outline:none}
  .chipbox:focus{border-color:var(--green); box-shadow:0 0 0 2px rgba(42,135,97,.15)}
  .chipbox.t{font-weight:700; font-size:15px}
  .chip{display:inline-block; background:#e6f4ee; color:#1f6b4c; border:1px solid #9fd0b8; border-radius:5px; padding:0 6px; margin:0 2px; font-size:12px; font-weight:700; line-height:1.5; user-select:none; vertical-align:baseline}
  .chip.empty{background:#fff3bf; border-color:#e2c46a; color:#7a5b00}
  .prev{background:#f7f9fa; border:1px dashed #cfd8dd; border-radius:6px; padding:8px 10px; white-space:pre-wrap; font-size:13px; color:var(--ink); min-height:22px}
  .prev.t{font-weight:700; font-size:15px}
  .prev a{color:#1a6fb5}
  .autolab{font-size:11px; color:var(--green); background:#e6f4ee; border-radius:4px; padding:0 6px; margin-left:6px}
  .lk{background:none; border:none; color:#1a6fb5; text-decoration:underline; font-size:11px; padding:0 4px; cursor:pointer}
  .ro{background:#f3f5f6; color:var(--sub)}
  .notice{ position:fixed; left:12px; right:12px; top:56px; background:#fff; border:2px solid var(--green); border-radius:10px; padding:12px 40px 12px 14px; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.15); display:none; z-index:37; white-space:pre-wrap }
  .notice.on{display:block}
  .notice .x{position:absolute; top:6px; right:8px; background:none; border:none; font-size:20px; color:var(--sub)}
  @media (min-width:860px){ .notice{left:auto; right:20px; max-width:420px} }
  .out a{color:#1a6fb5}
  .tutb{background:none; border:1px solid #7f9aab; color:#dce8ee; border-radius:6px; padding:3px 9px; font-size:11px; cursor:pointer}
  .tour{position:fixed; inset:0; z-index:36}
  .tour .hole{position:fixed; border-radius:6px; box-shadow:0 0 0 9999px rgba(18,24,34,.6); outline:2px solid #ffd75e; pointer-events:none; transition:all .15s}
  .tour .tbox{position:fixed; width:340px; max-width:calc(100vw - 16px); box-sizing:border-box; background:#fff; border-radius:8px; box-shadow:0 10px 30px rgba(10,20,40,.35); padding:14px 16px; font-size:13px; line-height:1.65}
  .tour .tbox .n{color:#8a94a6; font-size:11px}
  .tour .tbox .t{font-weight:700; font-size:14px; margin:2px 0 4px}
  .tour .tbox .ok{display:flex; gap:6px; align-items:center; justify-content:flex-end; margin-top:12px}
  .tour .tbox .noshow{display:flex; align-items:center; gap:4px; margin-top:8px; font-size:12px; color:var(--sub); cursor:pointer}
  .tour .tbox button{border:1px solid #b9c9d2; background:#fff; color:var(--ink); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer}
  .tour .tbox button.primary{background:var(--green); border-color:var(--green); color:#fff}
  @media (prefers-reduced-motion: reduce){ .tour .hole{transition:none} }
</style>
<div class="wrap">
  <div class="top"><span class="brand">出店フォーム 管理</span><span class="stat" id="stat"></span><span class="me" id="me"></span><button class="tutb" id="tutBtn">使い方</button></div>
  <div class="nav">
    <button id="nForms" class="on"><span class="ic">▤</span><span class="tx">フォーム</span></button>
    <button id="nAns"><span class="ic">☰</span><span class="tx">回答</span></button>
    <button id="nEdit"><span class="ic">✎</span><span class="tx">編集</span></button>
    <button id="nMail"><span class="ic">✉</span><span class="tx">メール</span></button>
  </div>
  <div class="body">
    <div class="view on" id="vForms">
      <div class="bar"><button class="go" id="fNew">新しいフォーム</button><button class="btn" id="fSample">見本から作る</button><button class="btn" id="fSample2">見本から作る（保健所届出版）</button><button class="btn mini" id="fReload">読み直す</button></div>
      <div id="fList"></div>
    </div>
    <div class="view" id="vAns">

  /** 本文の中の、フォームの値と同じ言葉・日付・時間・店の名前などを差し込みの候補にする */
  function abstractCands(text) {
    var f = ANS.form, out = [], seen = {};
    var add = function (from, to) { from = String(from || '').trim(); if (from.length < 2 || seen[from] || text.indexOf(from) < 0) return; seen[from] = 1; out.push({ from: from, to: to }); };
    add(f.eventName, 'イベント名'); add(f.eventDate, '開催日'); add(f.eventTime, '開催時間'); add(f.venue, '会場'); add(f.contact, '連絡先');
    // 日付・時間の形（フォームの値と違っていても候補に出す）
    (text.match(/(\d{4}年)?\d{1,2}月\d{1,2}日(（[月火水木金土日]）|\([月火水木金土日]\))?/g) || []).forEach(function (m) { add(m, '開催日'); });
    (text.match(/\d{1,2}[:：]\d{2}\s*[〜～~\-]\s*\d{1,2}[:：]\d{2}/g) || []).forEach(function (m) { add(m, '開催時間'); });
    // 回答にある店舗名・代表者名（1人ずつ送るときに使う）
    ANS.rows.forEach(function (r) { add(r.store, '店舗名'); f.questions.forEach(function (q) { if (q.role === 'rep') add(val(r.answers[q.id]), '代表者名'); }); });
    // 長いものから置き換える（短い語が長い語の中を先に壊さないように）
    out.sort(function (a, b) { return b.from.length - a.from.length; });
    return out;
  }

        { target: '#mTos', title: '送り先', text: '届いた申し込みから宛先が並びます。押して選び、外すこともできます。' },
        { target: '#mMode', title: '送り方', text: 'まとめて1通か、1人ずつか。1人ずつにすると、店舗名などを本文に差し込めます。' },
        { target: '#mBodyEd', title: '本文', text: '色の付いたブロックは、送るときに1店ずつの中身に入れ替わります。下のボタンで入れ直せます。' },
        { target: '#mTest', title: '先に試す', text: '送る前に、自分あてに1通だけ送って確かめられます。' },
        { target: '#mSend', title: '送る', text: 'ここを押すと実際に届きます。送った記録は下に残ります。' }
      ];
    }
  };

  function maybeTour(step) { if (tourOn() && !TSEEN[step] && TOURS[step]) { TSEEN[step] = true; setTimeout(function () { startTour(step); }, 120); } }

  function tVis(el) { return !!(el && el.getClientRects().length && (el.offsetWidth || el.offsetHeight)); }

  /* 候補をならべて、いま画面にあるものを返す。どれも無ければ null */
  function tFind(target) {
    var list = (typeof target === 'string') ? [target] : (target || []);
    for (var i = 0; i < list.length; i++) {
      var el = null; try { el = document.querySelector(list[i]); } catch (e) {}
      if (tVis(el)) return el;
    }
    return null;
  }

  function startTour(step, force) {
    var all = TOURS[step] ? TOURS[step]() : null;
    if (!all || !all.length) return;
    /* 画面に無い段は出さない（携帯では上のタブが隠れている） */
    var items = [];
    for (var i = 0; i < all.length; i++) {
      var el = tFind(all[i].target);
      if (el) { all[i].el = el; items.push(all[i]); }
    }
    if (!items.length) return;
    var old = document.querySelector('.tour'); if (old && old.parentNode) old.parentNode.removeChild(old);
    var k = 0, raf = 0, alive = true;
    var hole = document.createElement('div'); hole.className = 'hole';
    var box = document.createElement('div'); box.className = 'tbox';
    var layer = document.createElement('div'); layer.className = 'tour';
    layer.appendChild(hole); layer.appendChild(box);
    function close() {
      alive = false;
      if (raf) { try { cancelAnimationFrame(raf); } catch (e) {} raf = 0; }
      if (layer.parentNode) layer.parentNode.removeChild(layer);
      window.removeEventListener('resize', track); window.removeEventListener('scroll', track, true);
      window.removeEventListener('keydown', esc);
      var vv = window.visualViewport;
      if (vv) { vv.removeEventListener('resize', track); vv.removeEventListener('scroll', track); }
    }
    function esc(e) { if (e.key === 'Escape') close(); }
    function btn(label, cls, fn) { var b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; return b; }

    /* 枠と箱を置くだけ。測るのはここ1か所 */
    function position(fx) {
      var it = items[k], t = it.el;
      if (!t || !document.body.contains(t) || !tVis(t)) { t = it.el = tFind(it.target); }
      var W = window.innerWidth, H = window.innerHeight;
      var r = tVis(t) ? t.getBoundingClientRect()
        : { left: W / 2 - 160, top: H / 2 - 60, width: 320, height: 120 };
      var pad = 6, hl = r.left - pad, ht = r.top - pad, hw = r.width + pad * 2, hh = r.height + pad * 2;
      /* 画面より高い相手は、上のほうだけ囲う */
      if (ht < 8) { hh = hh + ht - 8; ht = 8; }
      hh = Math.max(28, Math.min(hh, H - ht - 8));
      hw = Math.max(28, Math.min(hw, W - Math.max(hl, 0) - 8));
      hole.style.transition = fx ? '' : 'none';
      hole.style.left = hl + 'px'; hole.style.top = ht + 'px';
      hole.style.width = hw + 'px'; hole.style.height = hh + 'px';
      var bw = Math.min(340, W - 16), bh = box.offsetHeight || 180, left, top;
      if (hl + hw + bw + 24 < W) { left = hl + hw + 16; top = ht; }
      else if (hl - bw - 24 > 0) { left = hl - bw - 16; top = ht; }
      else if (ht + hh + bh + 24 < H) { left = hl; top = ht + hh + 16; }
      else if (ht - bh - 16 > 8) { left = hl; top = ht - bh - 16; }
      else { left = hl; top = H - bh - 8; }
      left = Math.max(8, Math.min(W - bw - 8, left)); top = Math.max(8, Math.min(H - bh - 8, top));
      box.style.left = left + 'px'; box.style.top = top + 'px'; box.style.width = bw + 'px';
    }
    function track() { if (alive) position(false); }
    /* スクロールが終わるまで測り直す（動いている間に測ると、その場所は古い） */
    function settle() {
      if (raf) { try { cancelAnimationFrame(raf); } catch (e) {} }
      var n = 0;
      (function again() {
        if (!alive) return;
        position(false);
        if (++n < 20) raf = requestAnimationFrame(again); else raf = 0;
      })();
    }

    /* 段が変わったとき: 中身を作り直して、相手まで寄せる */
    function render() {
      var it = items[k], t = it.el;
      if (!t || !document.body.contains(t) || !tVis(t)) { t = it.el = tFind(it.target); }
      box.innerHTML = '';
      var no = document.createElement('div'); no.className = 'n'; no.textContent = (k + 1) + ' / ' + items.length;
      var ti = document.createElement('div'); ti.className = 't'; ti.textContent = it.title;
      var de = document.createElement('div'); de.className = 'd'; de.textContent = it.text;
      var ok = document.createElement('div'); ok.className = 'ok';
      ok.appendChild(btn('閉じる', '', close));
      if (k > 0) ok.appendChild(btn('前へ', '', function () { k--; render(); }));
      ok.appendChild(btn(k + 1 < items.length ? '次へ' : '終わる', 'primary', function () { if (k + 1 < items.length) { k++; render(); } else close(); }));
      var lab = document.createElement('label'); lab.className = 'noshow';
      var chk = document.createElement('input'); chk.type = 'checkbox'; chk.checked = !tourOn();
      chk.onchange = function (e) { tourSet(!e.target.checked); };
      lab.appendChild(chk); lab.appendChild(document.createTextNode('今後この案内を出さない'));
      box.appendChild(no); box.appendChild(ti); box.appendChild(de); box.appendChild(ok); box.appendChild(lab);
      if (tVis(t)) {
        var b = t.getBoundingClientRect();
        if (b.top < 70 || b.bottom > window.innerHeight - 20) {
          var blk = (b.height > window.innerHeight - 140) ? 'start' : 'center';
          try { t.scrollIntoView({ block: blk, inline: 'nearest' }); } catch (e) { t.scrollIntoView(); }
        }
      }
      position(true);
      settle();
    }

    layer.addEventListener('click', function (e) { if (e.target === layer || e.target === hole) { if (k + 1 < items.length) { k++; render(); } else close(); } });
    window.addEventListener('keydown', esc);
    document.body.appendChild(layer);
    render();
    window.addEventListener('resize', track);
    window.addEventListener('scroll', track, true);
    var vv0 = window.visualViewport;
    if (vv0) { vv0.addEventListener('resize', track); vv0.addEventListener('scroll', track); }
    if (!force) TSEEN[step] = true;
  }

  $('tutBtn').onclick = function () { startTour(view, true); };

  /* ---------- 開いた直後 ---------- */
  /* 合言葉を覚えていなくても、一度通った端末ならサーバーが通す。だまって1回試す。
     関門は最初から隠してある（通るときに一瞬出ないように）。通らなければ lockOut が出す */
  tryPass(loadPass(), true);

  /* 利用記録。誰が開いたかはサーバーが差し込む（__LOGWHO__）。
     中地さん本人のときは __LOGSKIP__ が '1' になり、何も送らない。失敗してもアプリは止めない */
  try { if (!'1') new Image().src = 'https://script.google.com/macros/s/AKfycbx60H_bXkfaEXrwhLvp4MOIH6wmtw414pembss8iu5VVb5_UAE3AmOnyIRk5Y4ak02Ouw/exec?app=AP001&k=admin&who=__LOGWHO__'; } catch (e) {}
</script>

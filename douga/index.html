<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101319">
<title>動画編集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101319'/%3E%3Crect x='6' y='13' width='3' height='6' rx='1.5' fill='%234e9bff'/%3E%3Crect x='11' y='9' width='3' height='14' rx='1.5' fill='%234e9bff'/%3E%3Crect x='16' y='6' width='3' height='20' rx='1.5' fill='%23ffa94d'/%3E%3Crect x='21' y='11' width='3' height='10' rx='1.5' fill='%23ffa94d'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<style>
:root{
  --bg:#101319; --surface:#181c25; --surface2:#212633; --line:#2c3243;
  --tx:#eceff5; --tx2:#98a1b5; --tx3:#6c7488;
  --a1:#4e9bff; --a2:#ffa94d; --ok:#4fd1a1; --ng:#ff6b6b;
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
  --barH:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--tx);
  font:15px/1.5 -apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;font-size:14px;color:var(--tx);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.35;cursor:default}
button.p{background:var(--a1);border-color:var(--a1);color:#08121f;font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
input[type=text]{font:inherit;width:100%;background:#0b0e14;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
input[type=range]{accent-color:var(--a1)}

/* ── ヘッダ ── */
header{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safeT) + 10px) 14px 10px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
header .logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em}
header .logo svg{display:block}
header .sp{flex:1}
.iconbtn{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:10px;background:transparent;border-color:transparent;color:var(--tx2)}
.iconbtn:hover{background:var(--surface2)}

/* ── タブ（狭い画面のみ） ── */
#tabs{display:none;flex:none;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
#tabs .seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
#tabs .seg button{flex:1;border:none;background:transparent;color:var(--tx2);border-radius:8px;padding:9px 0;font-weight:600}
#tabs .seg button.on{background:var(--surface2);color:var(--tx)}
#tabs .seg .badge{display:inline-block;margin-left:6px;font-size:11px;color:var(--a1)}

/* ── 通知 ── */
#msg{flex:none;display:none;padding:11px 14px;font-size:13.5px;line-height:1.5}
#msg.show{display:block}
#msg.info{background:#16283c;color:#bcdcff}
#msg.err{background:#331c20;color:#ffb3b3}
#msg.ok{background:#15302a;color:#a8ecd0}

/* ── 本体 ── */
#main{flex:1;display:flex;min-height:0}
#edit{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#stt{width:392px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line)}

/* ── 取り込み ── */
#drop{
  flex:none;margin:14px;padding:22px 16px;border:1.5px dashed #39405a;border-radius:14px;
  text-align:center;color:var(--tx2);cursor:pointer;background:#141821;
}
#drop.over{border-color:var(--a1);background:#16233a;color:var(--tx)}
#drop .big{display:block;font-size:16px;font-weight:700;color:var(--tx);margin-bottom:4px}
#drop .sub{font-size:12.5px;color:var(--tx3)}
#drop.slim{padding:13px;margin:10px 14px}
#drop.slim .big{font-size:14px;margin:0}
#drop.slim .sub{display:none}

/* ── タイムライン ── */
#scroll{flex:1;overflow:auto;padding:0 14px 16px;min-height:0;-webkit-overflow-scrolling:touch}
#tl{position:relative;min-width:100%}
#ruler{display:block;height:26px;border-radius:6px;background:var(--surface2);touch-action:none}
#head{position:absolute;top:0;width:2px;background:var(--ng);pointer-events:none;border-radius:1px;box-shadow:0 0 8px rgba(255,107,107,.7)}

.track{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.track.sel{border-color:var(--a1)}
.thead{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--surface2);position:sticky;left:0}
.thead .dot{width:9px;height:9px;border-radius:3px;flex:none}
.thead .nm{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw}
.thead .meta{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.thead .sp{flex:1}
.tbtn{width:34px;height:34px;padding:0;display:grid;place-items:center;border-radius:9px;background:transparent;border-color:transparent;color:var(--tx2);font-size:12px;font-weight:700}
.tbtn:hover{background:#2b3246}
.tbtn.on{background:var(--a2);border-color:var(--a2);color:#241704}
canvas.wave{display:block;touch-action:none;cursor:grab}
canvas.wave.drag{cursor:grabbing}

.vol{display:none;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.vol.show{display:flex}
.vol input{flex:1}
.vol span{font-size:12px;color:var(--tx3);width:38px;text-align:right;font-variant-numeric:tabular-nums}

/* ── 下のバー ── */
#bar{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:10px 14px calc(var(--safeB) + 10px);
  background:var(--surface);border-top:1px solid var(--line);
}
#time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--tx3);min-width:106px}
#time b{display:block;font-size:19px;color:var(--tx);font-weight:700;letter-spacing:.01em}
#bar .sp{flex:1}
.round{width:54px;height:54px;border-radius:27px;padding:0;display:grid;place-items:center;background:var(--a1);border:none;color:#08121f;flex:none}
.round:active{transform:scale(.94)}
.round.sm{width:42px;height:42px;background:var(--surface2);color:var(--tx);border:1px solid var(--line)}
#zoomWrap{display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:12px}
#zoom{width:120px}

/* ── 文字起こし ── */
#stt h2{flex:none;margin:0;padding:13px 16px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--tx3);border-bottom:1px solid var(--line)}
#sttTop{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
#sttState{font-size:12px;color:var(--tx3)}
#cues{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.cue{display:flex;gap:11px;padding:11px 16px;cursor:pointer;border-left:3px solid transparent;align-items:flex-start}
.cue:active{background:var(--surface2)}
.cue.now{background:#1c2f4a;border-left-color:var(--a1)}
.cue .t{flex:none;font-size:11.5px;color:var(--a1);font-variant-numeric:tabular-nums;padding-top:3px;min-width:34px}
.cue .x{font-size:14.5px;line-height:1.6}
#sttFoot{flex:none;display:flex;gap:8px;padding:12px 16px calc(var(--safeB) + 12px);border-top:1px solid var(--line)}
#sttFoot button{flex:1;padding:11px 0}
.empty{padding:40px 24px;text-align:center;color:var(--tx3);font-size:13.5px;line-height:1.9}

/* ── シート・ダイアログ ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40;backdrop-filter:blur(2px)}
.scrim.show{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:10px 16px calc(var(--safeB) + 16px);
  transform:translateY(100%);transition:transform .22s ease;
}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:16px}
.sheet p{margin:0 0 14px;font-size:13px;color:var(--tx2);line-height:1.7}
.sheet .row{display:flex;flex-direction:column;gap:9px}
.sheet .row button{padding:15px;text-align:left;font-size:15px}
.sheet .row button small{display:block;font-size:12px;color:var(--tx3);font-weight:400;margin-top:2px}
.sheet .btns{display:flex;gap:9px;margin-top:14px}
.sheet .btns button{flex:1;padding:13px}
@media (min-width:901px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:440px;transform:translate(-50%,-46%) scale(.96);opacity:0;border-radius:16px;border:1px solid var(--line);transition:opacity .16s,transform .16s}
  .sheet.show{transform:translate(-50%,-50%);opacity:1}
}

/* ── 狭い画面 ── */
@media (max-width:900px){
  #tabs{display:block}
  #main{flex-direction:column}
  #edit,#stt{min-height:0}
  #stt{width:auto;border-left:none;border-top:none;background:var(--bg)}
  #edit.hide,#stt.hide{display:none}
  #scroll{padding:0 12px 12px}
  #drop{margin:12px}
  .thead .meta{display:none}
  .track.sel .thead .meta{display:block}
  #zoomWrap{display:none}
  #time{min-width:92px}
  #time b{font-size:17px}
  #bar{gap:9px;padding:9px 12px calc(var(--safeB) + 9px)}
  #sttFoot{padding:12px}
}
</style>
</head>
<body>

<header>
  <span class="logo">
    <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="4" y="13" width="3.2" height="6" rx="1.6" fill="#4e9bff"/>
      <rect x="10" y="8" width="3.2" height="16" rx="1.6" fill="#4e9bff"/>
      <rect x="16" y="5" width="3.2" height="22" rx="1.6" fill="#ffa94d"/>
      <rect x="22" y="11" width="3.2" height="10" rx="1.6" fill="#ffa94d"/>
    </svg>
    動画編集
  </span>
  <span class="sp"></span>
  <button class="iconbtn" id="btnKey" title="APIキー" aria-label="APIキー">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div id="tabs">
  <div class="seg">
    <button id="tabEdit" class="on">編集</button>
    <button id="tabStt">文字起こし<span class="badge" id="cueBadge"></span></button>
  </div>
</div>

<div id="msg"></div>

<div id="main">
  <div id="edit">
    <div id="drop">
      <span class="big">動画・音声を選ぶ</span>
      <span class="sub">動画は音声だけ取り出します。2本まで重ねられます。</span>
    </div>
    <input type="file" id="file" accept="video/*,audio/*" multiple hidden>

    <div id="scroll">
      <div id="tl">
        <canvas id="ruler"></canvas>
        <div id="tracks"></div>
        <div id="head" hidden></div>
      </div>
    </div>

    <div id="bar">
      <button class="round sm" id="btnTop" disabled aria-label="先頭へ">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.5v14H6zm3.5 7L19 5v14z"/></svg>
      </button>
      <button class="round" id="btnPlay" disabled aria-label="再生">
        <svg id="icPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icStop" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <div id="time"><b>0:00.0</b>ぜんぶで 0:00.0</div>
      <span class="sp"></span>
      <div id="zoomWrap"><span>拡大</span><input type="range" id="zoom" min="8" max="400" value="46"></div>
      <button class="round sm" id="btnSave" disabled aria-label="書き出す">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
  </div>

  <div id="stt" class="hide">
    <h2>文字起こし</h2>
    <div id="sttTop">
      <button id="btnStt" class="p" disabled>文字起こしする</button>
      <span id="sttState"></span>
    </div>
    <div id="cues"><div class="empty">まだありません。<br>音声を入れて、ボタンを押してください。</div></div>
    <div id="sttFoot">
      <button id="btnTxt" disabled>テキスト</button>
      <button id="btnSrt" disabled>SRT</button>
      <button id="btnCopy" disabled>コピー</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="saveSheet">
  <div class="grab"></div>
  <h3>書き出す</h3>
  <p>いま並べてある通りに1本にまとめます。</p>
  <div class="row">
    <button data-out="mp3">MP3<small>軽い。ふつうはこちら</small></button>
    <button data-out="wav">WAV<small>音がそのまま。重い</small></button>
    <button data-out="txt" disabled>文字起こし（テキスト）<small></small></button>
    <button data-out="srt" disabled>字幕（SRT）<small></small></button>
  </div>
  <div class="btns"><button id="saveCancel">やめる</button></div>
</div>

<div class="sheet" id="keySheet">
  <div class="grab"></div>
  <h3>GeminiのAPIキー</h3>
  <p>文字起こしに使います。このブラウザの中だけに残ります。<br>
     取り直すときは aistudio.google.com/apikey です。</p>
  <input type="text" id="keyInput" placeholder="AQ... または AIza..." autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="btns">
    <button id="keyCancel">やめる</button>
    <button id="keySave" class="p">保存</button>
  </div>
</div>

<script>
"use strict";

/* ══ 設定 ══ */
const MODEL = "gemini-3.6-flash";
const CHUNK_SEC = 600;
const STT_RATE = 16000;
const COLORS = ["#4e9bff", "#ffa94d"];
const isTouch = matchMedia("(pointer:coarse)").matches;
const TRACK_H = isTouch ? 104 : 92;
const GRAB = isTouch ? 18 : 9;          // つまみの当たり幅

function getKey(){ try{ return localStorage.getItem("gemkey") || ""; }catch(e){ return ""; } }
function setKey(k){ try{ localStorage.setItem("gemkey", k); }catch(e){} }

/* ══ 状態 ══ */
const ac = new (window.AudioContext || window.webkitAudioContext)();
const S = { tracks: [], pps: 46, cursor: 0, playing: false, t0: 0, c0: 0, cues: [], busy: false, sel: null };
let nextId = 1;

const $ = s => document.querySelector(s);
const elTracks=$("#tracks"), elRuler=$("#ruler"), elHead=$("#head"), elTime=$("#time"),
      elScroll=$("#scroll"), elMsg=$("#msg"), elCues=$("#cues"), elState=$("#sttState"), elDrop=$("#drop");

/* ══ 小道具 ══ */
let msgTimer = null;
function msg(text, kind, hold){
  clearTimeout(msgTimer);
  elMsg.className = "show " + (kind || "info");
  elMsg.textContent = text;
  if(!hold && kind !== "info") msgTimer = setTimeout(clearMsg, 4200);
}
function clearMsg(){ elMsg.className = ""; }

function fmt(sec, ms){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = sec - m * 60;
  return ms === false
    ? m + ":" + String(Math.floor(s)).padStart(2, "0")
    : m + ":" + String(Math.floor(s)).padStart(2, "0") + "." + String(Math.floor((s % 1) * 10));
}
function srtTime(sec){
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = Math.floor(sec%60), x = Math.round((sec%1)*1000);
  return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":") + "," + String(x).padStart(3,"0");
}
const tlen = t => t.trimEnd - t.trimStart;
function totalDur(){ let d = 0; S.tracks.forEach(t => d = Math.max(d, t.offset + tlen(t))); return d; }
const anySolo = () => S.tracks.some(t => t.solo);
const audible = t => t.mute ? 0 : (anySolo() && !t.solo ? 0 : t.gain);

/* ══ タブ ══ */
function showTab(which){
  $("#tabEdit").classList.toggle("on", which === "edit");
  $("#tabStt").classList.toggle("on", which === "stt");
  $("#edit").classList.toggle("hide", which !== "edit");
  $("#stt").classList.toggle("hide", which !== "stt");
  if(which === "edit") requestAnimationFrame(redrawAll);
}
$("#tabEdit").addEventListener("click", () => showTab("edit"));
$("#tabStt").addEventListener("click", () => showTab("stt"));
addEventListener("resize", () => {
  if(innerWidth > 900){ $("#edit").classList.remove("hide"); $("#stt").classList.remove("hide"); }
  else if(!$("#tabStt").classList.contains("on")) showTab("edit");
  redrawAll();
});

/* ══ シート ══ */
function openSheet(id){ $("#scrim").classList.add("show"); $(id).classList.add("show"); }
function closeSheets(){ $("#scrim").classList.remove("show"); document.querySelectorAll(".sheet").forEach(s => s.classList.remove("show")); }
$("#scrim").addEventListener("click", closeSheets);

/* ══ 取り込み ══ */
elDrop.addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
["dragenter","dragover"].forEach(ev => addEventListener(ev, e => { e.preventDefault(); elDrop.classList.add("over"); }));
addEventListener("dragleave", e => { if(e.target === elDrop) elDrop.classList.remove("over"); });
addEventListener("drop", e => {
  e.preventDefault(); elDrop.classList.remove("over");
  if(e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]);
});

async function addFiles(files){
  for(const f of files){
    if(S.tracks.length >= 2){ msg("トラックは2本までです。要らないほうを消してから入れてください。", "err"); break; }
    try{
      msg("「" + f.name + "」から音声を取り出しています…", "info", true);
      const buf = await decode(f);
      addTrack(f.name, buf);
      clearMsg();
    }catch(err){
      console.error(err);
      msg("「" + f.name + "」の音声を取り出せませんでした。" + (err && err.message ? "（" + err.message + "）" : ""), "err");
    }
  }
  redrawAll(); updateUI();
}

async function decode(file){
  const ab = await file.arrayBuffer();
  try{
    return await new Promise((res, rej) => {
      const p = ac.decodeAudioData(ab.slice(0), res, rej);   // 古いSafariは約束を返さない
      if(p && p.then) p.then(res, rej);
    });
  }catch(e){
    return await captureRealtime(file);
  }
}

// ブラウザが直に解せない形式は、実時間で再生して拾う（最後の手段）
function captureRealtime(file){
  return new Promise((resolve, reject) => {
    const isV = (file.type || "").startsWith("video") || /\.(mp4|mov|mkv|avi|webm|m4v|wmv|flv|ts)$/i.test(file.name);
    const el = document.createElement(isV ? "video" : "audio");
    el.src = URL.createObjectURL(file);
    el.playsInline = true;
    el.addEventListener("error", () => reject(new Error("この形式は読めません")));
    el.addEventListener("loadedmetadata", async () => {
      try{
        await ac.resume();
        const src = ac.createMediaElementSource(el);
        const sp = ac.createScriptProcessor(4096, 2, 2);
        const L = [], R = [];
        sp.onaudioprocess = ev => {
          L.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
          R.push(new Float32Array(ev.inputBuffer.getChannelData(1)));
          const p = el.duration ? Math.floor(el.currentTime / el.duration * 100) : 0;
          msg("「" + file.name + "」を実時間で読み取っています… " + p + "%", "info", true);
        };
        const mute = ac.createGain(); mute.gain.value = 0;
        src.connect(sp); sp.connect(mute); mute.connect(ac.destination);
        el.addEventListener("ended", () => {
          sp.disconnect(); src.disconnect(); mute.disconnect();
          const n = L.reduce((a, b) => a + b.length, 0);
          if(!n) return reject(new Error("音声が入っていません"));
          const buf = ac.createBuffer(2, n, ac.sampleRate);
          let o = 0;
          for(let i = 0; i < L.length; i++){ buf.copyToChannel(L[i], 0, o); buf.copyToChannel(R[i], 1, o); o += L[i].length; }
          URL.revokeObjectURL(el.src);
          resolve(buf);
        });
        el.play();
      }catch(err){ reject(err); }
    });
  });
}

function addTrack(name, buffer){

/* ══ 波形 ══ */
function peaks(t, w){
  const ch = t.buffer.numberOfChannels, len = t.buffer.length, data = [];
  for(let c = 0; c < ch; c++) data.push(t.buffer.getChannelData(c));
  const p = new Float32Array(w * 2), step = len / w;
  for(let i = 0; i < w; i++){
    const a = Math.floor(i * step), b = Math.min(len, Math.floor((i + 1) * step));
    let mn = 0, mx = 0;
    for(let j = a; j < b; j++) for(let c = 0; c < ch; c++){
      const v = data[c][j]; if(v < mn) mn = v; if(v > mx) mx = v;
    }
    p[i*2] = mn; p[i*2+1] = mx;
  }
  t.peaks = p; t.peaksW = w;
}

function fullWidth(){
  return Math.max(Math.ceil(Math.max(totalDur(), 8) * S.pps) + 40, elScroll.clientWidth - 28);
}

function drawTrack(t, W){
  const cv = t.canvas, dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = TRACK_H * dpr;
  cv.style.width = W + "px"; cv.style.height = TRACK_H + "px";
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, TRACK_H);

  const bw = Math.max(2, Math.ceil(t.buffer.duration * S.pps));
  if(t.peaksW !== bw) peaks(t, bw);

  const ox = (t.offset - t.trimStart) * S.pps;
  const x0 = t.offset * S.pps, x1 = (t.offset + tlen(t)) * S.pps;
  const mid = TRACK_H / 2, amp = TRACK_H / 2 - 10;

  g.globalAlpha = .2;
  wave(g, t, ox, bw, mid, amp, "#7a8399");
  g.globalAlpha = 1;

  g.save();
  g.beginPath();
  roundRect(g, x0, 4, Math.max(2, x1 - x0), TRACK_H - 8, 8);
  g.clip();
  g.fillStyle = "#151c2b"; g.fillRect(x0, 0, x1 - x0, TRACK_H);
  wave(g, t, ox, bw, mid, amp, t.color);
  g.restore();

  g.strokeStyle = "#333b52"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, mid + .5); g.lineTo(W, mid + .5); g.stroke();

  // つまみ
  const hw = isTouch ? 9 : 6;
  g.fillStyle = t.color;
  roundRect(g, x0, 4, hw, TRACK_H - 8, 4); g.fill();
  roundRect(g, x1 - hw, 4, hw, TRACK_H - 8, 4); g.fill();
  g.fillStyle = "rgba(0,0,0,.5)";
  for(let i = 0; i < 3; i++){
    g.fillRect(x0 + hw/2 - 1, mid - 10 + i*8, 2, 5);
    g.fillRect(x1 - hw/2 - 1, mid - 10 + i*8, 2, 5);
  }

  t.dom.querySelector(".meta").textContent = fmt(tlen(t)) + "／位置 " + fmt(t.offset);
}

function roundRect(g, x, y, w, h, r){
  g.beginPath();
  if(g.roundRect) g.roundRect(x, y, w, h, r);
  else{
    r = Math.min(r, w/2, h/2);
    g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
  }
}

function wave(g, t, ox, n, mid, amp, color){
  g.strokeStyle = color; g.lineWidth = 1;
  g.beginPath();
  const p = t.peaks, W = g.canvas.width;
  for(let i = 0; i < n; i++){
    const x = Math.round(ox + i) + .5;
    if(x < -2 || x > W) continue;
    g.moveTo(x, mid - p[i*2+1] * amp);
    g.lineTo(x, mid - p[i*2] * amp);
  }
  g.stroke();
}

function drawRuler(W){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  elRuler.width = W * dpr; elRuler.height = 26 * dpr;
  elRuler.style.width = W + "px";
  const g = elRuler.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, 26);
  const steps = [0.1,0.25,0.5,1,2,5,10,15,30,60,120,300,600];
  const step = steps.find(s => s * S.pps >= (isTouch ? 76 : 62)) || 600;
  g.font = "11px system-ui"; g.textBaseline = "middle";
  for(let s = 0; s * S.pps <= W; s += step){
    const x = Math.round(s * S.pps) + .5;
    g.strokeStyle = "#4a5368";
    g.beginPath(); g.moveTo(x, 16); g.lineTo(x, 26); g.stroke();
    g.fillStyle = "#98a1b5";
    g.fillText(fmt(s, step < 1), x + 5, 9);
  }
}

/* ══ 指・マウスでつまむ ══ */
function bindDrag(t){
  const cv = t.canvas;
  let mode = null, sx = 0, base = 0, base2 = 0, pid = null, moved = false;
  let pinch = null;

  cv.addEventListener("pointerdown", e => {
    if(e.pointerType === "touch" && cv._touches > 1) return;
    S.sel = t.id; updateUI();
    const x = e.offsetX;
    const x0 = t.offset * S.pps, x1 = (t.offset + tlen(t)) * S.pps;
    const dL = Math.abs(x - x0), dR = Math.abs(x - x1);
    mode = (dL <= GRAB && dL <= dR) ? "L" : (dR <= GRAB) ? "R" : "M";
    sx = e.clientX; base = t.offset; base2 = mode === "R" ? t.trimEnd : t.trimStart;
    moved = false; pid = e.pointerId;
    cv.setPointerCapture(pid); cv.classList.add("drag");
  });

  cv.addEventListener("pointermove", e => {
    if(mode === null || e.pointerId !== pid) return;
    const d = (e.clientX - sx) / S.pps;
    if(Math.abs(e.clientX - sx) > 3) moved = true;
    if(mode === "M") t.offset = Math.max(0, base + d);
    else if(mode === "L"){
      const ns = Math.min(Math.max(0, base2 + d), t.trimEnd - 0.05);
      t.offset = Math.max(0, base + (ns - base2));
      t.trimStart = ns;
    }else{
      t.trimEnd = Math.max(t.trimStart + 0.05, Math.min(t.buffer.duration, base2 + d));
    }
    redrawAll();
  });

  const end = e => {
    if(mode === null) return;
    if(!moved && e.offsetX !== undefined) seek(e.offsetX / S.pps);   // 動かさなければ位置決め
    mode = null; cv.classList.remove("drag");
    try{ cv.releasePointerCapture(pid); }catch(_){}
  };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", () => { mode = null; cv.classList.remove("drag"); });

  // 2本指で拡大
  cv.addEventListener("touchstart", e => {
    cv._touches = e.touches.length;
    if(e.touches.length === 2){
      mode = null; cv.classList.remove("drag");
      pinch = { d: dist(e.touches), pps: S.pps };
    }
  }, {passive:true});
  cv.addEventListener("touchmove", e => {
    if(pinch && e.touches.length === 2){
      e.preventDefault();
      const r = dist(e.touches) / pinch.d;
      S.pps = Math.max(6, Math.min(600, pinch.pps * r));
      $("#zoom").value = Math.round(Math.max(8, Math.min(400, S.pps)));
      redrawAll();
    }
  }, {passive:false});
  cv.addEventListener("touchend", e => { cv._touches = e.touches.length; if(e.touches.length < 2) pinch = null; }, {passive:true});
}
function dist(ts){ return Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY); }

elRuler.addEventListener("pointerdown", e => seek(e.offsetX / S.pps));

function seek(sec){
  const was = S.playing;
  if(was) stop();
  S.cursor = Math.max(0, Math.min(sec, totalDur()));
  moveHead(); showTime(); markCue();
  if(was) play();
}

/* ══ 再生 ══ */
function play(){
  if(!S.tracks.length) return;
  ac.resume();
  if(S.cursor >= totalDur() - 0.01) S.cursor = 0;
  const now = ac.currentTime + 0.06;
  S.tracks.forEach(t => {
    const s = t.offset, e = t.offset + tlen(t);
    if(S.cursor >= e) return;
    const src = ac.createBufferSource(); src.buffer = t.buffer;
    const g = ac.createGain(); g.gain.value = audible(t);
    src.connect(g); g.connect(ac.destination);
    if(S.cursor <= s) src.start(now + (s - S.cursor), t.trimStart, tlen(t));
    else src.start(now, t.trimStart + (S.cursor - s), e - S.cursor);
    t._src = src; t._g = g;
  });
  S.t0 = now; S.c0 = S.cursor; S.playing = true;
  $("#icPlay").hidden = true; $("#icStop").hidden = false;
  requestAnimationFrame(tick);
}
function stop(){
  S.tracks.forEach(t => { if(t._src){ try{ t._src.stop(); }catch(e){} t._src = null; t._g = null; } });
  S.playing = false;
  $("#icPlay").hidden = false; $("#icStop").hidden = true;
}
function tick(){
  if(!S.playing) return;
  S.cursor = S.c0 + Math.max(0, ac.currentTime - S.t0);
  const total = totalDur();
  if(S.cursor >= total){ S.cursor = total; stop(); }
  moveHead(); showTime(); markCue();
  const x = S.cursor * S.pps;
  if(x > elScroll.scrollLeft + elScroll.clientWidth - 70 || x < elScroll.scrollLeft)
    elScroll.scrollLeft = x - 70;
  if(S.playing) requestAnimationFrame(tick);
}
$("#btnPlay").addEventListener("click", () => S.playing ? stop() : play());
$("#btnTop").addEventListener("click", () => seek(0));
addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.code === "Space"){ e.preventDefault(); S.playing ? stop() : play(); }
  if(e.code === "Home") seek(0);
});

/* ══ 書き出し ══ */
async function renderMix(rate, channels){
  const total = totalDur();
  if(total <= 0) throw new Error("中身がありません");
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  let oc;
  try{ oc = new OC(channels, Math.ceil(total * rate), rate); }
  catch(e){ oc = new OC(channels, Math.ceil(total * 44100), 44100); }   // 古いSafariよけ
  S.tracks.forEach(t => {
    const v = audible(t);
    if(v <= 0) return;
    const src = oc.createBufferSource(); src.buffer = t.buffer;
    const g = oc.createGain(); g.gain.value = v;
    src.connect(g); g.connect(oc.destination);
    src.start(t.offset, t.trimStart, tlen(t));
  });
  const p = oc.startRendering();
  return p && p.then ? await p : await new Promise(r => { oc.oncomplete = e => r(e.renderedBuffer); });
}

function wavBlob(buf){
  const ch = buf.numberOfChannels, len = buf.length, rate = buf.sampleRate;
  const dv = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const wr = (o, s) => { for(let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  wr(0,"RIFF"); dv.setUint32(4, 36 + len*ch*2, true); wr(8,"WAVEfmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,ch,true);
  dv.setUint32(24,rate,true); dv.setUint32(28,rate*ch*2,true);
  dv.setUint16(32,ch*2,true); dv.setUint16(34,16,true);
  wr(36,"data"); dv.setUint32(40, len*ch*2, true);
  const d = []; for(let c = 0; c < ch; c++) d.push(buf.getChannelData(c));
  let o = 44;
  for(let i = 0; i < len; i++) for(let c = 0; c < ch; c++){
    const v = Math.max(-1, Math.min(1, d[c][i]));
    dv.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2;
  }
  return new Blob([dv.buffer], {type:"audio/wav"});
}
function toI16(f){
  const a = new Int16Array(f.length);
  for(let i = 0; i < f.length; i++){ const v = Math.max(-1, Math.min(1, f[i])); a[i] = v < 0 ? v*0x8000 : v*0x7fff; }
  return a;
}
function mp3Blob(buf, kbps){
  if(!window.lamejs) throw new Error("MP3の部品が読めていません");
  const ch = Math.min(2, buf.numberOfChannels);
  const enc = new lamejs.Mp3Encoder(ch, buf.sampleRate, kbps || 192);
  const L = toI16(buf.getChannelData(0));
  const R = ch > 1 ? toI16(buf.getChannelData(1)) : null;
  const out = [], N = 1152;
  for(let i = 0; i < L.length; i += N){
    const b = ch > 1 ? enc.encodeBuffer(L.subarray(i,i+N), R.subarray(i,i+N)) : enc.encodeBuffer(L.subarray(i,i+N));
    if(b.length) out.push(new Int8Array(b));
  }
  const last = enc.flush(); if(last.length) out.push(new Int8Array(last));
  return new Blob(out, {type:"audio/mpeg"});
}

function baseName(){ return S.tracks.length ? S.tracks[0].name.replace(/\.[^.]+$/, "") : "音声"; }

async function deliver(blob, name){
  const file = new File([blob], name, {type: blob.type});
  if(isTouch && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return "共有しました。"; }
    catch(e){ if(e && e.name === "AbortError") return null; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return "保存しました。";
}

function sliceMono(buf, from, to){
  const rate = buf.sampleRate;
  const a = Math.floor(from*rate), b = Math.min(buf.length, Math.floor(to*rate));
  const out = ac.createBuffer(1, Math.max(1, b-a), rate);
  out.copyToChannel(buf.getChannelData(0).subarray(a, b), 0);
  return out;
}
function toBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

  "音声に言葉が入っていなければ空の配列を返してください。";

const SCHEMA = {
  type: "ARRAY",
  items: { type:"OBJECT",
    properties:{ start:{type:"NUMBER"}, end:{type:"NUMBER"}, text:{type:"STRING"} },
    required:["start","end","text"] }
};

async function askGemini(blob, mime, label){
  const b64 = await toBase64(blob);
  const body = JSON.stringify({
    contents: [{ parts: [{ text: PROMPT }, { inlineData: { mimeType: mime, data: b64 } }] }],
    generationConfig: { responseMimeType:"application/json", responseSchema:SCHEMA, temperature:0 }
  });
  let last = null;
  for(let i = 0; i < 5; i++){
    if(i){
      const w = 3 * Math.pow(2, i-1);
      msg("Geminiが混み合っています。" + w + "秒待って送り直します（" + i + "回目）" + (label||""), "info", true);
      await new Promise(r => setTimeout(r, w*1000));
    }
    let res;
    try{
      res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent",
        { method:"POST", headers:{ "x-goog-api-key":getKey(), "Content-Type":"application/json" }, body });
    }catch(e){ last = new Error("通信できませんでした。ネットにつながっているか確かめてください。"); continue; }
    if(res.ok){
      const j = await res.json();
      const c = j.candidates && j.candidates[0];
      const txt = c && c.content && c.content.parts ? c.content.parts.map(p => p.text || "").join("") : "";
      if(!txt){ last = new Error("空の返事が来ました" + (c && c.finishReason ? "（"+c.finishReason+"）" : "")); continue; }
      return JSON.parse(txt);
    }
    let d = ""; try{ d = (await res.json()).error.message; }catch(e){ d = res.statusText; }
    last = new Error("Gemini " + res.status + "：" + d);
    if([429,500,502,503,504].indexOf(res.status) < 0) throw last;
  }
  throw last;
}

$("#btnStt").addEventListener("click", () => {
  if(!getKey()){
    $("#keyInput").value = "";
    openSheet("#keySheet");
    setTimeout(() => $("#keyInput").focus(), 260);
    return;
  }
  runStt();
});

function runStt(){
  return withBusy("音声を整えています…", async () => {
    S.cues = []; renderCues(); updateUI();
    const mono = await renderMix(STT_RATE, 1);
    const total = mono.duration;
    const n = Math.max(1, Math.ceil(total / CHUNK_SEC));
    const useMp3 = !!window.lamejs;
    const all = [];
    for(let i = 0; i < n; i++){
      const from = i * CHUNK_SEC, to = Math.min(total, (i+1) * CHUNK_SEC);
      elState.textContent = n > 1 ? (i+1) + " / " + n : "送っています…";
      msg("文字起こし中です" + (n > 1 ? "（" + (i+1) + "/" + n + "）" : "") + "。少しかかります。", "info", true);
      const part = sliceMono(mono, from, to);
      const blob = useMp3 ? mp3Blob(part, 64) : wavBlob(part);
      const cues = await askGemini(blob, useMp3 ? "audio/mpeg" : "audio/wav", n > 1 ? "／" + (i+1) + "本目" : "");
      cues.forEach(c => all.push({ start:(+c.start||0)+from, end:(+c.end||0)+from, text:String(c.text||"").trim() }));
      S.cues = all.slice().sort((a,b) => a.start - b.start);
      renderCues(); updateUI();
    }
    elState.textContent = S.cues.length + " 行";
    msg(S.cues.length ? "文字起こしが終わりました。" : "言葉は入っていませんでした。", "ok");
    if(S.cues.length && innerWidth <= 900) showTab("stt");
  });
}

function renderCues(){
  if(!S.cues.length){
    elCues.innerHTML = '<div class="empty">まだありません。<br>音声を入れて、ボタンを押してください。</div>';
    return;
  }
  elCues.innerHTML = "";
  S.cues.forEach(c => {
    const d = document.createElement("div");
    d.className = "cue";
    d.innerHTML = '<span class="t"></span><span class="x"></span>';
    d.querySelector(".t").textContent = fmt(c.start, false);
    d.querySelector(".x").textContent = c.text;
    d.addEventListener("click", () => { seek(c.start); if(!S.playing) play(); });
    elCues.appendChild(d);
  });
}
let lastCue = -1;
function markCue(){
  if(!S.cues.length) return;
  let idx = -1;
  for(let i = 0; i < S.cues.length; i++){ if(S.cursor >= S.cues[i].start - 0.2) idx = i; else break; }
  if(idx === lastCue) return;
  lastCue = idx;
  [...elCues.children].forEach((el, i) => el.classList && el.classList.toggle("now", i === idx));
  const el = elCues.children[idx];
  if(el && el.scrollIntoView) el.scrollIntoView({block:"nearest"});
}

function asText(){ return S.cues.map(c => fmt(c.start, false) + "  " + c.text).join("\r\n"); }
function asSrt(){
  return S.cues.map((c, i) =>
    (i+1) + "\r\n" + srtTime(c.start) + " --> " + srtTime(c.end > c.start ? c.end : c.start + 2) + "\r\n" + c.text + "\r\n"
  ).join("\r\n");
}
$("#btnTxt").addEventListener("click", async () => {
  const m = await deliver(new Blob(["﻿"+asText()], {type:"text/plain"}), baseName()+".txt"); if(m) msg(m,"ok");
});
$("#btnSrt").addEventListener("click", async () => {
  const m = await deliver(new Blob(["﻿"+asSrt()], {type:"text/plain"}), baseName()+".srt"); if(m) msg(m,"ok");
});
$("#btnCopy").addEventListener("click", async () => {
  try{ await navigator.clipboard.writeText(asText()); msg("コピーしました。", "ok"); }
  catch(e){ msg("コピーできませんでした。テキストで保存してください。", "err"); }
});

/* ══ APIキー ══ */
$("#btnKey").addEventListener("click", () => { $("#keyInput").value = getKey(); openSheet("#keySheet"); });
$("#keyCancel").addEventListener("click", closeSheets);
$("#keySave").addEventListener("click", () => {
  const k = $("#keyInput").value.trim();
  setKey(k); closeSheets();
  if(k && S.tracks.length && !S.busy) runStt();
  else if(k) msg("APIキーを保存しました。", "ok");
});
$("#keyInput").addEventListener("keydown", e => { if(e.key === "Enter") $("#keySave").click(); });

/* ══ 起動 ══ */
if(innerWidth > 900){ $("#edit").classList.remove("hide"); $("#stt").classList.remove("hide"); }
updateUI();
redrawAll();
</script>

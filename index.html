<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6feb'/%3E%3Ctext x='16' y='22' font-size='14' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:40px 20px 80px;background:#f2f3f5;color:#1f2328;
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.01em}
.lead{color:#5a6169;font-size:13px;margin:0 0 28px}
.card{
  display:block;text-decoration:none;color:inherit;background:#fff;
  border:1px solid #dcdfe4;border-radius:12px;padding:16px 18px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(16,22,26,.08);transition:border-color .15s,transform .1s;
}
.card:hover{border-color:#2f6feb}
.card:active{transform:scale(.995)}
.card h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card h2 .ico{
  width:26px;height:26px;flex:0 0 auto;border-radius:7px;background:#e6efff;color:#2f6feb;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
}
.card h2 .ico-tb{background:#f6e7df;color:#b05b3b}
.tag + .tag{margin-left:6px}
.card p{margin:0;color:#5a6169;font-size:13px}
.tag{
  display:inline-block;margin-top:9px;font-size:11px;color:#5a6169;
  background:#f2f3f5;border-radius:20px;padding:2px 10px;
}
footer{margin-top:32px;color:#8b939c;font-size:12px;text-align:center}
footer a{color:#8b939c}
</style>
</head>
<body>
<div class="wrap">
  <h1>tools</h1>
  <p class="lead">ブラウザだけで動く小さな道具。ファイルは端末の中だけで処理され、どこにも送信されません（タスクボードのみ、自分で設定したGoogleドライブとやりとりします）。</p>

  <a class="card" href="./pdf.html">
    <h2><span class="ico">P</span>PDF編集</h2>
    <p>PDFに文字・図形・印影を書き込む。ページの並べ替え・回転・結合・削除。元の文字の差し替えも。</p>
    <span class="tag">PDF</span>
  </a>

  <a class="card" href="./taskboard.html">
    <h2><span class="ico ico-tb">T</span>タスクボード</h2>
    <p>出先からタスクの確認と回答。ホーム画面に追加するとアプリのように使えます。</p>
    <span class="tag">タスク管理</span>
    <span class="tag">要初期設定</span>
  </a>

  <footer>
    <a href="https://github.com/akiranakachi-eng/tools">GitHub</a>
  </footer>
</div>
</body>
</html>

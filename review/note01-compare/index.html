<script>
const A="# 業務改善のためにClaudeでアプリを作る仕事の、道具の話\n\n（2026年9月時点、僕の使い方です。設定や時期で変わるところがあるので、そのつもりで読んでください）\n\n## はじめに\n\nneggy（ネギー）といいます。KTOKという会社で、業務改善の支援をしています。いま使っているExcelや管理ソフトはそのままに、作業負担を軽くする手段を考えたり、そのための道具を揃える支援をする仕事です。\n\nその道具を作るために、KTOKの中に「ねぎラボ」という開発室を持っていて、Claudeを使ってアプリを作っています。コードは手で書きません。業務を見て、要件を詰めて、Claudeに作ってもらって、実際に使える状態まで仕上げるのが僕の仕事です。コードの中身を追うより、Claudeに動きを言語化してもらったものを読んで判断する方に時間を使っています。\n\nこの夏に業務改善の中で作って納めたものだと、イベント運営会社の出店申込（4つのツールを行き来していたのを1画面に）、アルバイトの支払い計算、建設会社向けの図面PDFのマスク編集アプリ、謎解きイベント用のアプリ。要するに、既存のアプリケーションにはない、クライアントの環境や作業手順にマッチする業務アプリケーションを作っています。\n\n「こんなに作れます」という話がしたいわけではありません。業務改善の相談を受けていると、アプリは目的ではなく手段です。ただ、その手段としてClaudeが実際にどう働いていて、どこでつまずくのかは、まだあまり語られていない気がします。これから何本かに分けて、何を使って、どこでつまずいて、どう考えて作っているのかを書いていきます。Claudeでアプリを作ることに興味がある人が、実際に始めるときの地図になれば、という趣旨です。\n\n1本目は道具の話です。Claudeって結局、何をどこから動かしているのか。その全体像を、実務で使っている目線で整理します。\n\n## 入口は3つある\n\nチャットのClaudeは知っている人が多いと思います。僕も最初はそれしか知りませんでした。アプリを作るようになって分かったのは、Claudeには入口が3つあるということです。\n\n1. **チャット**（デスクトップアプリやブラウザ）。ふつうに会話する画面。つないだサービス（Gmail、カレンダー、Driveなど）を動かせます。メールを下書きしてもらう、予定を入れてもらう、スライドを作ってDriveに置いてもらう、といった使い方はここ。\n2. **Claude Code**（ターミナル）。黒い画面に文字を打つやつです。手元のパソコンのファイルを直接読み書きできます。アプリ作りの本体はここ。デスクトップアプリの中にも同じものが入っています。少し前までは新しい機能がターミナルに先に入っていましたが、今はほとんど差がありません。残っている違いは、ターミナルだとプログラムから自動で立ち上げられることくらいです。僕はその仕組みを組んでいるのでターミナルで使っていて、この記事でも「ターミナル」と呼びます。\n3. **ブラウザ**（Chrome拡張）。Claudeがブラウザを操作します。ページを開いて、入力して、次へ進む、を代わりにやってくれます。\n\n僕がアプリを作るのに「ターミナルは必須」と言っているのは、理由が3つあります。\n\n- 手元のファイルを触れるのがClaude Codeだから。アプリの中身はファイルなので、ここがないと始まらない。\n- 「この作業は別のClaudeに任せて」と自分で指名できるのがClaude Codeだから（後で出てくるサブエージェントの話です）。チャットの方も裏で分担することはあるみたいですが、こっちから指定はできません。\n- ブラウザを動かす指示を、アプリ作りと同じ会話の中で出せるから。最近やった例だと、あるサービスの申し込みページを「これ申し込んどいて」と言ったら、勝手にブラウザを開いてページまで行って、「ここと、ここだけ入力してください」と戻してきて、入れたと言ったらまた次の画面に進んでくれる、みたいな使い方もできるイメージです。\n\nチャットで使っているGmailやDriveも、設定すればターミナル側からつなげます。なので僕の感覚では、ターミナルがあれば、チャットでできることはだいたいできます。逆は無理です。なので、これからアプリを作りたいという人は、最初にターミナルを入れるのが近道だと思います。\n\nただ、初めて触る人には、正直とっつきにくいと思います。僕も最初は、セッション（1本の会話）の一覧にどう戻るのか、名前をどう変えるのか、分かりませんでした。もうひとつ、始めたころの失敗として、終わったセッションをどんどん消していました。あとから読み返して次の仕事に引き継げる記録なので、今は全部残しています。\n\n## 携帯から動かす\n\nターミナルは、パソコンの前に座っていないと使えないと思っていたんですが、そうでもありません。\n\n「リモートコントロール」という機能をつけてセッションを立ち上げると、同じセッションを携帯からも見て、指示が出せます。僕は今、ほとんどこの形です。指示は携帯から出して、動きの確認だけパソコンの前に来て、「ここの文字が違う」「ここの動きが違う」とやる。\n\nもうひとつ。セッションが長くなるとトークン（後で説明します）を食うので、こまめに新しいセッションに切り替えたいんですが、そのたびにパソコンの前に来て新しいセッションを立てるのが面倒でした。これは「サーバーモード」で解決します。パソコンで\n\n```\nclaude remote-control\n```\n\nを動かしっぱなしにしておくと、Claudeは会話を始めず、受付として待っています。携帯側で新しいセッションを始めると、パソコンの中でClaudeがもう1本立ち上がって、携帯につながります。パソコンには触りません。僕は最初これを知らなくて、次のセッションを立ち上げる小さなプログラムを自作していました。\n\n## Claudeは何を覚えているのか\n\nここがいちばんの勘所だと思っています。Claudeが「覚えているもの」は、ざっくり3種類あります。\n\n**1. 起動時に読む指示書。** セッションを開くと、まず読みに行くファイルがあります（Claude Codeだと CLAUDE.md という名前です）。ここにルールを書いておきます。僕が最初に書いたのは「絶対」「完全に」「必ず」を使わないで、でした。AIってこの手の言葉がすごい好きなので。\n\n**2. Claudeが自分で書くメモ。** Claudeは、こちらに寄せてきます。会話の中で拾ったことをメモに書いて、次からそれに合わせてくる。これが便利でもあり、厄介でもある。ある時期から、返事の最後に必ず「案は3つです。1、2、3」と言ってくるようになったことがありました。しばらく本当に案が3つあるんだと思っていたんですが、どうも意味のない3択が多い。「なんでこの返し方なの？」と聞いたら、「以前そう依頼されたので、メモに書いてあります」と。僕がイラッとして「まず謝ってもらっていい？」と書いたら、次からめっちゃ謝ってくるようになったこともあります。メモは定期的に見て、いらないものは消す必要があります。\n\n**3. 作業中に作るファイル。** Claudeはマークダウンというテキストファイルをめっちゃ作ります。設計メモとか、作業の記録とか。ほっとくと無限に増えます。\n\nで、なぜこれが「勘所」なのかというと、仕組みの話になります。Claudeは1回返事をするごとに、そのセッションで読んだものを全部抱えたまま考えます（内部で効率化はされているそうですが、ざっくり言うとこういうことです）。つまり、読んだファイルが多いほど、1回の返事あたりの消費が増える。僕は一時期、1回話しかけるごとに使用率（週に使える量のうち、使った割合）が1%ずつ減っていく、地獄のような状態になっていたことがあります。原因の一つは、知らないうちに増えていたマークダウンファイルを毎回読み直していたことでした。水増し請求されていた気分でした。\n\n対策は次回の「つまずき編」で書きますが、ここでは「Claudeが何を読んでいるかを把握しておかないと、勝手に高くつく」とだけ覚えておいてください。\n\n## 権限は自分で決める\n\nClaudeが何を勝手にやっていいかは、自分で決められます。\n\nセッションごとに「どのくらい自由に動いていいか」のモードを選べるのに加えて、もう少し細かく、動作ごとに許可と禁止を設定できます。ファイルを作るのはOK、消すのはダメ、みたいな感じです。\n\n僕はかなり緩めにしています。何でもできるようにして、削除だけ許可していません。副作用として、作るのを許しているぶん、さっきのマークダウンファイルがとんでもなく増えるんですが、それはそれ。\n\nひとつコツがあります。Claudeは「できません」と言ってくることがよくあるんですが、これは「今の設定では」という意味のことが多い。最初のころ、メモを書き換えてと頼んだら「私には書き換えられません」と言われて、そうなんだと思っていたら、設定を変えたら普通にできました。「できません」と言われたら、「権限を変えればできる？」と聞き直すクセをつけると、だいぶ話が進みます。\n\n## サブエージェントという別人\n\nターミナルのClaudeには、「別のClaudeを立てて、一部の作業を任せる」という機能があります。これをサブエージェントと呼んでいます。\n\n僕がいちばん使っているのは、「素の状態の別人に見せる」という使い方です。\n\n長いセッションで一緒に作っていると、メインのClaudeは会話の流れに引きずられます。たとえば画面に出す文言。作っている途中の会話で使っていた言葉が、そのままボタンに載ってきたりする。同じ流れの中にいるClaudeにそれを見せても、なかなか気づきません。\n\nなので、アプリができたら、まっさらなサブエージェントを立てて、画面の文言のルールだけを読んでもらって、アプリを見て、評価してもらっています。会話の流れを知らない別人なので、ちゃんと引っかかってくれます。\n\n## 使える量には上限がある\n\n最後に、使用量の話です。定額プランでも、週で使える量に上限があります。\n\n8月の後半、僕は2日目で週の3割を使ってしまう、ということをやっていました。今は意識するようになって、いろいろ作っても週の3割くらいで収まっています。差は、さっきのマークダウンの話と、コードをどう読んでもらうかの工夫です。これも次回に書きます。\n\n雑にやると本当にすぐ止まります。ここは、これから始める人にいちばん気をつけてほしいところです。\n\n## 道具の話はここまで\n\nまとめると、こうです。\n\n- 入口は3つ。アプリを作るならターミナル。\n- 携帯から動かせる。\n- Claudeは、指示書と、自分のメモと、作業ファイルを抱えている。抱えたぶんだけ高くつく。\n- 権限は自分で決める。「できません」は「今の設定では」。\n- 別人（サブエージェント）に見せると、流れに引きずられない目で見てくれる。\n- 使える量には上限がある。\n\n次回は、この道具を使って、実際に何につまずいたかを書きます。Claudeが何を言っているか分からなかった時期の話とか、変なボタンが量産される話とか。\n\n---\n\nneggy（ネギー）。KTOKの開発室「ねぎラボ」で、業務改善と、そのための自動化・支援アプリの構築をしています。\n", B="# 業務改善のためにClaudeでアプリを作る仕事の、道具の話\n\n（2026年9月時点、僕の使い方です。設定や時期で変わるところがあるので、そのつもりで読んでください）\n\n## はじめに\n\nneggy（ネギー）です。KTOKという会社で、業務改善の支援をしています。いま使っているExcelや管理ソフトはそのままに、作業の負担を軽くする手段を考えて、そのための道具を揃えるのが仕事です。\n\nその道具を作る場所として、KTOKの中に「ねぎラボ」という開発室を持っていて、Claudeを使ってアプリを作っています。コードは手で書きません。業務を見て、要件を詰めて、Claudeに作ってもらって、実際に使える状態まで仕上げる。コードの中身を追うより、Claudeに動きを言語化してもらって、それを読んで判断する方に時間を使っています。\n\nこの夏に業務改善の中で作って納めたものだと、こんなものがあります。\n\n- イベント運営会社の出店申込（4つのツールを行き来していたのを1画面に）\n- アルバイトの支払い計算\n- 建設会社向けの図面PDFのマスク編集アプリ\n- 謎解きイベント用のアプリ\n\n要するに、既存のアプリケーションにはない、クライアントの環境や作業手順にマッチする業務アプリケーションを作っています。\n\nとはいえ、「こんなに作れます」という話がしたいわけではありません。業務改善の相談を受けていると、アプリは目的ではなく手段です。ただ、その手段としてClaudeが実際にどう働いていて、どこでつまずくのかは、まだあまり語られていない気がします。\n\nなので、これから何本かに分けて、何を使って、どこでつまずいて、どう考えて作っているのかを書いていきます。Claudeでアプリを作ることに興味がある人が、実際に始めるときの地図になれば、という趣旨です。\n\n1本目は道具の話です。Claudeって結局、何をどこから動かしているのか。実務で使っている目線で、次の3つの順に整理します。\n\n- どこから動かすのか\n- Claudeは何を抱えていて、なぜ高くつくのか\n- Claudeに何をどこまで任せるのか\n\n## どこから動かすのか\n\n### 入口は3つある\n\nチャットのClaudeは知っている人が多いと思います。僕も最初はそれしか知りませんでした。アプリを作るようになって分かったのは、Claudeには入口が3つあるということです。\n\n1. **チャット**（デスクトップアプリやブラウザ）。ふつうに会話する画面です。つないだサービス（Gmail、カレンダー、Driveなど）を動かせます。メールを下書きしてもらう、予定を入れてもらう、スライドを作ってDriveに置いてもらう、といった使い方はここ。\n2. **Claude Code**（ターミナル）。黒い画面に文字を打つやつです。手元のパソコンのファイルを直接読み書きできます。アプリ作りの本体はここ。\n3. **ブラウザ**（Chrome拡張）。Claudeがブラウザを操作します。ページを開いて、入力して、次へ進む、を代わりにやってくれます。\n\nClaude Codeは、デスクトップアプリの中にも同じものが入っています。少し前までは新しい機能がターミナルに先に入っていましたが、今はほとんど差がありません。残っている違いは、ターミナルだとプログラムから自動で立ち上げられることくらいです。僕はその仕組みを組んでいるのでターミナルで使っていて、この記事でも「ターミナル」と呼びます。\n\n### アプリを作るならターミナル\n\n僕はアプリを作るのに「ターミナルは必須」と言っています。理由は3つです。\n\n- 手元のファイルを触れるのがClaude Codeだから。アプリの中身はファイルなので、ここがないと始まりません。\n- 「この作業は別のClaudeに任せて」と、自分で指名できるのがClaude Codeだから。後で書くサブエージェントの話です。チャットの方も裏で分担することはあるみたいですが、こっちから指定はできません。\n- ブラウザを動かす指示を、アプリ作りと同じ会話の中で出せるから。\n\n3つ目は、たとえばこういうことです。最近やった例だと、あるサービスの申し込みページを「これ申し込んどいて」と言ったら、勝手にブラウザを開いてページまで行って、「ここと、ここだけ入力してください」と戻してきて、入れたと言ったらまた次の画面に進んでくれる、みたいな使い方もできるイメージです。\n\nチャットで使っているGmailやDriveも、設定すればターミナル側からつなげます。なので僕の感覚では、ターミナルがあれば、チャットでできることはだいたいできます。逆は無理です。これからアプリを作りたいという人は、最初にターミナルを入れるのが近道だと思います。\n\n### 慣れるまでにつまずいたこと\n\nただ、初めて触る人には、正直とっつきにくいと思います。僕も最初は、セッション（1本の会話）の一覧にどう戻るのか、名前をどう変えるのか、分かりませんでした。\n\n始めたころの失敗をもうひとつ。終わったセッションを、どんどん消していました。セッションは、あとから読み返して次の仕事に引き継げる記録です。今は全部残しています。\n\n### 携帯から動かす\n\nターミナルは、パソコンの前に座っていないと使えないと思っていたんですが、そうでもありません。\n\n「リモートコントロール」という機能をつけてセッションを立ち上げると、同じセッションを携帯からも見て、指示が出せます。僕は今、ほとんどこの形です。指示は携帯から出して、動きの確認だけパソコンの前に来て、「ここの文字が違う」「ここの動きが違う」とやる。\n\nもうひとつ面倒だったのが、新しいセッションを立てることです。セッションは長くなるとトークンを食うので（理由は次の章で書きます）、こまめに新しいセッションに切り替えたい。でも、そのたびにパソコンの前に来るのが面倒でした。\n\nこれは「サーバーモード」で解決します。パソコンで\n\n```\nclaude remote-control\n```\n\nを動かしっぱなしにしておくと、Claudeは会話を始めず、受付として待っています。携帯側で新しいセッションを始めると、パソコンの中でClaudeがもう1本立ち上がって、携帯につながります。パソコンには触りません。\n\n僕は最初これを知らなくて、次のセッションを立ち上げる小さなプログラムを自作していました。\n\n## Claudeは何を抱えていて、なぜ高くつくのか\n\nここがいちばんの勘所だと思っています。\n\n### 覚えているものは3種類\n\nClaudeが「覚えているもの」は、ざっくり3種類あります。\n\n**1. 起動時に読む指示書。** セッションを開くと、まず読みに行くファイルがあります（Claude Codeだと CLAUDE.md という名前です）。ここにルールを書いておきます。僕が最初に書いたのは「絶対」「完全に」「必ず」を使わないで、でした。AIってこの手の言葉がすごい好きなので。\n\n**2. Claudeが自分で書くメモ。** Claudeは、こちらに寄せてきます。会話の中で拾ったことをメモに書いて、次からそれに合わせてくる。これが便利でもあり、厄介でもあります。\n\nある時期から、返事の最後に必ず「案は3つです。1、2、3」と言ってくるようになったことがありました。しばらく本当に案が3つあるんだと思っていたんですが、どうも意味のない3択が多い。「なんでこの返し方なの？」と聞いたら、「以前そう依頼されたので、メモに書いてあります」と。\n\n僕がイラッとして「まず謝ってもらっていい？」と書いたら、次からめっちゃ謝ってくるようになったこともあります。\n\nメモは定期的に見て、いらないものは消す必要があります。\n\n**3. 作業中に作るファイル。** Claudeはマークダウンというテキストファイルをめっちゃ作ります。設計メモとか、作業の記録とか。ほっとくと無限に増えます。\n\n### 抱えたぶんだけ高くつく\n\nで、なぜこれが勘所なのか。Claudeは1回返事をするごとに、そのセッションで読んだものを全部抱えたまま考えます（内部で効率化はされているそうですが、ざっくり言うとこういうことです）。つまり、読んだファイルが多いほど、1回の返事あたりの消費が増えます。セッションが長くなるとトークンを食う、と書いたのはこのことです。\n\n僕は一時期、1回話しかけるごとに使用率（週に使える量のうち、使った割合）が1%ずつ減っていく、地獄のような状態になっていたことがあります。原因の一つは、知らないうちに増えていたマークダウンファイルを、毎回読み直していたことでした。水増し請求されていた気分でした。\n\n### 週に使える量には上限がある\n\nこれが効いてくるのは、定額プランでも、週で使える量に上限があるからです。雑にやると本当にすぐ止まります。\n\n8月の後半、僕は2日目で週の3割を使ってしまう、ということをやっていました。今は意識するようになって、いろいろ作っても週の3割くらいで収まっています。差は、さっきのマークダウンの話と、コードをどう読んでもらうかの工夫です。\n\n具体的な対策は次回の「つまずき編」で書きます。ここでは、「Claudeが何を読んでいるかを把握しておかないと、勝手に高くつく」とだけ覚えておいてください。これから始める人に、いちばん気をつけてほしいところです。\n\n## Claudeに何をどこまで任せるのか\n\n### 権限は自分で決める\n\nClaudeが何を勝手にやっていいかは、自分で決められます。セッションごとに「どのくらい自由に動いていいか」のモードを選べるのに加えて、もう少し細かく、動作ごとに許可と禁止を設定できます。ファイルを作るのはOK、消すのはダメ、みたいな感じです。\n\n僕はかなり緩めにしています。何でもできるようにして、削除だけ許可していません。副作用として、作るのを許しているぶん、さっきのマークダウンファイルがとんでもなく増えるんですが、それはそれ。\n\nひとつコツがあります。Claudeは「できません」と言ってくることがよくあるんですが、これは「今の設定では」という意味のことが多い。\n\n最初のころ、メモを書き換えてと頼んだら「私には書き換えられません」と言われて、そうなんだと思っていました。設定を変えたら、普通にできました。「できません」と言われたら、「権限を変えればできる？」と聞き直すクセをつけると、だいぶ話が進みます。\n\n### サブエージェントという別人\n\nターミナルが必須な理由のところで出てきた、「別のClaudeに任せる」話です。ターミナルのClaudeには、別のClaudeを立てて、一部の作業を任せる機能があります。これをサブエージェントと呼んでいます。\n\n僕がいちばん使っているのは、「素の状態の別人に見せる」という使い方です。\n\n長いセッションで一緒に作っていると、メインのClaudeは会話の流れに引きずられます。たとえば画面に出す文言。作っている途中の会話で使っていた言葉が、そのままボタンに載ってきたりする。同じ流れの中にいるClaudeにそれを見せても、なかなか気づきません。\n\nなので、アプリができたら、まっさらなサブエージェントを立てて、画面の文言のルールだけを読んでもらって、アプリを見て、評価してもらっています。会話の流れを知らない別人なので、ちゃんと引っかかってくれます。\n\n## 道具の話はここまで\n\nまとめると、こうです。\n\n- 入口は3つ。アプリを作るならターミナル。\n- ターミナルは携帯から動かせる。\n- Claudeは、指示書と、自分のメモと、作業ファイルを抱えている。抱えたぶんだけ高くつく。\n- 定額プランでも、週に使える量には上限がある。\n- 権限は自分で決める。「できません」は「今の設定では」。\n- 別人（サブエージェント）に見せると、流れに引きずられない目で見てくれる。\n\n次回は、この道具を使って、実際に何につまずいたかを書きます。Claudeが何を言っているか分からなかった時期の話とか、変なボタンが量産される話とか。\n\n---\n\nneggy（ネギー）。KTOKの開発室「ねぎラボ」で、業務改善と、そのための自動化・支援アプリの構築をしています。\n", N="### なぜ散って見えるのか（ライターの見立て）\n- 「何を覚えているか → 読んだぶんだけ消費する → 週の上限」という一本の話が、権限とサブエージェントの節に挟まれて分かれていた\n- 「トークン（後で説明します）」が回収されず、「次回に書きます」も2か所に分かれていた\n- セッションまわりの話（とっつきにくさ・消していた失敗）が「入口」の末尾にあり、携帯の節と離れていた\n- 見出し7つが同じ重さで並び、全体がいくつの塊か最初に見えなかった\n\n### 主な変更\n- 導入の最後に3つの問いを置き、本文を3章（どこから動かすのか／何を抱えていて、なぜ高くつくのか／何をどこまで任せるのか）に\n- 「覚えているもの」と「使える量の上限」を第2章にまとめ、トークンの予告をそこで回収\n- 「次回に書きます」を1か所に\n- 権限とサブエージェントを第3章に\n- 長い段落の分割、納品物を箇条書きに、まとめを本文の順に\n\n### ライターが判断を求めている点\n- 第2章に足した「セッションが長くなるとトークンを食う、と書いたのはこのことです」の理解で合っているか\n- 章見出し＋小見出しの2段でよいか（noteでは見出しが増える）\n- 「1回で1%」と「8月後半、2日目で3割」は同じ時期か（同じならつなげられる）\n- 申し込みページの逸話は、実際にやった話か、できるという話か";

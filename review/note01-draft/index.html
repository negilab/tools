<script>m.innerHTML=marked.parse("# 業務改善のためにClaudeでアプリを作る仕事の、道具の話\n\n（2026年9月時点、僕の使い方です。設定や時期で変わるところがあるので、そのつもりで読んでください）\n\n## はじめに\n\nneggy（ネギー）です。KTOKという会社で、業務改善の支援をしています。いま使っているExcelや管理ソフトはそのままに、作業の負担を軽くする手段を考えて、そのための道具を揃えるのが仕事です。\n\nその道具を作る場所として、KTOKの中に「ねぎラボ」という開発室を持っていて、Claudeを使ってアプリを作っています。コードは手で書きません。業務を見て、要件を詰めて、Claudeに作ってもらって、実際に使える状態まで仕上げる。コードの中身を追うより、Claudeに動きを言語化してもらって、それを読んで判断する方に時間を使っています。\n\nこの夏に業務改善の中で作って納めたものだと、こんなものがあります。\n\n- イベント運営会社の出店申込（4つのツールを行き来していたのを1画面に）\n- アルバイトの支払い計算\n- 建設会社向けの図面PDFのマスク編集アプリ\n- 謎解きイベント用のアプリ\n\n要するに、既存のアプリケーションにはない、クライアントの環境や作業手順にマッチする業務アプリケーションを作っています。\n\nとはいえ、「こんなに作れます」という話がしたいわけではありません。業務改善の相談を受けていると、アプリは目的ではなく手段です。ただ、その手段としてClaudeが実際にどう働いていて、どこでつまずくのかは、まだあまり語られていない気がします。\n\nなので、これから何本かに分けて、何を使って、どこでつまずいて、どう考えて作っているのかを書いていきます。Claudeでアプリを作ることに興味がある人が、実際に始めるときの地図になれば、という趣旨です。\n\n1本目は道具の話です。Claudeって結局、何をどこから動かしているのか。実務で使っている目線で、次の3つの順に整理します。\n\n- どこから動かすのか\n- Claudeは何を抱えていて、なぜ高くつくのか\n- Claudeに何をどこまで任せるのか\n\n## どこから動かすのか\n\n### Claudeは、働く場所で分かれている\n\nチャットのClaudeは知っている人が多いと思います。ただ、Claudeにはほかにも、働く場所の違う道具がいくつもあります。\n\n1. **Claude（チャット）**。ふつうに会話する画面です。ブラウザ、デスクトップアプリ、スマホで使えます。つないだサービス（Gmail、カレンダー、Driveなど）を動かせます。\n2. **Claude Code**。パソコンの中で働くClaudeです。手元のファイルを読み書きして、コマンドを動かします。アプリ作りの本体はここ。黒い画面に文字を打つターミナルのほか、デスクトップアプリの「Code」、VS Codeなどの開発用ソフト、ブラウザ版があります。ブラウザ版だけは、手元のパソコンではなくクラウド上で動きます。\n3. **Claude in Chrome**（Chrome拡張）。ブラウザの中で働くClaudeです。ページを開いて、入力して、次へ進む、を代わりにやってくれます。拡張の画面で直接話しかけることも、Claude Codeから動かすこともできます。\n4. **ほかのアプリの中のClaude**。ExcelやPowerPointなどMicrosoft 365のアプリや、Slackの中で使えるものです。\n5. **Claude Platform（API）**。開発者が、自分のサービスにClaudeを組み込むためのものです。\n\nアプリ作りで僕が使っているのは、2と3です。4と5は、この連載では扱いません。\n\nClaude Codeは、ターミナルでもデスクトップアプリでも中身は同じで、指示書や設定も共通です。僕はターミナルで使っていて、この記事でも「ターミナル」と呼びます（理由は次で書きます）。\n\n### アプリを作るならClaude Code、僕はターミナルで\n\nアプリを作るなら、Claude Codeは必須だと思っています。理由は3つです。\n\n- 手元のファイルを触れるから。アプリの中身はファイルなので、ここがないと始まりません。\n- 「この作業は別のClaudeに任せて」と、自分で指名できるから。後で書くサブエージェントの話です。チャットの方も裏で分担することはあるみたいですが、こっちから指定はできません。\n- ブラウザを動かす指示を、アプリ作りと同じ会話の中で出せるから。\n\n3つ目は、たとえばこういうことです。最近やった例だと、あるサービスの申し込みページを「これ申し込んどいて」と言ったら、勝手にブラウザを開いてページまで行って、「ここと、ここだけ入力してください」と戻してきて、入れたと言ったらまた次の画面に進んでくれる、みたいな使い方もできるイメージです。\n\nそのうえで、僕はClaude Codeをターミナルで起動しています。そこにリモートをつけて、デスクトップアプリからも携帯からも同じセッションを触れるようにしている、という形です。ターミナルにしている理由は2つあります。\n\n- **起動の仕方を自分で決められるから。** ターミナルなら、プログラムから自動で立ち上げられます。どのフォルダで、どんな名前で、リモートをつけて、最初に何を読ませるか、まで決めて起動できます。\n- **権限をすぐいじれるから。** 僕はClaudeに何を許すか（後で書く権限の話です）をよく変えます。ターミナルなら、会話の途中で `/permissions` と打てば、その場で許可と禁止を足したり外したりできます。デスクトップアプリでは、このコマンドは使えません。\n\nチャットで使っているGmailやDriveも、設定すればClaude Code側からつなげます。なので僕の感覚では、Claude Codeがあれば、チャットでできることはだいたいできます。逆は無理です。\n\nただ、初めて触る人には、正直とっつきにくいと思います。僕も最初は、セッション（1本の会話）の一覧にどう戻るのか、名前をどう変えるのか、分かりませんでした。\n\n### 携帯から動かす\n\nターミナルは、パソコンの前に座っていないと使えないと思っていたんですが、そうでもありません。\n\n「リモートコントロール」という機能をつけてセッションを立ち上げると、同じセッションを携帯からも見て、指示が出せます。僕は今、ほとんどこの形です。指示は携帯から出して、動きの確認だけパソコンの前に来て、「ここの文字が違う」「ここの動きが違う」とやる。\n\nもうひとつ面倒だったのが、新しいセッションを立てることです。セッションは長くなるとトークンを食うので（理由は次の章で書きます）、こまめに新しいセッションに切り替えたい。でも、そのたびにパソコンの前に来るのが面倒でした。\n\nこれは「サーバーモード」で解決します。パソコンで\n\n```\nclaude remote-control\n```\n\nを動かしっぱなしにしておくと、Claudeは会話を始めず、受付として待っています。携帯側で新しいセッションを始めると、パソコンの中でClaudeがもう1本立ち上がって、携帯につながります。パソコンには触りません。\n\n僕は最初これを知らなくて、次のセッションを立ち上げる小さなプログラムを自作していました。\n\n## Claudeは何を抱えていて、なぜ高くつくのか\n\nここがいちばんの勘所だと思っています。\n\n### 覚えているものは3種類\n\nClaudeが「覚えているもの」は、ざっくり3種類あります。\n\n**1. 起動時に読む指示書。** セッションを開くと、まず読みに行くファイルがあります（Claude Codeだと CLAUDE.md という名前です）。ここにルールを書いておきます。僕が最初に書いたのは「絶対」「完全に」「必ず」を使わないで、でした。AIってこの手の言葉がすごい好きなので。\n\n**2. Claudeが自分で書くメモ。** Claudeは、こちらに寄せてきます。会話の中で拾ったことをメモに書いて、次からそれに合わせてくる。これが便利でもあり、厄介でもあります。\n\nある時期から、返事の最後に必ず「案は3つです。1、2、3」と言ってくるようになったことがありました。しばらく本当に案が3つあるんだと思っていたんですが、どうも意味のない3択が多い。「なんでこの返し方なの？」と聞いたら、「以前そう依頼されたので、メモに書いてあります」と。\n\n僕がイラッとして「まず謝ってもらっていい？」と書いたら、次からめっちゃ謝ってくるようになったこともあります。\n\nメモは定期的に見て、いらないものは消す必要があります。\n\n**3. 作業中に作るファイル。** Claudeはマークダウンというテキストファイルをめっちゃ作ります。設計メモとか、作業の記録とか。ほっとくと無限に増えます。\n\n### 抱えたぶんだけ高くつく\n\nで、なぜこれが勘所なのか。Claudeは1回返事をするごとに、そのセッションで読んだものを全部抱えたまま考えます（内部で効率化はされているそうですが、ざっくり言うとこういうことです）。つまり、読んだファイルが多いほど、1回の返事あたりの消費が増えます。セッションが長くなるとトークンを食う、と書いたのはこのことです。\n\n僕は一時期、1回話しかけるごとに使用率（週に使える量のうち、使った割合）が1%ずつ減っていく、地獄のような状態になっていたことがあります。原因の一つは、知らないうちに増えていたマークダウンファイルを、毎回読み直していたことでした。水増し請求されていた気分でした。\n\n### 週に使える量には上限がある\n\nこれが効いてくるのは、定額プランでも、週で使える量に上限があるからです。雑にやると本当にすぐ止まります。\n\n8月の後半、僕は2日目で週の3割を使ってしまう、ということをやっていました。今は意識するようになって、いろいろ作っても週の3割くらいで収まっています。差は、さっきのマークダウンの話と、コードをどう読んでもらうかの工夫です。\n\n具体的な対策は次回の「つまずき編」で書きます。ここでは、「Claudeが何を読んでいるかを把握しておかないと、勝手に高くつく」とだけ覚えておいてください。これから始める人に、いちばん気をつけてほしいところです。\n\n## Claudeに何をどこまで任せるのか\n\n### 権限は自分で決める\n\nClaudeが何を勝手にやっていいかは、自分で決められます。セッションごとに「どのくらい自由に動いていいか」のモードを選べるのに加えて、もう少し細かく、動作ごとに許可と禁止を設定できます。ファイルを作るのはOK、消すのはダメ、みたいな感じです。\n\n僕はかなり緩めにしています。何でもできるようにして、削除だけ許可していません。副作用として、作るのを許しているぶん、さっきのマークダウンファイルがとんでもなく増えるんですが、それはそれ。\n\nひとつコツがあります。Claudeは「できません」と言ってくることがよくあるんですが、これは「今の設定では」とか「Claudeが自分で決めたルールでは」という意味のことが多い。\n\n最初のころ、メモを書き換えてと頼んだら「私には書き換えられません」と言われて、そうなんだと思っていました。設定を変えたら、普通にできました。「できません」とか「ルールに反します」と言われても、完全に無理ではないことがほとんどですし、Claudeが過去の会話から忖度して作った（人間からすると意味のない）ルールであるパターンもあります。どのようにすれば可能になるか聞き直すクセをつけると、だいぶ話が進みます。\n\n### サブエージェントという別人\n\nClaude Codeが必須な理由のところで出てきた、「別のClaudeに任せる」話です。Claude Codeには、別のClaudeを立てて、一部の作業を任せる機能があります。これをサブエージェントと呼んでいます。\n\n僕がいちばん使っているのは、分担です。メインはFableで動かして、全体の流れや整合性を保ったまま判断してもらう。サブエージェントは、込み入ったコードを書くならOpus、調べもの程度ならSonnet、のようにモデルを明示して立てています。Maxプランだと、Fableは週に使える量の半分までしか使えないので、細かい作業をほかのモデルに回すと、Fableの分を長持ちさせられます。サブエージェントは自分の作業だけを抱えて動いて、結果をまとめて返してくるので、メインのClaudeが細かい作業の中身で膨らまずに済みます。\n\nもうひとつ、tips的に挙げると、よく出る悩みとして、長いセッションで一緒に作っていると、メインのClaudeは会話の流れに引きずられて、良い返事が得られなくなる、というのがあります。たとえば画面に出す文言。作っている途中の会話で使っていた言葉が、そのままボタンに載ってきたりする。同じ流れの中にいるClaudeにそれを見せても、なかなか気づきません。\n\nなので、アプリができたら、まっさらなサブエージェントを立てて、画面の文言のルールだけを読んでもらって、アプリを見て、評価してもらっています。会話の流れを知らない別人なので、ちゃんと引っかかってくれます。\n\n## 道具の話はここまで\n\nまとめると、こうです。\n\n- Claudeは働く場所で分かれている。アプリを作るならClaude Code（僕はターミナル）。\n- ターミナルは携帯から動かせる。\n- Claudeは、指示書と、自分のメモと、作業ファイルを抱えている。抱えたぶんだけ高くつく。\n- 定額プランでも、週に使える量には上限がある。\n- 権限は自分で決める。「できません」は、たいてい「今のままでは」。\n- サブエージェントへの分担で、週制限を効率よく消費できる。\n\n次回は、この道具を使って、実際に何につまずいたかを書きます。Claudeが何を言っているか分からなかった時期の話とか、変なボタンが量産される話とか。\n\n---\n\nneggy（ネギー）。KTOKの開発室「ねぎラボ」で、業務改善と、そのための自動化・支援アプリの構築をしています。\n");</script></body></html>

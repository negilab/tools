<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>やわらか数独</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317171a'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='800' fill='%23ffffff' text-anchor='middle'%3E9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1><span class="t1">やわらか</span><span class="t2">数独</span></h1>
    <div class="stats">
      <span class="stat"><span class="lbl">時間</span><span id="time">0:00</span></span>
      <span class="stat"><span class="lbl">ミス</span><span id="mistakes">0</span></span>
    </div>
  </header>

  <section class="bar">
    <label class="diff">
      <span>むずかしさ</span>
      <select id="difficulty">
        <option value="easy">やさしい</option>
        <option value="normal" selected>ふつう</option>
        <option value="hard">むずかしい</option>
      </select>
    </label>
    <button id="new" class="btn primary" type="button">新しい問題</button>
  </section>

  <section id="confirm" class="sheet" hidden>
    <p>いまの問題をやめて、新しい問題を始めますか？</p>
    <div class="sheet-btns">
      <button id="confirm-no" class="btn" type="button">つづける</button>
      <button id="confirm-yes" class="btn primary" type="button">新しく始める</button>
    </div>
  </section>

  <section class="board-wrap">
    <div id="board" class="board" aria-label="数独の盤面"></div>
    <p id="status" class="status" hidden>問題を作っています…</p>
  </section>

  <section class="controls">
    <div id="palette" class="palette" aria-label="数字"></div>
    <label class="assist">
      <input type="checkbox" id="assist">
      <span class="switch" aria-hidden="true"></span>
      <span class="assist-text">アシスト<small>そこにしか置けない数字のメモを黒丸にする</small></span>
    </label>
    <div class="tools">
      <button id="eraser" class="btn tool" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 21 2.7 16.7a2.4 2.4 0 0 1 0-3.4l9.6-9.6a2.4 2.4 0 0 1 3.4 0l5.6 5.6a2.4 2.4 0 0 1 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>けす
      </button>
      <button id="undo" class="btn tool" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>もどす
      </button>
    </div>
    <p class="hint">数字を選んで、マスを <b>タップでメモ</b>、<b>長押し か ダブルタップで確定</b>。確定すると、同じ行・列・ブロックのメモからその数字が消えます。</p>
    <p class="more"><a href="patterns.html">数字を確定させられるパターン集 →</a></p>
  </section>
</main>

<div id="done" class="overlay" hidden>
  <div class="card">
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <p class="card-eyebrow">できました！</p>
    <p class="card-time" id="done-time">0:00</p>
    <p class="card-sub" id="done-sub"></p>
    <button id="again" class="btn primary" type="button">もう一回</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
